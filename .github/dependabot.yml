# Ein Bot je Repo (platform#3817): Versions-Updates macht hier Renovate (renovate.json,
# Dashboard #3291). Dependabot erzeugte daneben Einzel-PRs fuer dieselben Actions und
# umging die Major-Sperre des Dashboards (setup-node 5 -> 7, setup-python 5 -> 7).
# `open-pull-requests-limit: 0` schaltet nur die Versions-PRs ab; Sicherheits-Updates
# laufen unabhaengig davon weiter. Die Eintraege bleiben, damit die Oekosysteme
# deklariert sind (future_readiness_score D02.3).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
