# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  REUSABLE WORKFLOW: Unified Multi-Repo Deployment Pipeline (ADR-120)      ║
# ║  Staging (main) → Production (promote/tag) mit Health-Check + Rollback    ║
# ║  Usage: uses: iilgmbh/shared-ci/.github/workflows/_deploy-unified.yml@v1
# ╚═══════════════════════════════════════════════════════════════════════════╝
# ⚠️ CONSTRAINT: Reusable workflows (workflow_call) support permissions ONLY
#    at workflow-level, NOT at job-level. Job-level permissions cause
#    startup_failure (0 jobs, no logs). Callers should also set permissions.

name: "🚀 Deploy Unified (ADR-120)"

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      app_name:
        description: "App-Name (z.B. risk-hub) — wird als GHCR Image-Name verwendet"
        required: true
        type: string
      app_path:
        description: "Absoluter Pfad auf dem Server (z.B. /opt/risk-hub)"
        required: true
        type: string
      health_check_url:
        description: "Health-Check URL — MUSS auf /healthz/ enden (ADR-022)"
        required: false
        type: string
        default: ""
      image_tag_override:
        description: "Rollback auf expliziten Image-Tag (z.B. v1.2.1) — leer = auto"
        required: false
        type: string
        default: ""
      target_environment:
        description: "Ziel-Environment erzwingen (leer=auto, staging, production) — für Promotion"
        required: false
        type: string
        default: ""
      dockerfile_path:
        description: "Pfad zum Dockerfile relativ zum Repo-Root (default: Dockerfile)"
        required: false
        type: string
        default: "Dockerfile"
      import_smoke:
        description: >-
          Shell-Kommando, das NACH dem Build IM frisch gebauten Image läuft, BEVOR
          deployt wird. Non-zero exit lässt den build-Job scheitern → alle Deploys
          (needs: build) werden geskippt → ein nicht-startbares Image erreicht Prod
          nie. Fängt Import-Contract-Drift (ModuleNotFoundError/ImportError), die
          erst zur Laufzeit zuschlägt (z.B. nach Paket-Restructure).
          Leer (default) = Gate aus, Verhalten unverändert.
          Django-Beispiel: "SECRET_KEY=ci-smoke DJANGO_SETTINGS_MODULE=config.settings.test python manage.py check"
        required: false
        type: string
        default: ""
      notify_discord:
        description: "Discord Deploy-Notification senden"
        required: false
        type: boolean
        default: true
      runs_on:
        description: "Runner label (default: self-hosted). Override with ubuntu-latest if no runner registered."
        required: false
        type: string
        default: "self-hosted"
      deploy_runs_on:
        description: >-
          Runner label for the HOST-BOUND deploy jobs (staging/production). These do
          atomic-sync to /opt/<app> on the target host, so they MUST run on that host —
          a generic 'self-hosted' label can land the job on the WRONG runner (e.g. a dev
          box without /opt/<app> writable) -> 'cp: ... Permission denied' and no deploy.
          Set to the deploy host's UNIQUE label (e.g. 'prod-server'). Empty (default) =
          fall back to runs_on, behaviour unchanged.
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_SSH_KEY:
        description: "SSH Key für Production (vorhandener Secret-Name)"
        required: false
      DEPLOY_HOST:
        description: "Production Host (vorhandener Secret-Name)"
        required: false
      DEPLOY_USER:
        description: "SSH User für Production (vorhandener Secret-Name)"
        required: false
      DEPLOY_SSH_FINGERPRINT:
        required: false
      STAGING_SSH_KEY:
        required: false
      STAGING_HOST:
        required: false
      STAGING_USER:
        required: false
      STAGING_SSH_FINGERPRINT:
        required: false
      DISCORD_WEBHOOK:
        required: false
      PROJECT_PAT:
        description: "GitHub PAT for cloning private repos during Docker build"
        required: false

jobs:
  # ── JOB 1: Environment + Image-Tag bestimmen ──────────────────────────────
  resolve:
    name: "🔍 Resolve"
    runs-on: ${{ inputs.runs_on }}
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      deploy_staging: ${{ steps.env.outputs.deploy_staging }}
      deploy_prod: ${{ steps.env.outputs.deploy_prod }}
    steps:
      - name: Resolve environment
        id: env
        run: |
          TARGET="${{ inputs.target_environment }}"

          # Explizites target_environment überschreibt alles (Promotion-Flow)
          if [[ -n "$TARGET" ]]; then
            echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
            if [[ "$TARGET" == "production" ]]; then
              echo "deploy_staging=false" >> "$GITHUB_OUTPUT"
              echo "deploy_prod=true"     >> "$GITHUB_OUTPUT"
            else
              echo "deploy_staging=true"  >> "$GITHUB_OUTPUT"
              echo "deploy_prod=false"    >> "$GITHUB_OUTPUT"
            fi
          # Auto-Detect: Tag → Production, main → Staging
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "deploy_staging=false"   >> "$GITHUB_OUTPUT"
            echo "deploy_prod=true"       >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging"    >> "$GITHUB_OUTPUT"
            echo "deploy_staging=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_prod=false"      >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging"    >> "$GITHUB_OUTPUT"
            echo "deploy_staging=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_prod=false"      >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tag
        id: tag
        run: |
          if [[ -n "${{ inputs.image_tag_override }}" ]]; then
            echo "image_tag=${{ inputs.image_tag_override }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            SHA="${{ github.sha }}"
            echo "image_tag=main-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

  # ── JOB 2: Build & Push Docker Image ──────────────────────────────────────
  build:
    name: "🐳 Build"
    runs-on: ${{ inputs.runs_on }}
    needs: resolve
    if: inputs.image_tag_override == ''
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Eigene Docker-Anmeldung je Lauf statt der des Runner-Benutzers.
      #
      # `runs_on` ist ein selbst-gehosteter Runner, und die laufen als root auf
      # dem Prod-Host (`systemctl cat 'actions.runner*'` → User=root). Ohne
      # diese Umleitung schreibt `docker/login-action` nach
      # /root/.docker/config.json — also in genau die Anmeldung, aus der der
      # Host seine eigenen Images zieht — und räumt sie am Ende des Laufs
      # wieder ab.
      #
      # Auf dem Host liegen die Runner von rund zwanzig Repos. Belegt am
      # 2026-08-11: um 07:12:00 stand dort `auths: []`, zeitgleich mit einem
      # Lauf von cad-hub; ein Deploy von Hand für risk-hub scheiterte in
      # derselben Minute mit `unauthorized` — fünf Minuten nach einem
      # nachweislich erfolgreichen `docker manifest inspect`.
      #
      # `unauthorized` sieht dabei aus wie ein fehlender Tag. Nur ein Gegentest
      # gegen den LAUFENDEN Tag trennt beides; ohne ihn lautet der Schluss
      # „Image wurde nicht gebaut" — und der hielt einen Prod-Deploy über
      # 98 Commits blockiert, ohne dass es jemand merkte.
      #
      # Warum als Schritt und nicht als `env:` am Job: der `runner`-Kontext ist
      # auf Job-Ebene nicht verfügbar (actionlint: „context 'runner' is not
      # allowed here"). Über `$GITHUB_ENV` gilt die Variable ab hier für ALLE
      # folgenden Schritte — auch für künftige, die jemand später ergänzt.
      #
      # Siehe risk-hub:KONZ-014 und iilgmbh/risk-hub#576.
      - name: "Docker-Anmeldung dieses Laufs vom Host trennen"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/.docker"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> "$GITHUB_ENV"
          echo "Docker-Anmeldung dieses Laufs: ${RUNNER_TEMP}/.docker"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.image_tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.resolve.outputs.image_tag }}
          secrets: |
            PROJECT_PAT=${{ secrets.PROJECT_PAT }}

      # Gate: ein nicht-startbares Image darf nicht deployt werden. Läuft das
      # consumer-definierte import_smoke-Kommando IM frisch gebauten Image; bei
      # non-zero exit fällt dieser build-Job → deploy-* (needs: build) skippen.
      # Fängt Import-Contract-Drift (ModuleNotFoundError/ImportError), die sonst
      # erst Wochen später als Prod-Crash-Loop sichtbar wird. Opt-in (leer = aus).
      - name: Import smoke (gate deploy on a runnable image)
        if: ${{ inputs.import_smoke != '' }}
        env:
          SMOKE_CMD: ${{ inputs.import_smoke }}
        run: |
          IMG="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.image_tag }}"
          echo "::group::Import smoke on $IMG"
          echo "cmd: $SMOKE_CMD"
          docker pull "$IMG"
          # --entrypoint sh: das App-Entrypoint (z.B. /entrypoint.sh mit
          # "DJANGO_SETTINGS_MODULE must be set"-Guard) überspringen — die Smoke
          # testet den IMPORT-Graph, nicht das Entrypoint. Env setzt der Consumer
          # inline im SMOKE_CMD. Ohne den Bypass false-failt das Gate an
          # entrypoint-geguardeten Images (cad-hub#21-Deploy, run 26946093189).
          docker run --rm --entrypoint sh "$IMG" -c "$SMOKE_CMD"
          echo "::endgroup::"

  # ── JOB 3a: Deploy to Staging ─────────────────────────────────────────────
  deploy-staging:
    name: "🧪 Staging"
    runs-on: ${{ inputs.deploy_runs_on || inputs.runs_on }}
    needs: [resolve, build]
    if: |
      always() &&
      needs.resolve.outputs.deploy_staging == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    concurrency:
      group: deploy-${{ inputs.app_name }}-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: https://staging.${{ inputs.app_name }}.iil.pet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── Deploy-Preflight (platform KONZ-054 E1, Owner-Go 2026-08-30 "77") ──────
      # Liest infra/ports.yaml + infra/hosts.yaml aus platform (oeffentlich) und
      # prueft VOR dem Deploy: ist der Dienst `aktiv`, und ist DIESER Runner-Host
      # der deklarierte prod_host? Anlass: coach-hub war stillgelegt deklariert und
      # wurde trotzdem auf prod deployt, wo es 25 h in einer Fehlerschleife lief.
      # Exit 1 (Verstoss) / 2 (Datenfehler) = kein Deploy. Exit 3 (Dienst nicht in
      # ports.yaml) = Warnung, kein Block: eine Scope-Luecke darf nicht 23 Repos
      # anhalten, sie muss aber sichtbar sein — sie steht in der Job-Summary.
      - name: "Deploy-Preflight (platform ports.yaml/hosts.yaml)"
        env:
          APP: ${{ inputs.app_name }}
          ENVIRONMENT: staging
        run: |
          set -u
          B=https://raw.githubusercontent.com/achimdehnert/platform/main
          D=$(mktemp -d)
          for f in tools/deploy_preflight.py infra/ports.yaml infra/hosts.yaml; do
            curl -fsSL --retry 3 "$B/$f" -o "$D/$(basename "$f")" || { echo "::error::Preflight: $f aus platform nicht ladbar — kein Deploy ohne Deklaration"; exit 2; }
          done
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml
          HOST=$(hostname -I 2>/dev/null | awk '{print $1}')
          set +e
          OUT=$(python3 "$D/deploy_preflight.py" --app "$APP" --environment "$ENVIRONMENT" --deploy-host "$HOST" --ports "$D/ports.yaml" --hosts "$D/hosts.yaml" 2>&1); rc=$?
          set -e
          echo "$OUT"
          { echo "### Deploy-Preflight (${APP}, ${ENVIRONMENT}, Ziel ${HOST}) — Exit ${rc}"; echo; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) ;;
            3) echo "::warning title=Preflight Scope-Luecke::${OUT}" ;;
            *) echo "::error title=Preflight blockt Deploy::${OUT}"; exit "$rc" ;;
          esac


      # Sync staging compose file from the consuming repo to the host.
      # Without this, deploy.sh runs `docker compose pull` against
      # whatever stale compose file is on the server (may reference a
      # removed service / wrong image path / outdated port mapping).
      - name: Sync docker-compose.staging.yml to host
        if: hashFiles('docker-compose.staging.yml') != ''
        # v1.0.0 ist composite. v0.1.7 war eine Docker-Action, deren Image GitHub
        # bereits im Job-Setup baut — auf self-hosted Runnern stirbt der Job dort,
        # bevor ein Step laeuft (#1845, Wiederholung von shared-ci#22).
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          source: "docker-compose.staging.yml"
          # scp-action treats `target` as a directory and creates the file
          # inside it. deploy.sh detects `docker-compose.staging.yml` for the
          # staging environment automatically (see ADR-022).
          target: "${{ inputs.app_path }}"
          overwrite: true

      - name: Deploy to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        timeout-minutes: 15
        env:
          # Kurzlebiger Workflow-Token → deploy.sh loggt damit frisch bei GHCR ein,
          # statt an der manuell gepflegten Host-Token-Datei zu hängen. Diese Zeilen
          # stammen aus der iilgmbh-Linie (shared-ci#10 Facette A) und fehlten in der
          # platform-Linie — Realfall 2026-08-02: drei Deploys scheiterten am Host-Pull
          # mit "denied", weil der gespeicherte Host-Login veraltet war.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            /opt/scripts/deploy.sh \
              "${{ inputs.app_name }}" \
              "${{ inputs.app_path }}" \
              "${{ needs.resolve.outputs.image_tag }}" \
              "staging" \
              "${{ inputs.health_check_url }}"

  # ── JOB 3b: Deploy to Production ──────────────────────────────────────────
  # Self-hosted runners run ON prod-server → direct execution, no SSH needed.
  # Falls back to SSH if runs_on != self-hosted (e.g. ubuntu-latest).
  deploy-production:
    name: "🚀 Production"
    runs-on: ${{ inputs.deploy_runs_on || inputs.runs_on }}
    needs: [resolve, build]
    if: |
      always() &&
      needs.resolve.outputs.deploy_prod == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    concurrency:
      group: deploy-${{ inputs.app_name }}-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── Deploy-Preflight (platform KONZ-054 E1, Owner-Go 2026-08-30 "77") ──────
      # Liest infra/ports.yaml + infra/hosts.yaml aus platform (oeffentlich) und
      # prueft VOR dem Deploy: ist der Dienst `aktiv`, und ist DIESER Runner-Host
      # der deklarierte prod_host? Anlass: coach-hub war stillgelegt deklariert und
      # wurde trotzdem auf prod deployt, wo es 25 h in einer Fehlerschleife lief.
      # Exit 1 (Verstoss) / 2 (Datenfehler) = kein Deploy. Exit 3 (Dienst nicht in
      # ports.yaml) = Warnung, kein Block: eine Scope-Luecke darf nicht 23 Repos
      # anhalten, sie muss aber sichtbar sein — sie steht in der Job-Summary.
      - name: "Deploy-Preflight (platform ports.yaml/hosts.yaml)"
        env:
          APP: ${{ inputs.app_name }}
          ENVIRONMENT: production
        run: |
          set -u
          B=https://raw.githubusercontent.com/achimdehnert/platform/main
          D=$(mktemp -d)
          for f in tools/deploy_preflight.py infra/ports.yaml infra/hosts.yaml; do
            curl -fsSL --retry 3 "$B/$f" -o "$D/$(basename "$f")" || { echo "::error::Preflight: $f aus platform nicht ladbar — kein Deploy ohne Deklaration"; exit 2; }
          done
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml
          HOST=$(hostname -I 2>/dev/null | awk '{print $1}')
          set +e
          OUT=$(python3 "$D/deploy_preflight.py" --app "$APP" --environment "$ENVIRONMENT" --deploy-host "$HOST" --ports "$D/ports.yaml" --hosts "$D/hosts.yaml" 2>&1); rc=$?
          set -e
          echo "$OUT"
          { echo "### Deploy-Preflight (${APP}, ${ENVIRONMENT}, Ziel ${HOST}) — Exit ${rc}"; echo; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) ;;
            3) echo "::warning title=Preflight Scope-Luecke::${OUT}" ;;
            *) echo "::error title=Preflight blockt Deploy::${OUT}"; exit "$rc" ;;
          esac


      # ADR-021 §2.17 — fail-loud + atomic sync + compose_sha verify.
      # ADR-021 §2.20 — deploy-intent manifest (Intent-Token).
      #
      # 1. Assert docker-compose.prod.yml present (fail-loud — no silent fallback).
      # 2. Compute SHA-256 of the compose file.
      # 3. Write .deploy-manifest.json: commit + run_id + compose_sha + timestamp.
      #    deploy.sh reads this manifest as the CI Intent-Token (§2.20) and verifies
      #    the on-host sha256 matches before running `docker compose up` (§2.17).
      # 4. Atomic sync: copy compose to temp path, verify sha, rename atomically.
        #
        # Warum compose_files (platform#2586 K3, 2026-09-01): bisher wurde GENAU EINE
        # Datei gesynct und im Manifest gefuehrt. deploy.sh nahm daneben nur einen
        # weiteren, hart benannten Namen in die -f-Kette (docker-compose.override.yml,
        # platform#1063). Jede andere Overlay-Datei blieb draussen — und
        # `up --remove-orphans` LOESCHT deren Container.
        #
        # Realfall 2026-09-01 (mcp-hub): `mcp_hub_rag` wurde 34 Minuten nach seiner
        # Erzeugung entfernt, ausgeloest vom selben Merge, der ihn gebaut hatte.
        # `llm_gateway` und `mcp_hub_grafana` waren aus demselben Grund schon vorher
        # verschwunden, ohne dass es jemandem auffiel.
        #
        # Das Manifest ist die DEKLARATION: deploy.sh baut seine -f-Kette daraus und
        # nicht aus einem Glob am Host. Eine Host-Datei, die hier nicht steht, faehrt
        # nicht mit (KONZ-015-Fehlerklasse: undeklarierte Host-Dateien).
      - name: Assert compose + write manifest + atomic sync (ADR-021 §2.17/§2.20)
        id: compose_sync
        run: |
          set -euo pipefail

          # §2.17 fail-loud
          if [ ! -f docker-compose.prod.yml ]; then
            echo "::error title=ADR-021 §2.17::docker-compose.prod.yml absent — refusing to deploy against stale host compose."
            exit 1
          fi

          # compute sha256
          COMPOSE_SHA=$(sha256sum docker-compose.prod.yml | awk '{print $1}')
          echo "compose_sha=${COMPOSE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ compose sha256: ${COMPOSE_SHA}"

            # Prod-relevante compose-Dateien einsammeln. Ausgeschlossen sind
            # Dateien anderer Umgebungen und die nackte docker-compose.yml — die
            # ist neben einer prod.yml die Entwicklungs-Datei, genau wie deploy.sh
            # sie liest.
            # --- AUSWAHL-ANFANG (scripts/checks/compose_liste_check.sh fuehrt genau
            #     diesen Block gegen Fixtures aus — er ist die einzige Quelle der
            #     Auswahl. Eine Kopie im Test wuerde davon wegdriften und dann nichts
            #     mehr ueber den echten Deploy belegen.)
            COMPOSE_LISTE=()
            for f in docker-compose*.yml docker-compose*.yaml; do
              [ -f "$f" ] || continue
              case "$f" in
                # Andere Umgebungen beschreiben nicht den Prod-Stack.
                *staging*|*dev*|*test*|*ci*|*local*|*example*) continue ;;
              esac
              COMPOSE_LISTE+=("$f")
            done
            # Die nackte Datei faellt nur weg, WENN es eine prod-Datei gibt — Repos ohne
            # prod-Datei haben in ihr ihren einzigen Stack. Spiegelt die Basisdatei-Wahl
            # in platform/scripts/deploy.sh.
            if printf '%s\n' "${COMPOSE_LISTE[@]:-}" | grep -qx docker-compose.prod.yml; then
              _GEFILTERT=()
              for f in "${COMPOSE_LISTE[@]}"; do
                case "$f" in docker-compose.yml|docker-compose.yaml) continue ;; esac
                _GEFILTERT+=("$f")
              done
              COMPOSE_LISTE=("${_GEFILTERT[@]}")
            fi
            # --- AUSWAHL-ENDE
            echo "  compose-Dateien: ${COMPOSE_LISTE[*]}"

            COMPOSE_FILES_JSON=$(
              for f in "${COMPOSE_LISTE[@]}"; do
                printf '%s %s\n' "$f" "$(sha256sum "$f" | awk '{print $1}')"
              done | python3 -c 'import json,sys; print(json.dumps(dict(z.split() for z in sys.stdin if z.strip())))'
            )
            echo "  compose_files: ${COMPOSE_FILES_JSON}"
            # Fuer den scp-Schritt (remote runner): Kommaliste ohne Leerzeichen.
            printf 'compose_list=%s\n' "$(IFS=,; echo "${COMPOSE_LISTE[*]}")" >> "$GITHUB_OUTPUT"

          # write intent manifest (§2.20)
          cat > .deploy-manifest.json <<JSON
          {
            "app":         "${{ inputs.app_name }}",
            "commit":      "${{ github.sha }}",
            "run_id":      "${{ github.run_id }}",
            "compose_sha": "${COMPOSE_SHA}",
              "compose_files": ${COMPOSE_FILES_JSON},
            "written_at":  "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          # atomic sync — self-hosted runner runs ON the prod server
          if [ "${{ inputs.runs_on }}" != "ubuntu-latest" ]; then
              for f in "${COMPOSE_LISTE[@]}"; do
                QUELL_SHA=$(sha256sum "$f" | awk '{print $1}')
                TMP="${{ inputs.app_path }}/$f.tmp$$"
                cp "$f" "$TMP"
                # verify copy is intact before rename
                COPY_SHA=$(sha256sum "$TMP" | awk '{print $1}')
                if [ "$COPY_SHA" != "$QUELL_SHA" ]; then
                  rm -f "$TMP"
                  echo "::error::sha256 mismatch after copy ($f — corrupt transfer)"
                  exit 1
                fi
                mv -f "$TMP" "${{ inputs.app_path }}/$f"
                echo "  synced: $f"
              done
              cp .deploy-manifest.json "${{ inputs.app_path }}/.deploy-manifest.json"
              echo "✅ atomic sync complete (self-hosted, ${#COMPOSE_LISTE[@]} Datei(en))"
          fi

      - name: Sync compose + manifest to host (remote runner)
        if: startsWith(inputs.runs_on, 'ubuntu')
        # composite statt Docker-Action — siehe Begruendung oben (#1845).
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          # Dieselbe Liste wie beim self-hosted-Zweig — sonst haette ein Hub
          # mit Remote-Runner die Overlay-Dateien weiterhin nicht am Host.
          source: "${{ steps.compose_sync.outputs.compose_list }},.deploy-manifest.json"
          target: "${{ inputs.app_path }}/"
          overwrite: true

      - name: Deploy to production (direct — self-hosted runner)
        if: ${{ !startsWith(inputs.runs_on, 'ubuntu') }}
        timeout-minutes: 15
        env:
          # Kurzlebiger Workflow-Token → deploy.sh loggt frisch bei GHCR ein.
          # v1.1.1 hatte das NUR in die SSH-Schritte gepatcht — self-hosted Runner
          # nehmen aber DIESEN Direktpfad (Realfall: Probe-Deploy 30765328996 rot,
          # weil deploy.sh ohne GHCR_TOKEN auf die veraltete Host-Datei zurückfiel).
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          /opt/scripts/deploy.sh \
            "${{ inputs.app_name }}" \
            "${{ inputs.app_path }}" \
            "${{ needs.resolve.outputs.image_tag }}" \
            "production" \
            "${{ inputs.health_check_url }}"

      - name: Deploy to production (SSH — remote runner)
        if: startsWith(inputs.runs_on, 'ubuntu')
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        timeout-minutes: 15
        env:
          # Siehe Staging-Step: frischer GHCR-Login statt veralteter Host-Token-Datei.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            /opt/scripts/deploy.sh \
              "${{ inputs.app_name }}" \
              "${{ inputs.app_path }}" \
              "${{ needs.resolve.outputs.image_tag }}" \
              "production" \
              "${{ inputs.health_check_url }}"

  # ── JOB 4: Discord Notification ───────────────────────────────────────────
  notify:
    name: "📣 Notify"
    runs-on: ${{ inputs.runs_on }}
    needs: [resolve, deploy-staging, deploy-production]
    if: always() && inputs.notify_discord
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK" ]]; then exit 0; fi

          ENV="${{ needs.resolve.outputs.environment }}"
          TAG="${{ needs.resolve.outputs.image_tag }}"
          APP="${{ inputs.app_name }}"

          STAGING_RESULT="${{ needs.deploy-staging.result }}"
          PROD_RESULT="${{ needs.deploy-production.result }}"

          if [[ "$ENV" == "staging" && "$STAGING_RESULT" == "success" ]]; then
            COLOR=3066993; STATUS="✅ Staging deploy erfolgreich"
          elif [[ "$ENV" == "production" && "$PROD_RESULT" == "success" ]]; then
            COLOR=3066993; STATUS="✅ Production deploy erfolgreich"
          else
            COLOR=15158332; STATUS="❌ Deploy fehlgeschlagen"
          fi

          curl -sf --max-time 10 -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$STATUS\",\"color\":$COLOR,\"fields\":[{\"name\":\"App\",\"value\":\"$APP\",\"inline\":true},{\"name\":\"Version\",\"value\":\"$TAG\",\"inline\":true},{\"name\":\"Env\",\"value\":\"$ENV\",\"inline\":true}]}]}"
