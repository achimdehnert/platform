name: ADR Schema Validation

on:
  push:
    paths:
      - "docs/adr/**"
      - "tools/adr_citation_lint.py"
      - "tools/adr_index_check.py"
      - "tools/adr_evidence_paths.py"
      - "tools/adr_allocate.py"
      - "tools/adr_draft_guard.py"
      - "tools/adr_umsetzungsstand_check.py"
      - "scripts/gen_adr_index.py"
      # Gate-Registry: eine `gate:`-Belegzeile (KONZ-065) zeigt auf einen Slug
      # dort — verschwindet er, muss das ADR rot werden, nicht die Registry.
      - "docs/governance/gates/**"
      # Diese Datei selbst — sonst ist der Workflow gegen Aenderungen an sich
      # blind: ein PR, der NUR hier editiert, laeuft nie, und die Aenderung
      # erreicht main ohne einen einzigen Lauf. Genau das war bei der Umstellung
      # auf den reusable Workflow der Fall (PR #1786: 11 gruene Checks, kein
      # einziger davon aus adr-validate.yml).
      - ".github/workflows/adr-validate.yml"
  pull_request:
    paths:
      - "docs/adr/**"
      - "tools/adr_citation_lint.py"
      - "tools/adr_index_check.py"
      - "tools/adr_evidence_paths.py"
      - "tools/adr_allocate.py"
      - "tools/adr_draft_guard.py"
      - "tools/adr_umsetzungsstand_check.py"
      - "scripts/gen_adr_index.py"
      - "docs/governance/gates/**"
      - ".github/workflows/adr-validate.yml"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Generic ADR validation (frontmatter schema, constitution audit, staleness /
  # reference drift) lives in the framework repo, so every ADR-carrying repo runs
  # the same steps and none of them can drift by copy-paste. That drift is not
  # hypothetical: meiki-hub and ttz-hub carried a copied `--adr-dir` flag that
  # `iil-adrfw audit` did not accept, which kept their nightly audit green while
  # auditing nothing for months (iil-adrfw#69).
  #
  # A consuming repo needs exactly this block. Everything below stays here
  # because it is platform-specific tooling, not generic ADR validation.
  adr:
    uses: achimdehnert/iil-adrfw/.github/workflows/_adr-validate.yml@main
    with:
      adr-dir: docs/adr
      audit: true
      audit-gating: false     # platform health is 0.745 with 90 findings — report, don't block
      staleness: true

  platform-checks:
    name: Platform-specific ADR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Pinned to the release that introduced the uniform --adr-dir contract and
      # made an empty/missing ADR directory a configuration error instead of a
      # perfect-health report. The bespoke checks below rely on it being present.
      - name: Install iil-adrfw
        run: pip install "iil-adrfw>=0.8.0"

      # Deploy-ADR-Supersession-Gate (KONZ-011 / ADR-264) — SUGGEST / non-gating.
      # repo-health-rule-discipline: neue Regel startet SUGGEST (0 FPs auf heutigem Baum
      # verifiziert), deterministisch-strukturell. Ein neues Deployment-Strategie-ADR
      # (ID ≥ 264) ohne `supersedes:`/`supersedes_waiver:` waechst den Sprawl.
      # Promotion zu GATING = Teil des Accept von ADR-264 (dann `exit 0` entfernen).
      - name: Deploy-ADR-Supersession-Gate (SUGGEST, non-gating)
        run: |
          set +e
          python3 tools/check_deploy_adr_supersession.py
          exit 0

      # ADR-228 — ein ADR-Entwurf (ADR-DRAFT-*.md, id: ADR-000) darf main nie
      # erreichen; die Nummer faellt beim Merge ueber `tools/adr_allocate.py --apply`.
      # Gating NUR auf dem push-Lauf gegen main (Ereignistyp + Ziel-Branch) — auf
      # einem PR-Zweig ist ein Entwurf der vorgesehene Zustand waehrend der Arbeit
      # und darf den Check nicht roeten (sonst waere jeder WIP-Push auf einem
      # ADR-PR rot). Es gibt keine Merge-Queue (main-required-checks kennt nur
      # required_status_checks + pull_request), daher ist dies die letzte Instanz:
      # der Autor vergibt die Nummer als letzten Schritt vor dem Merge, dieser
      # Check bestaetigt es unmittelbar danach auf main.
      # implementation_status — SUGGEST, nicht gating (repo-health-rule-discipline:
      # neue Regeln starten advisory). Basislinie am 2026-09-08 nach der
      # vollstaendigen Bereinigung: 0 Werte ausserhalb des Schemas
      # + 14 ADRs, die sich als geltend lesen, ohne gebaut zu sein.
      # Pruefung 1 startet also GRUEN — jeder kuenftige Fund ist neu.
      - name: implementation_status pruefen (SUGGEST, non-gating)
        run: |
          set +e
          python3 tools/adr_umsetzungsstand_check.py --adr-dir docs/adr
          exit 0

      - name: ADR-Entwurf darf main nicht erreichen (ADR-228, gating auf main)
        run: |
          # Gaten, wo es noch etwas verhindert: im PR gegen main (vor dem Merge)
          # und beim push auf main (Netz, falls doch etwas durchrutscht). Nur auf
          # push zu gaten waere Obduktion — der Entwurf waere dann schon drin.
          # Ein roter Check am Entwurfs-PR ist das Signal "noch nicht mergebar";
          # er wird gruen, sobald der Autor `adr_allocate.py --apply` laeuft.
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.base_ref }}" = "main" ]; then
            python3 tools/adr_draft_guard.py --adr-dir docs/adr --gate
          elif [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 tools/adr_draft_guard.py --adr-dir docs/adr --gate
          else
            python3 tools/adr_draft_guard.py --adr-dir docs/adr
          fi

      # ADR-211 C5/I4 — Cross-Repo-Ref-Format-Gate (gating).
      # Qualifizierte Refs müssen ^[a-z][a-z0-9-]+:ADR-[0-9]{3}$ matchen.
      - name: ADR cross-repo ref format (ADR-211 C5/I4, gating)
        run: bash scripts/checks/adr_cross_repo_refs.sh docs/adr/

      # ADR citation lint + INDEX consistency — SUGGEST / non-gating
      # (repo-health-rule-discipline: neue Regeln starten als SUGGEST, deterministisch-
      # strukturell, kein LLM). Ergaenzt den staleness-Step (nur depends_on-Frontmatter)
      # um Body-Zitate (dead_ref/stale_filename/external_target) und INDEX.md-Drift
      # (missing_row/ghost_row/status_drift/broken_link/stale_next_free).
      # Promotion-Pfad zu gating: erst die Alt-Funde bereinigen bzw. via
      # docs/adr/.adr-lint-ignore parken, dann hier `--gate` setzen und das
      # `exit 0` entfernen. Skripte selbst exiten im SUGGEST-Modus IMMER 0.
      - name: ADR citation lint + INDEX consistency (SUGGEST, non-gating)
        run: |
          set +e
          python3 tools/adr_citation_lint.py --format github
          python3 tools/adr_index_check.py --format github
          exit 0

      # implementation_evidence-Pfade — SUGGEST / non-gating (repo-health-rule-discipline).
      # Anlass platform#1289: ADR-158 trug `implemented` + vier Evidence-Pfade unter
      # packages/docs-agent/, das seit 2026-04-23 in _ARCHIVED/ liegt — knapp drei Monate
      # unbemerkt, weil `validate` nur das Schema prueft und die Werte wohlgeformt sind.
      # Baseline gegen main nachgemessen am 2026-07-22: 18 Findings (nicht 13 — die
      # frueher hier genannte Zahl stammte von einem aelteren main-Stand). Verteilung
      # ueber 10 ADRs: ADR-175 sieben · ADR-137 und ADR-246 je zwei · ADR-049, ADR-087,
      # ADR-088, ADR-109, ADR-130, ADR-131, ADR-145 je eins; jedes gegen git-Historie
      # bzw. Ziel-Repo verifiziert (0 bekannte Falsch-Positive).
      # platform#1318 raeumt genau diese 10 ADRs auf — auf dessen Stand gemessen:
      # 0 Findings. Promotion zu gating (`--gate` setzen) erst nach sauberer
      # Baseline — vgl. feedback_advisory_scanner_reactivation_needs_baseline
      # (dauerroter non-blocking Check = Alarm-Muedigkeit).
      #
      # KONZ-platform-065 (Owner „D1–D4 ja", 2026-09-23): Promotion auf die
      # Pilotliste `docs/adr/.adr-evidence-pilot` verengt (10 ADRs mit typisierten
      # Belegzeilen path:/gate:/test:/pr:). Dort ist ein Finding rot (`--gate-pilot`
      # → Exit 1, `::error`); ausserhalb der Liste exitet das Skript weiter 0 und
      # meldet `::warning`. Kein `set +e`/`exit 0` mehr — der Exit-Code IST das Gate.
      # Kill-Gate (KONZ-065): >10 % Falsch-Positive ueber 30 Tage → `--gate-pilot`
      # hier entfernen und die Pilotliste loeschen.
      - name: ADR implementation_evidence (SUGGEST; Pilotliste gating, KONZ-065)
        run: python3 tools/adr_evidence_paths.py --format github --gate-pilot

  # ADR Index frisch? — regeneriert index.json + INDEX.md und vergleicht gegen den
  # committeten Stand. Datum-sensitive Zeilen werden beim Diff ausgeblendet, damit
  # der Check tagesstabil ist. Lösung bei Rot: `python3 scripts/gen_adr_index.py`
  # lokal ausführen und das Ergebnis committen.
  #
  # **Eigener Job seit 2026-09-22 (Retro 8946e8, Befund 12).** Vorher lief er als
  # Schritt in `platform-checks` und hieß dort „(gating)" — der Job stand aber
  # nicht in den Required Checks des Rulesets. Folge: ADR-249 wurde mit
  # `status: accepted` in der Datei und `proposed` im Index gemergt, während der
  # Schritt zweimal rot war und niemanden aufhielt. Ein Etikett, das nichts
  # verspricht, ist schlimmer als keins: es lässt den Leser glauben, da sei ein Tor.
  # Als eigener Job ist er required-fähig, ohne die bewusst als `SUGGEST` geführten
  # Nachbarschritte mitzublockieren.
  adr-index-freshness:
    name: ADR index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Index regenerieren und vergleichen
        run: |
          cp docs/adr/index.json docs/adr/index.json.bak
          cp docs/adr/INDEX.md docs/adr/INDEX.md.bak
          python3 scripts/gen_adr_index.py
          # Strip date-sensitive lines before diffing (generated date changes daily)
          strip_dates() {
            grep -v '"generated":' | \
            grep -v '<!-- Last generated:' | \
            grep -v '> Auto-generated'
          }
          strip_dates < docs/adr/index.json.bak > /tmp/index_old.json
          strip_dates < docs/adr/index.json     > /tmp/index_new.json
          strip_dates < docs/adr/INDEX.md.bak  > /tmp/INDEX_old.md
          strip_dates < docs/adr/INDEX.md       > /tmp/INDEX_new.md
          if diff -q /tmp/index_old.json /tmp/index_new.json > /dev/null && \
             diff -q /tmp/INDEX_old.md   /tmp/INDEX_new.md   > /dev/null; then
            echo "✓ ADR index is fresh"
          else
            echo "::error::ADR index is stale — run 'python3 scripts/gen_adr_index.py' and commit the result"
            diff /tmp/index_old.json /tmp/index_new.json || true
            diff /tmp/INDEX_old.md   /tmp/INDEX_new.md   || true
            exit 1
          fi
