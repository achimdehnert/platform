name: Aufschub-Anker-Gate

# Verdrahtet tools/deferral_anchor_check.py — EIN Gate fuer vier gate-pflichtige
# Retro-Muster (deferred-item-no-tracking-issue, workaround-without-tracking-anchor,
# planned-phase-no-issue, tracking-doc-stale-after-new-occurrence), die zusammen der
# direkte Treiber der schwaechsten Score-Dimension risiko_debt sind (Ø 2,55/60 Messungen).
#
# WARUM DIESER PR: das Werkzeug lag seit ceb90db0 gebaut und getestet (22 Tests) im
# Repo — mit NULL Aufrufern. `grep -rn deferral_anchor .github/` war leer. Genau das
# Muster `built-but-never-called`: ein Gate, das nie laeuft, ist Dekoration, und der
# Gate-Audit in #1650 haette es als "Fundstelle vorhanden" gezaehlt.
#
# MODUS: WARNEND seit 2026-10-01 (Owner-Wort "K1 bleibt, warnen", platform#3645 K1).
# Ein Fund wird kommentiert und als ::warning:: gezeigt, der Job bleibt gruen. Grund:
# der Kontext "Aufgeschobene Arbeit braucht einen Anker" steht inzwischen im Ruleset
# von main (Pflicht-Check); ein Fund blockierte damit Merges wegen Redaktion — ein
# fehlender Anker ist Nacharbeit fuer die Liste #3646, kein Grund, fertige Arbeit
# aufzuhalten. Das Ruleset bleibt unveraendert: der Check ist Pflicht, damit ein
# WERKZEUGFEHLER (kein Verdikt) und ein roter Selbsttest den Merge weiter aufhalten.
#
# VORHER blocking 2026-09-02 bis 2026-10-01 (Owner-Entscheid E4, platform#2606).
#
# Der Tool-Selbsttest (Step 1) bleibt blockierend: die Gate-Logik selbst muss korrekt
# sein, bevor ihr Verdikt jemanden aufhaelt. Muster uebernommen von
# test-claim-check.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read
  # issues: read seit 2026-09-10 fuer den Advisory-Schritt unten (`gh api
  # repos/.../issues/N` + `.../comments`) — ohne diesen Eintrag verengt der
  # explizite permissions-Block ihn implizit auf "none".
  issues: read

concurrency:
  group: aufschub-anker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aufschub-anker:
    name: Aufgeschobene Arbeit braucht einen Anker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bot-PRs (nur Dep-Bumps) auslassen — analog test-claim-check.yml/guardian.yml
    if: >
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'renovate/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Step 1 (blockierend): die Gate-Logik muss korrekt sein.
      - name: Tool-Selbsttest
        run: |
          # pyyaml seit 2026-09-02: der Drill der Scharfschaltung liest den
          # `run`-Block DIESES Workflows und fuehrt ihn aus. Ohne die Abhaengigkeit
          # scheitert er hier mit ModuleNotFoundError — gemessen im ersten Lauf
          # dieses PR, der damit sein eigenes Gate rot gefaerbt hat.
          pip install pytest pyyaml --quiet --break-system-packages
          python -m pytest tools/tests/test_deferral_anchor_check.py -q

      - name: PR-Text sammeln
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.txt

      # Ergaenzt 2026-08-29: eine Vertagung im CODE zaehlt so wenig als Tracking
      # wie eine im PR-Text. Der Rueckfall, der das ausgeloest hat, stand in
      # einem Docstring (writing-hub#851) — dort konnte der PR-Text-Scanner ihn
      # per Konstruktion nicht sehen.
      - name: Diff des PR holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" > /tmp/pr.diff || : > /tmp/pr.diff
          wc -l < /tmp/pr.diff | sed 's/^/Diff-Zeilen: /'

      # --block liefert den Befund als Exit-Code (1 = Fund, 2 = Werkzeugfehler). Seit
      # 2026-10-01 (#3645 K1) wird ein Fund nur gewarnt, der Schritt bleibt gruen;
      # rot bleibt allein der Werkzeugfehler. Massgeblich ist der Exit-Code, ausdruecklich nicht die
      # Frage "Ausgabe nicht leer": der saubere Fall druckt ebenfalls eine Zeile
      # ("✅ Aufschub-Anker: …"), ein -s-Test haette also IMMER "Befund" gemeldet.
      # Beide Richtungen lokal falsifiziert, bevor das hier stand.
      # (Die Umformulierung dieser Zeilen ist selbst ein Messergebnis: in der
      # vorherigen Fassung fing das nun scharfe Gate seinen eigenen Workflow-
      # Kommentar als vermeintliche Vertagung — Fehlalarm-Klasse "Entscheidungs-
      # Prosa", protokolliert im PR-Text und in #2606.)
      # Exit 2 (Werkzeugfehler) bleibt ein eigener, laut gemeldeter Fall statt als
      # "kein Fund" verbucht zu werden — ein Melder, der beim Ausfall schweigt, ist
      # schlimmer als keiner.
      # `hat_befund` wird VOR dem Fehlschlag geschrieben; der Kommentar-Schritt liest
      # zusaetzlich `steps.check.outcome`, damit er nicht "sauber" meldet, falls die
      # Ausgabe eines fehlgeschlagenen Schritts einmal nicht ankommt.
      - name: Aufschub-Anker-Check (warnend)
        id: check
        run: |
          set +e
          python tools/deferral_anchor_check.py --block --diff /tmp/pr.diff /tmp/pr_body.txt > /tmp/verdict.txt 2>&1
          rc=$?
          set -e
          cat /tmp/verdict.txt
          case "$rc" in
            0) echo "hat_befund=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "hat_befund=true"  >> "$GITHUB_OUTPUT"
               echo "::warning::Aufgeschobene Arbeit ohne Tracking-Anker im PR-Text oder im Diff — Details im Kommentar am PR. Nacharbeit gehoert auf die Liste #3646; der Merge wird dadurch nicht aufgehalten." ;;
            *) echo "::error::deferral_anchor_check.py brach mit Exit $rc ab (Werkzeugfehler, kein Verdikt)"
               exit 1 ;;
          esac

      # Advisory-Erweiterung 2026-09-10 (Retro-Anlass): am 2026-09-10 standen sechs
      # Folgearbeiten als Aufschub-Prosa ohne Anker in einem SACHSTANDS-KOMMENTAR des
      # Auftrags-Issues (platform#3015) — eine Quelle, die der Check oben (PR-Text +
      # Diff) per Konstruktion nicht sieht: ein Sachstands-Kommentar entsteht oft NACH
      # dem PR-Text und steht in einem anderen Objekt (Issue statt PR). Bewusst
      # ADVISORY, kein neuer Required Check (`continue-on-error: true`): das
      # Auftrags-Issue wird aus der ersten "Refs #N"-Angabe im PR-Text gelesen und ist
      # damit auf die Konvention angewiesen, nicht auf ein verlaessliches Feld — ein
      # rot blockierender Check auf dieser Grundlage waere zu bruechig.
      - name: Aufschub-Anker (Issue-Kommentare, advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_nr=$(grep -oiP 'refs\s*#\K[0-9]+' /tmp/pr_body.txt | head -1 || true)
          {
            echo "### 🗂️ Aufschub-Anker: Issue-Kommentare (advisory)"
            echo
            if [ -z "$issue_nr" ]; then
              echo "Kein \`Refs #N\` im PR-Text gefunden — Issue-Kommentar-Check uebersprungen."
            else
              echo "Auftrags-Issue: #$issue_nr"
              echo '```'
              python3 tools/deferral_anchor_check.py --issue "$issue_nr" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kommentar setzen/aktualisieren
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const MARKER = 'Aufschub-Anker-Gate';
            // Drei Zustaende: sauber, Fund (warnend, Schritt gruen) und
            // Werkzeugfehler (Schritt rot, kein Verdikt). Ein Aufschub-Vorwurf fuer
            // einen Absturz waere die falsche Diagnose.
            const flagge = '${{ steps.check.outputs.hat_befund }}';
            const rot = '${{ steps.check.outcome }}' === 'failure';
            const werkzeugfehler = rot && flagge !== 'true';
            const hatBefund = flagge === 'true' || rot;
            let verdict = '';
            try {
              verdict = fs.readFileSync('/tmp/verdict.txt', 'utf8').trim();
            } catch (e) {
              console.log('Keine Gate-Ausgabe:', e.message);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            const ok = `### ⚓ ${MARKER}\n\n✅ Keine angekündigte Auslassung ohne Tracking-Anker.`;
            const warn = [
              `### ⚓ ${MARKER}`,
              '',
              'Der PR-Text kündigt aufgeschobene Arbeit an, ohne in ihrer Nähe eine',
              'Issue-Referenz zu nennen. Hausregel: **bewusst Ausgelassenes bekommt im',
              'SELBEN Zug ein Tracking-Artefakt** — der PR-Text zählt ausdrücklich NICHT',
              'als Tracking.',
              '',
              '```',
              verdict,
              '```',
              '',
              '_Warnend seit 2026-10-01 (#3645 K1): der Merge wird nicht aufgehalten.',
              'Den Anker nachziehen oder den Treffer als Fehlalarm begründen; offene',
              'Nacharbeit gehört auf die Liste #3646._',
            ].join('\n');

            const fehler = [
              `### ⚓ ${MARKER}`,
              '',
              '🚨 **Kein Verdikt** — das Gate-Werkzeug ist abgebrochen. Das ist weder',
              '"sauber" noch "Aufschub ohne Anker": dieser PR ist ungeprüft.',
              '',
              '```',
              verdict,
              '```',
            ].join('\n');

            const body = werkzeugfehler ? fehler : (hatBefund ? warn : ok);

            if (!hatBefund && !existing) {
              console.log('sauber — kein Kommentar noetig.');
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
