name: "ADR-241: Backup Meter"

# Confirmation der Backup-Baseline (ADR-241 §4 / §Confirmation):
# täglich prüfen, ob je Soll-App ein restic-Offsite-Snapshot < 26 h existiert
# + ein Restore-Feuerübungs-Protokoll < 100 Tage alt vorliegt.
# Verletzung → Issue (Label backup-violation) + Discord.
#
# SCAFFOLD-MODUS: Solange RESTIC_REPOSITORY/RESTIC_PASSWORD_FILE auf dem Runner
# nicht gesetzt sind (Offsite noch nicht provisioniert, ADR-241 §2 offen), wird
# OHNE --snapshots gemessen → alle Apps `deferred`, Meter grün, aber sichtbar
# "noch nicht scharf". Sobald die Storage Box + Key-Escrow stehen, liefert
# `restic snapshots --json` echte Daten und der Meter wird automatisch scharf.

on:
  schedule:
    - cron: "0 5 * * *" # täglich 05:00 UTC (nach den nächtlichen Offsite-Pushes)

# ROT-IST-BEFUND — maschinenlesbarer Marker fuer tools/cron_melder_check.py:
# ein roter Lauf ist hier ein Fund (Verletzung ODER Scope-Luecke), kein Defekt.
#
# Seit 2026-08-30 (KONZ-054 E3): `deferred` ist kein Gruen mehr. Der Meter stand
# 12 Tage auf gruen mit EINER gemessenen von zehn Soll-Apps. Exit 3 (Scope-Luecke)
# faerbt den Lauf rot, erzeugt aber KEIN Issue — das gibt es nur fuer Verletzungen.
# Der Leser des roten Laufs ist cron_melder_check (0.7.2), dessen Befund seit E2
# mit Entscheidungsfrist im Journal steht: einmal entscheiden, dann Ruhe.
  workflow_dispatch:

# Workflow-level default (least privilege, #818 permissions sweep); the
# meter job below already declares its own permissions (issues: write
# for the violation-issue upsert) and overrides this.
permissions:
  contents: read

jobs:
  meter:
    name: "Soll/Ist-Abgleich Offsite-Snapshots"
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Snapshots erheben (nur wenn restic provisioniert)"
        id: snap
        run: |
          set -euo pipefail
          if command -v restic >/dev/null 2>&1 && [ -f /etc/offsite-backup.env ]; then
            set -a; . /etc/offsite-backup.env; set +a
            if restic snapshots --json > /tmp/snapshots.json 2>/dev/null; then
              echo "args=--snapshots /tmp/snapshots.json" >> "$GITHUB_OUTPUT"
              echo "✓ restic-Snapshots erhoben (Meter scharf)"
            else
              echo "args=" >> "$GITHUB_OUTPUT"
              echo "⚠️ restic-Repo nicht erreichbar — Scaffold-Modus"
            fi
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "scaffold=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Backup-Meter im Scaffold-Modus::restic/Env fehlt — es wird NICHT gemessen, ob Backups existieren. Alle Apps gelten als 'deferred'."
          fi

      - name: "Scaffold-Zustand sichtbar machen (#1567)"
        if: steps.snap.outputs.scaffold == 'true'
        run: |
          # Warum dieser Schritt existiert: Der Meter meldete vom 2026-06-21 bis 2026-07-30
          # taeglich 'success', obwohl KEIN einziges Offsite-Backup existierte — 'noch nicht
          # provisioniert' war von 'alles gesichert' nicht unterscheidbar, ohne das Log zu
          # oeffnen. Sechs Wochen lang hat das niemand bemerkt (#1567).
          # Der Lauf bleibt gruen (der Scaffold ist ein bekannter, gewollter Zwischenstand),
          # aber er sagt es jetzt im Job-Summary statt nur in Zeile 51 des Logs.
          {
            echo "## ⚠️ Backup-Meter läuft im Scaffold-Modus"
            echo
            echo "**Es wird nicht gemessen, ob Backups existieren.** \`RESTIC_REPOSITORY\` bzw."
            echo "\`/etc/offsite-backup.env\` fehlen auf dem Runner, daher gelten alle Apps als"
            echo "\`deferred\` und der Meter meldet 0 Verletzungen — unabhängig davon, ob"
            echo "irgendetwas gesichert ist."
            echo
            echo "Grün heißt hier **nicht** \"Backups in Ordnung\", sondern \"noch nichts zu messen\"."
            echo
            echo "Der fehlende Schritt ist die Repository-Provisionierung (ADR-241 → ADR-289)."
            echo "Solange sie aussteht, ist dieser Hinweis der einzige Unterschied zwischen"
            echo "\"nicht provisioniert\" und \"alles gesichert\"."
          } >> "$GITHUB_STEP_SUMMARY"

      # Weichgestellt, damit ein Meter-Absturz nicht den Zeitplan-Job rot faerbt —
      # gemeldet wird er trotzdem: der Schritt "Meter-Absturz melden" unten haengt
      # an steps.meter.outcome und legt dann ein Issue an.
      - name: "Meter ausführen"
        id: meter
        continue-on-error: true
        run: |
          python3 tools/backup_meter.py \
            --expected governance/backup/expected-apps.json \
            --drills-dir docs/runbooks/restore-drills \
            --enforce-drill \
            ${{ steps.snap.outputs.args }} \
            --report /tmp/backup-meter-report.md

      - name: "Issue bei Verletzung (Label backup-violation)"
        if: steps.meter.outputs.violations != '0' && steps.meter.outputs.violations != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/labels" \
            -f name="backup-violation" -f color="b60205" \
            -f description="ADR-241 Meter: Backup-Soll verletzt" \
            >/dev/null 2>&1 || true

          existing=$(gh issue list --label backup-violation --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/backup-meter-report.md
            echo "Kommentar an bestehendes Issue #$existing"
          else
            # --assignee IST die Zustellung — ohne sie benachrichtigt das Issue niemanden.
            gh issue create \
              --title "[backup-violation] backup-meter: Backup-Soll verletzt ($(date -u +%Y-%m-%d))" \
              --label backup-violation \
              --assignee "achimdehnert" \
              --body-file /tmp/backup-meter-report.md
          fi

      - name: "Discord-Alert bei Verletzung"
        if: steps.meter.outputs.violations != '0' && steps.meter.outputs.violations != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "⚠️ DISCORD_WEBHOOK nicht gesetzt — Alert übersprungen"
            exit 0
          fi
          count="${{ steps.meter.outputs.violations }}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python3 -c "import json,sys; print(json.dumps({'content': sys.argv[1]}))" \
            "🚨 **backup-meter (ADR-241)**: ${count} Verletzung(en) — ${run_url}")
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_WEBHOOK" > /dev/null

      - name: "Gate: Meter-Ergebnis durchreichen"
        if: steps.meter.outcome == 'failure'
        run: |
          V="${{ steps.meter.outputs.violations }}"; D="${{ steps.meter.outputs.deferred }}"
          if [ "${V:-0}" != "0" ]; then
            echo "❌ backup-meter meldet ${V} Verletzung(en) (Report siehe Step 'Meter ausführen')"
            exit 1
          fi
          # Exit 3: nichts verletzt, aber ${D} Soll-Apps nicht gemessen. Kein Issue —
          # aber auch kein Gruen ueber ungemessenem Gebiet (KONZ-054 E3).
          echo "::warning title=Scope-Luecke::${D} Soll-App(s) deferred — der Meter sieht nicht alles. Rot ist Befund, nicht Defekt."
          { echo "### Scope-Luecke: ${D} Soll-App(s) nicht gemessen"; echo; head -3 /tmp/backup-meter-report.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          exit 1
