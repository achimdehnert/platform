name: "deploy.sh Gate"

# scripts/deploy.sh ist der Deploy-Entrypoint ALLER Hubs (ADR-120/166) und hatte
# bis illustration-hub#66 weder Test noch Lint — ein Bruch darin fällt erst beim
# nächsten Prod-Deploy auf, und zwar als Ausfall. Dieses Gate hält die Zusagen des
# Migrations-Blocks fest (fail-closed bei Migrations-Fehler/pending, No-op für
# Nicht-Django-Stacks) und prüft die Syntax der Deploy-Werkzeuge.
#
# Läuft auf ubuntu-latest: der Test arbeitet mit einem docker-Stub und braucht
# weder Docker noch Host-Zugang — ein Gate für den Deploy darf nicht selbst von
# der Deploy-Infrastruktur abhängen (gleiche Begründung wie infra-hosts-audit.yml).

on:
  push:
    paths:
      - "scripts/deploy.sh"
      - "tools/deploy-script-drift.sh"
      - "tests/test_deploy_migrate_gate.sh"
      - "tests/test_deploy_ghcr_isolation.sh"
      - "tests/test_deploy_rollback_ziel.sh"
      - ".github/workflows/deploy-sh-gate.yml"
  pull_request:
    paths:
      - "scripts/deploy.sh"
      - "tools/deploy-script-drift.sh"
      - "tests/test_deploy_migrate_gate.sh"
      - "tests/test_deploy_ghcr_isolation.sh"
      - "tests/test_deploy_rollback_ziel.sh"
      - ".github/workflows/deploy-sh-gate.yml"

permissions:
  contents: read

jobs:
  deploy-sh-gate:
    name: Syntax + Migrations-Vertrag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax (bash -n)
        run: |
          bash -n scripts/deploy.sh
          bash -n tools/deploy-script-drift.sh
          bash -n tests/test_deploy_migrate_gate.sh
          bash -n tests/test_deploy_ghcr_isolation.sh
          bash -n tests/test_deploy_rollback_ziel.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/deploy.sh tools/deploy-script-drift.sh

      # platform#1078: ein Aenderung an deploy.sh OHNE Bump von DEPLOY_SH_VERSION
      # macht die Drift unsichtbar — Git und Host tragen dann dieselbe Version bei
      # unterschiedlichem Inhalt, und nur der md5-Vergleich faellt noch auf.
      # Realfall: PR #1898 (+27 Zeilen) liess die Version auf 2026-08-10.1 stehen;
      # deploy-script-drift.sh meldete DRIFT, die VERSION-Spalte sah unauffaellig aus.
      - name: DEPLOY_SH_VERSION mitgezogen?
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- scripts/deploy.sh; then
            alt=$(git show "origin/${{ github.base_ref }}:scripts/deploy.sh" | grep -m1 '^DEPLOY_SH_VERSION=')
            neu=$(grep -m1 '^DEPLOY_SH_VERSION=' scripts/deploy.sh)
            if [ "$alt" = "$neu" ]; then
              echo "::error title=DEPLOY_SH_VERSION nicht gebumpt::scripts/deploy.sh wurde geaendert, \
          $neu ist unveraendert. Host-Drift waere danach nur noch per md5 erkennbar."
              exit 1
            fi
            echo "✓ Version mitgezogen: $alt -> $neu"
          else
            echo "✓ deploy.sh unveraendert — kein Bump noetig"
          fi

      - name: Vertragstest Migrations-Gate
        run: bash tests/test_deploy_migrate_gate.sh

      # platform#1078 Befund 4: die Credential-Isolation ist genauso unsichtbar
      # brechbar wie das Migrations-Gate — ein Deploy, der wieder in die geteilte
      # ~/.docker/config.json schreibt, sieht im Log identisch aus.
      - name: Vertragstest GHCR-Credential-Isolation
        run: bash tests/test_deploy_ghcr_isolation.sh

      # writing-hub#982 / platform#2685: das Rollback hing an einer Zusage
      # (.env) statt an der Wirklichkeit (laufender Container) und scheiterte
      # deshalb an derselben Registry wie der Deploy davor. Auch das ist am
      # Deploy-Log nicht zu sehen — der Deploy war rot, kaputt war der Notausgang.
      - name: Vertragstest Rollback-Ziel + Registry-Wiederholung
        run: bash tests/test_deploy_rollback_ziel.sh
