name: Infra Hosts Audit

# Hält die Infra-SoT infra/hosts.yaml ehrlich (Schema + Frische) und prüft, dass
# kein platform-Workflow auf ein totes Runner-Label zeigt. Läuft auf ubuntu-latest
# (GitHub-hosted) — ein Gate gegen tote self-hosted-Labels darf NICHT selbst von
# self-hosted-Runnern abhängen. Hintergrund: session-retro Längsschnitt-Gate
# (Infra-Transparenz war wiederholt Outage-/Merge-Blocker-Quelle).

on:
  push:
    paths:
      - "infra/hosts.yaml"
      - "infra/scripts/hosts_audit.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "infra/hosts.yaml"
      - "infra/scripts/hosts_audit.py"
      - ".github/workflows/**"

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
# ROT-IST-BEFUND — maschinenlesbarer Marker fuer tools/cron_melder_check.py:
# seit 2026-08-30 meldet --check auflage die vier dev-desktop-Dienste gegen
# prod_container=false (platform#2507). Rot heisst hier "Entscheidung offen",
# nicht "Audit kaputt" — bis der Owner deklariert/umzieht/stoppt.

permissions:
  contents: read

jobs:
  hosts-audit:
    name: hosts.yaml Schema + Frische + Runner-Label-Pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # PR-Modus: deklarierte `blockiert`-Dienste (platform#2507) sind Hinweis, kein
      # Finding — sonst ist jeder Workflow-PR rot, bis der Owner entschieden hat
      # (Realfall 2026-08-30: #2519 blockiert). Auf push/main bleibt der Lauf rot.
      - name: Audit (schema + staleness + labels + auflage)
        run: >-
          python3 infra/scripts/hosts_audit.py --check all --workflows .github/workflows
          ${{ github.event_name == 'pull_request' && '--blockiert-als-hinweis' || '' }}
