name: Megatest — Hardcoding Guard

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Mo–Fr 06:00 UTC (täglich an Werktagen)
  push:
    paths:
      - 'tests/megatest/**'
      - 'scripts/check_hardcoded_urls.py'
      # sich selbst einschliessen: ein Workflow-only-Push loeste sonst keinen
      # Lauf aus und der geaenderte Checkout blieb ungetestet (2026-08-02)
      - '.github/workflows/megatest.yml'
  workflow_dispatch:
    inputs:
      update_budgets:
        description: 'Budgets auf aktuellen Stand setzen (kein Fail)'
        type: boolean
        default: false

# CI-5 (#1202): cancel superseded runs on rapid pushes to the same
# ref — avoids self-overlap when several commits land in quick
# succession on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default (least privilege, #818 permissions sweep); the
# megatest job below already declares its own permissions (issues: write
# for the failure report) and overrides this.
permissions:
  contents: read

jobs:
  megatest:
    name: Platform Hardcoding Megatest
    runs-on: self-hosted
    permissions:
      # contents:write entfernt (#1682): es war fuer einen --update-budgets-Commit
      # gedacht, den dieser Workflow nie hatte — budgets.toml ist ausschliesslich
      # von Menschen commited worden (git log). Das Update-Ergebnis geht jetzt als
      # Artefakt + Job-Summary raus, dafuer genuegt contents:read.
      contents: read
      issues: write       # für Failure-Report als Issue

    steps:
      - name: Checkout platform
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure HOME (self-hosted Service-Env)
        # Der Runner-Service liefert seit ~2026-06-24 kein HOME mehr →
        # `set -u` + "$HOME" brach jeden Lauf ("HOME: unbound variable",
        # 8/8 rot). Via GITHUB_ENV wirkt der Wert auch für github-script
        # (process.env.HOME) und upload-artifact (~-Expansion). Kein
        # Hardcode: getent löst das Home des Runner-Users auf.
        run: |
          if [ -z "${HOME:-}" ]; then
            echo "HOME=$(getent passwd "$(id -u)" | cut -d: -f6)" >> "$GITHUB_ENV"
          fi

      - name: Install pytest + pyyaml
        run: pip install pytest pyyaml --quiet --break-system-packages

      - name: Checkout alle Repos unter ~/github
        # Bestehende Klone MUESSEN nachgezogen werden: bis 2026-08 wurde nur
        # bei fehlendem Verzeichnis geklont — auf dem persistenten self-hosted
        # Runner scannte die Suite damit eingefrorene Erst-Klon-Staende statt
        # origin/HEAD (Lokal-vs-CI-Drift, Handover 2026-08-02). Der beim Klon
        # eingebrannte x-access-token ist ein Per-Run-Token und beim naechsten
        # Lauf tot → Remote-URL vor jedem fetch neu setzen.
        #
        # Nicht nachziehbare Klone werden ENTFERNT statt stale gescannt: ein
        # eingefrorener Stand erzeugt Geister-Befunde gegen frisch gemessene
        # Budgets. GITHUB_TOKEN ist repo-scoped (nur platform) — private Repos
        # sind damit weder klon- noch fetchbar und werden ehrlich uebersprungen
        # (WARN + Summary-Zeile).
        #
        # Vollabdeckung: MEGATEST_READ_TOKEN (Owner-Freigabe 2026-08-02,
        # platform#1682 — hinterlegt ist das Enterprise-PAT; ein Tausch auf
        # ein dediziertes Read-only-Token braucht nur das Secret zu wechseln).
        # Fehlt das Secret, faellt der Ausdruck auf GITHUB_TOKEN zurueck und
        # der Lauf verhaelt sich wie bisher.
        #
        # WICHTIG: Das Token darf NICHT auf dem Runner persistieren — set-url
        # schreibt es in .git/config. Deshalb wird die Remote-URL nach jedem
        # fetch/clone sofort wieder tokenlos gesetzt (Token nur in-flight;
        # bei einem langlebigen PAT ist das der Unterschied zwischen
        # "im Speicher waehrend des Laufs" und "auf Platte fuer jeden").
        run: |
          set -euo pipefail
          # Owner kommt aus der Registry (registry_api.owner), NICHT hartkodiert:
          # 11 der 52 Repos liegen unter iilgmbh/meiki-lra/ttz-lif. Bei
          # transferierten Repos verdeckte GitHubs Redirect den hartkodierten
          # achimdehnert-Pfad; direkt in der Fremd-Org entstandene Repos blieben
          # still ungescannt (platform#1682).
          # Eigene Zuweisung, damit set -e einen Fehlschlag des Auflösers sieht:
          # in "done <<< $(...)" wuerde er zu einer leeren Liste verpuffen und der
          # Lauf meldete 0 uebersprungene Repos, ohne eines angefasst zu haben.
          SLUGS=$(python3 scripts/list_megatest_repos.py --with-owner)
          mkdir -p ~/github
          uebersprungen=0
          while read -r slug; do
            [ -n "$slug" ] || continue
            repo="${slug#*/}"
            url="https://x-access-token:${{ secrets.MEGATEST_READ_TOKEN || secrets.GITHUB_TOKEN }}@github.com/$slug.git"
            nackt="https://github.com/$slug.git"
            dir="$HOME/github/$repo"
            if [ -d "$dir/.git" ]; then
              git -C "$dir" remote set-url origin "$url"
              if git -C "$dir" fetch --depth=1 origin HEAD 2>/dev/null; then
                git -C "$dir" reset --hard FETCH_HEAD --quiet
                git -C "$dir" remote set-url origin "$nackt"
                continue
              fi
              git -C "$dir" remote set-url origin "$nackt"
              echo "WARN: $slug nicht nachziehbar — stale Klon wird entfernt (kein Stale-Scan)"
              rm -rf "$dir"
            fi
            if git clone --depth=1 "$url" "$dir" 2>/dev/null; then
              git -C "$dir" remote set-url origin "$nackt"
            else
              echo "WARN: $slug nicht erreichbar (Token-Scope?) — wird NICHT gescannt"
              uebersprungen=$((uebersprungen+1))
            fi
          done <<< "$SLUGS"
          echo "::notice::Megatest-Checkout: $uebersprungen Repo(s) nicht scannbar (siehe WARN-Zeilen) — kein Befund, aber auch kein Beleg."

      - name: Run Megatest (normal)
        if: ${{ !inputs.update_budgets }}
        id: megatest_run
        env:
          GITHUB_DIR: /root/github
        # pipefail ist hier der eigentliche Melde-Mechanismus (#1689): ohne ihn
        # ist der Pipeline-Exit der von `tee` (=0), der Step endet IMMER gruen,
        # `outcome == 'failure'` ist unerreichbar und beide Folgeschritte sind
        # tot (belegt: Lauf 30758541548 — 3 failed, conclusion success, Issue-
        # Step skipped). Das frueher hier erfasste exit_code-Output wurde
        # nirgends gelesen und entfaellt.
        run: |
          set -o pipefail
          cd ~/github/platform
          python3 -m pytest tests/megatest/ \
            -v \
            --tb=short \
            -rP \
            --junitxml=megatest-results.xml \
            2>&1 | tee megatest-output.txt
        # -rP (#1682): test_vermeidbar_total meldet per print(), wenn ein Repo
        # UNTER seinem Budget liegt ("Budget auf X reduzierbar"). pytest faengt
        # stdout bestandener Tests ab und zeigt es ohne -rP/-s nirgends — weder
        # im Log noch in der JUnit-XML. Gemessen am Artefakt von Lauf
        # 31367105746: 0 Treffer fuer "reduzierbar", obwohl der Hinweis lief.
        # Damit war weiteres Ratchet-Potenzial nur ueber einen
        # --update-budgets-Lauf sichtbar, und genau der ist gefaehrlich: er
        # ueberschreibt Budget-0-Zusagen mit Ist-Werten. Derselbe Fehler wie
        # #1508: ein Mechanismus arbeitet korrekt und niemand liest sein
        # Ergebnis. Gegengeprobt: dieselben Flags ohne -rP zeigen den Hinweis
        # 0x, mit -rP 1x.
        # Weichgestellt, damit ein roter Megatest den Zeitplan-Job nicht rot faerbt —
        # gemeldet wird er ueber steps.megatest_run.outcome im Issue-Schritt unten.
        # ACHTUNG (#1010, #1581): das maskiert auch harte Startfehler (z.B.
        # `python` statt `python3` → command not found) — dafuer existiert der
        # Schritt "Kein Testlauf zustande gekommen" unten.
        continue-on-error: true

      - name: Run Megatest (Budget-Update)
        if: ${{ inputs.update_budgets }}
        env:
          GITHUB_DIR: /root/github
        run: |
          cd ~/github/platform
          python3 -m pytest tests/megatest/ \
            --update-budgets \
            -v -q \
            2>&1 | tee megatest-output.txt

      # #1682: der Update-Lauf schrieb budgets.toml bisher nur in den Workspace
      # des Runners — kein Commit-Schritt, kein Artefakt. Das Ergebnis war nach
      # dem Job weg, `contents: write` oben beschrieb einen Commit, den es nie
      # gab. Bewusst KEIN Auto-Commit auf main: ein Automatismus, der die
      # Budget-Zusagen der ganzen Flotte umschreibt, gehoert durch einen Review
      # (autonomy-gates, "autonomous-no-human-review"). Stattdessen Diff in die
      # Job-Summary + Datei als Artefakt zum Uebernehmen per PR.
      - name: Budget-Diff sichtbar machen
        if: ${{ inputs.update_budgets }}
        run: |
          cd ~/github/platform
          {
            echo "## Budget-Update (Ist-Werte aus diesem CI-Lauf)"
            echo
            if git diff --quiet -- tests/megatest/budgets.toml; then
              echo "Keine Aenderung — die Budgets stehen bereits auf den Ist-Werten."
            else
              echo '```diff'
              git diff -- tests/megatest/budgets.toml
              echo '```'
              echo
              echo "Uebernahme per PR; ein Budget von 0 wird vom Writer nie angehoben."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aktualisierte budgets.toml
        if: ${{ inputs.update_budgets }}
        uses: actions/upload-artifact@v7
        with:
          name: megatest-budgets-updated
          path: ~/github/platform/tests/megatest/budgets.toml

      - name: Upload JUnit Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: megatest-results
          path: ~/github/platform/megatest-results.xml

      # Ohne diesen Schritt kann der Melder nicht zwischen "Test hat Violations
      # gefunden" und "Test lief gar nicht" unterscheiden — genau das erzeugte
      # zwischen 06.05. und 15.06. 21 inhaltsleere Issues (#1581). Ein Lauf ohne
      # JUnit-Datei ist kein Befund, sondern ein Defekt und gehoert rot.
      - name: Kein Testlauf zustande gekommen
        if: steps.megatest_run.outcome == 'failure' && hashFiles('megatest-results.xml') == ''
        run: |
          echo "::error::pytest hat keine megatest-results.xml erzeugt — der Lauf kam nicht zustande (z.B. Interpreter fehlt). Das ist ein Defekt, kein Regressions-Befund."
          exit 1

      - name: Failure-Summary als GitHub Issue
        if: steps.megatest_run.outcome == 'failure' && hashFiles('megatest-results.xml') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const outputPath = `${process.env.HOME}/github/platform/megatest-output.txt`;
            const output = fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, 'utf8')
              : 'Output nicht gefunden (Pfad: ' + outputPath + ')';

            // Capture FAILED lines + last summary line + any ERROR lines
            const summaryLines = output
              .split('\n')
              .filter(l =>
                l.includes('FAILED') ||
                l.includes('ERROR') ||
                l.match(/^(ERRORS|FAILURES|=+\s+(\d+\s+)?failed)/) ||
                l.match(/^\s*(assert|E\s+)/) ||
                l.includes('short test summary')
              );
            const summary = summaryLines.length > 0
              ? summaryLines.join('\n').slice(0, 3000)
              : output.slice(-2000);  // fallback: last 2000 chars

            const today = new Date().toISOString().split('T')[0];
            const issueTitle = `🔴 Megatest Regression — ${today}`;

            // Deduplication: check for open issue with same title today
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'megatest',
              per_page: 10,
            });
            const alreadyOpen = existing.data.some(i => i.title === issueTitle);
            if (alreadyOpen) {
              console.log(`Issue "${issueTitle}" already open — skipping duplicate.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: [
                '## Megatest hat Regressions gefunden',
                '',
                '**Neue Violations überschreiten das Budget in `tests/megatest/budgets.toml`.**',
                '',
                '```',
                summary,
                '```',
                '',
                '**Aktion:** Violation fixen oder Budget-Update beantragen.',
                '',
                `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['megatest', 'hardcoding', 'regression'],
            });
