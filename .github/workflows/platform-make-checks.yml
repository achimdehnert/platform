# platform-make-checks.yml — Make-Ziele, die bisher NUR lokal liefen.
#
# tools/ci_deckung.py (platform#2990) loest seit 2026-09-24 wiederverwendbare
# Workflows auf und sah danach in platform fuenf Make-Ziele ohne CI-Aufrufer
# (platform#3472). Eines davon ist eine reine Offline-Pruefung mit eigenem
# Akzeptanzkriterium und gehoert in CI:
#
#   betrieb-check  K4 #3015: jeder Backlog-Vorschlag traegt Gegenrede,
#                  Alternative und Anker (liest docs/betrieb/todo-liste.md)
#
# Die uebrigen vier: lint-tenancy laeuft in registry-lint.yml ueber das
# Make-Ziel; boards-check braucht das lokale Mail-Ledger (~/.claude/
# mail-vorgaenge.json liegt nur auf der Dev-Maschine, Mandantendaten; der erste
# CI-Lauf 2026-09-24 brach genau daran ab, Verzicht mit Grund, Refs #3472);
# check-push und workflow-lint sind lokale Spiegel von Gates,
# die in CI direkt laufen; lint-registry ist gestundet, weil validate_repos.py
# heute 8 bekannte Inkonsistenzen meldet — alles mit Grund in
# governance/ci-deckung-verzicht.yaml.
#
# Pfadfilter = die Eingaben des Ziels. Kein Netz, kein Secret, kein
# Prod-Zugriff (lokal gemessen 2026-09-24: < 10 s).
name: platform-make-checks

on:
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "tools/betrieb_backlog_check.py"
      - "docs/betrieb/**"
      - ".github/workflows/platform-make-checks.yml"
  pull_request:
    paths:
      - "Makefile"
      - "tools/betrieb_backlog_check.py"
      - "docs/betrieb/**"
      - ".github/workflows/platform-make-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-checks:
    name: betrieb-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Backlog-Vorschlaege vollstaendig (K4 #3015)
        run: make betrieb-check
