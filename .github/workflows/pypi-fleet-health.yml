# pypi-fleet-health.yml — ADR-266 Stufe 3: wöchentlicher PyPI-Fleet-Health-Report.
#
# Read-only Detektor, NIE Akteur: erhebt Fleet-Findings (Auth-Modus,
# Doppel-Publisher, Registry-Drift, Versions-Drift, Totes-Paket-Signal) über
# tools/pypi_fleet_inventory.py --remote und pflegt seine Sektion (`health`) im
# EINEN PyPI-Fleet-Tracking-Issue (#968) — KONZ-052 V5 hat #373 (Adoption-Gate)
# und #752 (Gate-Meter) hier hinein konsolidiert (KONZ-018 §5.4: kein neuer
# Meter, kein neues Rolling-Issue; drei Melder-Issues mit 0 Kommentaren waren
# der Befund). Kein Auto-Publish, kein Auto-Fix, keine LLM-Urteile (Nicht-Ziele).
#
# Namensregel: bewusst NICHT publish-*.yml — publish_gate_invariant.sh globt
# darauf und verlangt gitleaks (dieser Workflow publiziert nichts).
# Ergänzt pypi-gate-meter.yml (Sektion gate-meter) und pypi-ci-adoption-gate.yml
# (Sektion adoption) — alle drei schreiben über tools/pypi_fleet_sections.py.

name: PyPI Fleet Health

on:
  schedule:
    - cron: "30 6 * * 1"   # Mo 06:30 UTC — nach pypi-gate-meter (06:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Report ins Log, kein Issue-Write"
        required: false
        default: false
        type: boolean
  # Wiring-Beweis by-construction (Gate autonomous-no-human-review): jede
  # Änderung an Workflow/Tool läuft im PR als ERZWUNGENER Dry-Run (s. unten,
  # pull_request ⇒ nie Issue-Write) — kein lokaler Lauf zählt als Beweis.
  pull_request:
    paths:
      - ".github/workflows/pypi-fleet-health.yml"
      - "tools/pypi_fleet_inventory.py"
      - "tools/pypi_fleet_earlywarn.py"
      - "tools/pypi_fleet_issue_emitter.py"
      - "tools/pypi_fleet_sections.py"

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Fleet-Scan (remote, read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/pypi_fleet_inventory.py --remote --downloads --check \
            | tee fleet-findings.txt

      # #2075 K3: Frühwarn-Metriken (advisory, rc immer 0 ohne --strict).
      # Baseline 2026-08-19: 38 Findings — docs/verifications/2026-08-19-adr266-
      # earlywarn-baseline.md. Blocking erst nach Präzisions-Nachweis (Owner).
      - name: Frühwarn-Scan (advisory, #2075 K3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo ""
            python3 tools/pypi_fleet_earlywarn.py
          } | tee -a fleet-findings.txt

      # #2075 K4: Befund→Auto-Issue-Emitter. Allowlist default LEER — keine
      # Klasse ist scharf, bis der Owner echte Klassen zuschaltet (#2084); der
      # Lauf ist dann ein stiller No-Op (bestehendes Verhalten, getestet).
      # PR-Event ⇒ erzwungener Dry-Run (Wiring-Beweis). Die Loop-Canary
      # (registry/pypi-loop-canary.txt) hat den Zyklus einmal real bewiesen
      # (2026-08-19, PR #2096) und ist mit KONZ-052 V5 entfernt.
      - name: Auto-Issue-Emitter (Frühwarn → Auto-Issue, #2075 K4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/pypi_fleet_earlywarn.py --json > earlywarn.json
          ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="--dry-run"
          fi
          python3 tools/pypi_fleet_issue_emitter.py --findings earlywarn.json $ARGS \
            | tee -a fleet-findings.txt

      # Retro e17299-incr B2/B5 + Gate critical-alert-no-ticket (×2): der Report
      # hält (a) offene Bot-PRs und (b) rote Checks auf main je Paket-Repo sichtbar —
      # damit ist die ADR-266-Zusage real und ein dauerroter Check fällt spätestens
      # im Wochen-Report auf (Regel: jeder dauerrote Check braucht einen Issue-Link).
      - name: Bot-PRs + rote main-Checks je Paket-Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "== Offene Bot-PRs + rote main-Checks (Gate critical-alert-no-ticket) =="
            REPOS=$(python3 -c "import sys; sys.path.insert(0,'tools'); import registry_api; repos=registry_api.flat().get('repos',{}); print(' '.join(sorted(n for n,e in repos.items() if (e or {}).get('pypi') and n!='platform')))")
            for repo in $REPOS; do
              for org in achimdehnert iilgmbh ttz-lif meiki-lra; do
                if gh api "repos/$org/$repo" --jq .name >/dev/null 2>&1; then
                  bots=$(gh pr list --repo "$org/$repo" --author app/dependabot --state open --json number --jq 'length' 2>/dev/null || echo "?")
                  sha=$(gh api "repos/$org/$repo/commits/main" --jq .sha 2>/dev/null || true)
                  red=$(gh api "repos/$org/$repo/commits/$sha/check-runs" --jq '[.check_runs[]|select(.conclusion=="failure")|.name]|join("; ")' 2>/dev/null || echo "")
                  if [ "$bots" != "0" ] || [ -n "$red" ]; then
                    echo "$repo: bot-PRs=$bots rote-main-checks=[${red}]"
                  fi
                  break
                fi
              done
            done
            echo "(Repos ohne Zeile: 0 Bot-PRs, 0 rote Checks)"
          } | tee -a fleet-findings.txt

      - name: Sektion "health" im EINEN Flotten-Issue pflegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Wöchentlicher read-only Scan (\`tools/pypi_fleet_inventory.py --remote --downloads --check\`)."
            echo "Programm + Kriterien: docs/adr/ADR-266. Regenerieren lokal: \`python3 tools/pypi_fleet_inventory.py\`."
            echo ""
            echo '```'
            cat fleet-findings.txt
            echo '```'
            echo ""
            echo "_Letzter Lauf: ${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))_"
          } > section-health.md
          DRYFLAG=""
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            DRYFLAG="--dry-run"
          fi
          python3 tools/pypi_fleet_sections.py \
            --owner "${{ github.repository_owner }}" --repo platform \
            --section health --heading "Fleet-Health (ADR-266 K1–K7)" \
            --body-file section-health.md $DRYFLAG
