# Regel-Ritual (KONZ-platform-038 §5.3) — erzwungener 14-Tage-Trigger.
# Bewusst Actions-Schedule statt Maschinen-Cron: git-getrackt, überlebt
# Dev-Server und Sessions (Maintainer-2028-Befund M-2), Ausfall ist im
# Actions-Log sichtbar statt lautlos.
name: regel-ritual

on:
  schedule:
    - cron: "23 6 2,16 * *" # 2.+16. des Monats, 06:23 UTC
  workflow_dispatch: {}
  pull_request:
    paths: [".github/workflows/regel-ritual.yml"]

permissions:
  contents: read
  issues: write

env:
  TRACKING_ISSUE: "1640"

jobs:
  ritual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git log --since braucht Historie; depth 1 ergäbe stumm 0 Retros (M-7)

      - name: pytest bereitstellen (für Gate-Drills)
        run: pip install -q pytest

      - name: KPI-Delta erheben
        id: kpi
        run: |
          python3 tools/retro_kpis.py --dir docs/retros > /tmp/kpi.txt
          WINDOW_START=$(date -u -d "14 days ago" +%F)
          RETRO_COUNT=$(git log --since="$WINDOW_START" --name-only --pretty=format: -- docs/retros/ | grep "session-retro-.*\.md" | sort -u | wc -l)
          {
            echo "## Regel-Ritual $(date -u +%F)"
            echo ""
            if [ "$RETRO_COUNT" -lt 8 ]; then
              echo "**NICHT BEWERTBAR** — nur $RETRO_COUNT neue Retro-Dateien im 14-Tage-Fenster (Input-Bedingung ≥8, KONZ-038 K1). Zählt nicht als sauberes Fenster."
            else
              echo "Input-Bedingung erfüllt: $RETRO_COUNT neue Retro-Dateien im Fenster."
            fi
            echo ""
            echo '```'
            sed -n '1,40p' /tmp/kpi.txt
            echo '```'
            echo ""
            # K1-Ausgang MASCHINELL gegen die eingefrorene Baseline (KONZ-038 D6).
            # Vorher war das der "manuelle Teil des Rituals" — eine Handzaehlung
            # gegen ein Woerterbuch, das kein Programm las. --k1 prueft zusaetzlich
            # den Instrument-Pin: aendert sich retro_kpis.py ohne Baseline-
            # Neuberechnung, sagt der Lauf "nicht bewertbar" statt still zu rechnen.
            echo "**K1-Ausgang (Fenster $WINDOW_START..$(date -u +%F))**"
            echo '```'
            python3 tools/retro_kpis.py --dir docs/retros \
              --since "$WINDOW_START" --until "$(date -u +%F)" --k1 \
              | sed -n '/## K1-Auswertung/,$p'
            echo '```'
            echo ""
            # Handover-Freshness-Sweep (Slug handover-stale-vor-merge, Welle 1):
            # das PR-Gate ist paths-gefiltert und sieht "Datei nicht angefasst" nie —
            # dieser Sweep erreicht die Lesefläche (#1640) unabhängig von PR-Pfaden.
            if python3 scripts/checks/agent_handover_freshness_check.py AGENT_HANDOVER.md > /tmp/fresh.txt 2>&1; then
              echo "Handover-Freshness: ✅ frisch"
            else
              echo "Handover-Freshness: ⚠️ STALE — Stand-Abschnitt älter als letzter Commit:"
              echo '```'
              sed -n '1,10p' /tmp/fresh.txt
              echo '```'
            fi
            echo ""
            # Gate-Drill-Prüflauf (KONZ-038 D8/K4): jeder registrierte Drill wird ECHT
            # ausgeführt — tote Gates fallen binnen eines Fensters auf, nicht 2028 (M-8).
            python3 tools/gate_drill_check.py > /tmp/drill.txt 2>&1 || true
            sed -n '1,15p' /tmp/drill.txt
            echo ""
            echo "_Voller Lauf im Actions-Log. Der K1-Ausgang oben ist gerechnet, nicht behauptet (docs/governance/k1-baseline/). Sunset-Prüfung + Gate-Backlog bleiben manueller Teil des Rituals (Runbook: docs/governance/model-rebaseline-runbook.md für Modellwechsel)._"
          } > /tmp/comment.md
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"

      # Lücken-Selbstprüfung (KONZ-038 §5.3, Retro 287b23 #5): meldet, wenn der
      # letzte Ritual-Kommentar >20 Tage alt ist (Schedule-Ausfall, K2-Signal).
      - name: Lücken-Selbstprüfung (#1640)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh issue view "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --json comments -q '.comments[-1].createdAt' 2>/dev/null || echo "")
          {
            echo ""
            if [ -n "$LAST" ]; then
              AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
              if [ "$AGE_DAYS" -gt 20 ]; then
                echo "⚠️ Lücken-Selbstprüfung: letzter Ritual-Kommentar ist ${AGE_DAYS} Tage alt (>20) — Schedule-Ausfall prüfen (K2)."
              else
                echo "Lücken-Selbstprüfung: letzter Kommentar vor ${AGE_DAYS} Tag(en) — ok."
              fi
            else
              echo "⚠️ Lücken-Selbstprüfung: Kommentare auf #$TRACKING_ISSUE nicht lesbar — NICHT bewertbar (nie als ok werten)."
            fi
          } >> /tmp/comment.md

      # Schreibpfad NUR bei echten Läufen — der PR-Lauf beweist die Verdrahtung
      # bis vor den Write (Trockenlauf deckt den Schreibpfad nie; erster
      # scharfer Beweis = workflow_dispatch nach Merge, siehe PR-Checkliste).
      - name: Lauf auf Tracking-Issue protokollieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
