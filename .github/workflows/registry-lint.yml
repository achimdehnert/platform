name: Registry Lint

on:
  push:
    paths:
      - "registry/repos.yaml"
      - "infra/scripts/validate_tenancy.py"
      - "infra/scripts/validate_repos.py"
  pull_request:
    paths:
      - "registry/repos.yaml"
      - "infra/scripts/validate_tenancy.py"
      - "infra/scripts/validate_repos.py"

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  tenancy-lint:
    name: tenancy_mode Pflicht-Feld (ADR-212 Issue #247)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate tenancy_mode
        run: python3 infra/scripts/validate_tenancy.py
