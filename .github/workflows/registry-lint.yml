name: Registry Lint

on:
  push:
    paths:
      - "registry/repos.yaml"
      - "infra/scripts/validate_tenancy.py"
      - "infra/scripts/validate_repos.py"
      - "Makefile"
      - ".github/workflows/registry-lint.yml"
  pull_request:
    paths:
      - "registry/repos.yaml"
      - "infra/scripts/validate_tenancy.py"
      - "infra/scripts/validate_repos.py"
      - "Makefile"
      - ".github/workflows/registry-lint.yml"

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  tenancy-lint:
    name: tenancy_mode Pflicht-Feld (ADR-212 Issue #247)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # Ueber das Make-Ziel statt per Direktaufruf, damit tools/ci_deckung.py
      # das Ziel `lint-registry` als in CI ausgefuehrt erkennt (platform#3477,
      # Entscheid 4). `make lint-registry` deckt validate_repos.py UND
      # validate_tenancy.py ab (Makefile: lint-registry laeuft beide); die
      # fruehere Stundung (8 bekannte Inkonsistenzen ports.yaml <-> Registry —
      # archivierte Hubs, mcp-hub 8000 vs. 3000, chat-hub/lotse-raum ohne
      # Registry-Eintrag) ist mit #3477 behoben, der Verzicht-Eintrag
      # `lint-registry` in governance/ci-deckung-verzicht.yaml entfernt.
      - name: Registry validieren (make lint-registry)
        run: make lint-registry
