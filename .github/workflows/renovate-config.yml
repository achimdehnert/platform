# Renovate-Config-Validator (platform#572): die zentrale renovate.json ist der
# SSoT fuer alle Repos ("extends": "github>achimdehnert/platform//renovate.json").
# Am 2026-09-16 war sie ungueltig (Schedule "before 8am on weekdays", config:base,
# matchPackagePatterns) — jeder Consumer haette beim ersten Renovate-Lauf still
# gar nichts bekommen. Deshalb echter Validator-Lauf statt Hoffnung.
name: Renovate-Config

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: renovate-config-validator --strict
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json
