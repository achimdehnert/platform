name: Auto-Scaffold Tests für neue Repos

# Owner je Repo kommt aus registry/canonical.yaml (tools/scaffold_kandidaten.py,
# #2645) — vorher war der platform-Owner fuer alle Repos angenommen, und
# `frist-hub` (meiki-lra) liess jeden Lauf mit 404 abbrechen (20/20 rot seit
# 2026-07-02). Fremd-Org-Repos werden gezaehlt, nicht angefasst; 404/403 je Repo
# zaehlen als `unreachable`, der Lauf geht weiter.
# Wiring-Beweis: jede Aenderung an Workflow/Planer laeuft im PR als erzwungener
# Dry-Run (pull_request ⇒ nie PR-Write in Fremd-Repos).
on:
  push:
    branches: [main]
    paths:
      - 'registry/canonical.yaml'
      - 'tests/megatest/budgets.toml'
  pull_request:
    paths:
      - '.github/workflows/scaffold-tests.yml'
      - 'tools/scaffold_kandidaten.py'
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Repo-Name (leer = alle ohne tests/conftest.py prüfen)'
        required: false
        default: ''
      dry_run:
        description: 'Nur prüfen, keinen PR erstellen'
        type: boolean
        default: false

jobs:
  scaffold:
    name: Test-Scaffold PR für neue Repos
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          token: ${{ secrets.PROJECT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install pyyaml
        run: pip install pyyaml --quiet

      - name: Repos ohne Test-Scaffold ermitteln (Owner aus canonical.yaml)
        id: find_repos
        run: python3 tools/scaffold_kandidaten.py --repo "${{ inputs.repo_name }}"

      - name: Scaffold generieren (SSoT via gen_test_scaffold.py)
        id: gen_scaffold
        run: |
          set -euo pipefail
          TMPDIR=/tmp/scaffold-generic
          mkdir -p ${TMPDIR}/tests

          # gen_test_scaffold.py ist die einzige Quelle der Wahrheit für Scaffold-Inhalt
          python3 scripts/gen_test_scaffold.py ${TMPDIR} 2>&1

          # Version direkt von PyPI (kein Fallback auf Konstante)
          TESTKIT_VERSION=$(python3 -c "
          import json, urllib.request
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/iil-testkit/json', timeout=5) as r:
                  print(json.loads(r.read())['info']['version'])
          except Exception as e:
              print('0.4.0', flush=True)
          ")
          echo "testkit_version=${TESTKIT_VERSION}" >> $GITHUB_OUTPUT
          echo "Aktuelle iil-testkit Version: ${TESTKIT_VERSION}"

          # Datei-Inhalte als Base64 — verhindert Newline/Quote-Probleme in GITHUB_OUTPUT
          echo "conftest_b64=$(base64 -w0 ${TMPDIR}/tests/conftest.py 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "smoke_b64=$(base64 -w0 ${TMPDIR}/tests/test_views_smoke.py 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "htmx_b64=$(base64 -w0 ${TMPDIR}/tests/test_views_htmx.py 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "reqtest_b64=$(base64 -w0 ${TMPDIR}/requirements-test.txt 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: PR für jeden Repo ohne conftest.py erstellen
        if: steps.find_repos.outputs.count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const repos = JSON.parse('${{ steps.find_repos.outputs.repos }}');
            const dryRun = '${{ inputs.dry_run }}' === 'true' || context.eventName === 'pull_request';
            const testkitVersion = '${{ steps.gen_scaffold.outputs.testkit_version }}';
            const foreign = Number('${{ steps.find_repos.outputs.foreign }}');
            const unknown = Number('${{ steps.find_repos.outputs.unknown }}');

            // Scaffold-Inhalt kommt AUSSCHLIESSLICH von gen_test_scaffold.py (SSoT)
            // Kein hardcoding — Änderungen an gen_test_scaffold.py wirken automatisch hier
            const fromB64 = (b64) => b64 ? Buffer.from(b64, 'base64').toString('utf-8') : '';
            const conftest  = fromB64('${{ steps.gen_scaffold.outputs.conftest_b64 }}');
            const reqTest   = fromB64('${{ steps.gen_scaffold.outputs.reqtest_b64 }}');
            const smokeTest = fromB64('${{ steps.gen_scaffold.outputs.smoke_b64 }}');
            const htmxTest  = fromB64('${{ steps.gen_scaffold.outputs.htmx_b64 }}');

            let created = 0;
            let skipped = 0;
            let unreachable = 0;

            for (const { owner, repo } of repos) {
              console.log(`\nPrüfe ${owner}/${repo}...`);

              // Prüfen ob conftest.py bereits existiert
              let hasConftest = false;
              try {
                await github.rest.repos.getContent({ owner, repo, path: 'tests/conftest.py' });
                hasConftest = true;
              } catch (e) {
                if (e.status !== 404) {
                  console.log(`  UNREACHABLE: ${owner}/${repo} — ${e.status} ${e.message}`);
                  unreachable++;
                  continue;
                }
              }

              if (hasConftest) {
                console.log(`  SKIP: tests/conftest.py bereits vorhanden`);
                skipped++;
                continue;
              }

              // Prüfen ob PR bereits offen — 404/403 (Repo weg, Token ohne Zugriff)
              // ist kein Abbruchgrund für die übrigen Repos
              let existing;
              try {
                existing = await github.rest.pulls.list({ owner, repo, state: 'open' });
              } catch (e) {
                console.log(`  UNREACHABLE: ${owner}/${repo} — ${e.status} ${e.message}`);
                unreachable++;
                continue;
              }
              const alreadyOpen = existing.data.some(pr =>
                pr.title.includes('test scaffold') || pr.title.includes('Test-Infrastruktur')
              );
              if (alreadyOpen) {
                console.log(`  SKIP: PR bereits offen`);
                skipped++;
                continue;
              }

              if (dryRun) {
                console.log(`  DRY-RUN: würde PR erstellen für ${repo}`);
                created++;
                continue;
              }

              // Branch erstellen
              const branch = `chore/add-test-scaffold`;
              let defaultSha;
              try {
                const repoData = await github.rest.repos.get({ owner, repo });
                const defaultBranch = repoData.data.default_branch;
                const ref = await github.rest.git.getRef({
                  owner, repo, ref: `heads/${defaultBranch}`,
                });
                defaultSha = ref.data.object.sha;
              } catch (e) {
                console.log(`  WARN: ${repo} — getRef fehlgeschlagen: ${e.message}`);
                skipped++;
                continue;
              }

              try {
                await github.rest.git.createRef({
                  owner, repo,
                  ref: `refs/heads/${branch}`,
                  sha: defaultSha,
                });
              } catch (e) {
                if (!e.message.includes('already exists')) {
                  console.log(`  WARN: Branch-Erstellung fehlgeschlagen: ${e.message}`);
                  skipped++;
                  continue;
                }
              }

              // Dateien committen
              const renovateJson = JSON.stringify({
                "$schema": "https://docs.renovatebot.com/renovate-schema.json",
                "extends": ["github>achimdehnert/platform//renovate.json"]
              }, null, 2) + '\n';

              const files = [
                { path: 'tests/__init__.py', content: '' },
                { path: 'tests/conftest.py', content: conftest },
                { path: 'tests/test_views_smoke.py', content: smokeTest },
                { path: 'tests/test_views_htmx.py', content: htmxTest },
                { path: 'requirements-test.txt', content: reqTest },
                { path: 'renovate.json', content: renovateJson },
              ];

              for (const file of files) {
                try {
                  let sha;
                  try {
                    const existing = await github.rest.repos.getContent({
                      owner, repo, path: file.path, ref: branch,
                    });
                    sha = existing.data.sha;
                  } catch (e) { /* new file */ }

                  await github.rest.repos.createOrUpdateFileContents({
                    owner, repo,
                    path: file.path,
                    message: `chore: add test scaffold — ${file.path}`,
                    content: Buffer.from(file.content).toString('base64'),
                    branch,
                    ...(sha ? { sha } : {}),
                  });
                } catch (e) {
                  console.log(`  WARN: ${file.path} fehlgeschlagen: ${e.message}`);
                }
              }

              // PR erstellen
              await github.rest.pulls.create({
                owner, repo,
                title: `chore: Test-Infrastruktur einrichten (iil-testkit v${testkitVersion})`,
                body: [
                  '## Test-Scaffold hinzufügen',
                  '',
                  'Automatisch generiert von [platform/scaffold-tests.yml](https://github.com/achimdehnert/platform/blob/main/.github/workflows/scaffold-tests.yml)',
                  '',
                  '### Was wird hinzugefügt',
                  '',
                  '| Datei | Zweck |',
                  '|-------|-------|',
                  '| `tests/conftest.py` | iil-testkit Fixtures (auth_client, db_user, ...) |',
                  '| `tests/test_views_smoke.py` | Auto-Discovery HTTP-200-Test aller Views |',
                  '| `tests/test_views_htmx.py` | HTMX-Partial + data-testid Enforcement (ADR-048) |',
                  '| `requirements-test.txt` | Pinned test dependencies |',
                  '| `renovate.json` | Renovate Bot — auto. Dependency Updates (IIL Preset) |',
                  '',
                  '### Nächste Schritte nach Merge',
                  '',
                  '1. `DJANGO_SETTINGS_MODULE` in `pyproject.toml` setzen',
                  '2. `HTMX_URLS` in `test_views_htmx.py` mit eigenen HTMX-Endpoints füllen',
                  '3. `python -m pytest tests/ -v` lokal ausführen',
                  '',
                  `Docs: [\`iil-testkit\` v${testkitVersion}](https://github.com/achimdehnert/iil-testkit)`,
                ].join('\n'),
                head: branch,
                base: 'main',
              });

              console.log(`  ✅ PR erstellt für ${repo}`);
              created++;
            }

            console.log(`\nErgebnis: created=${created} skipped=${skipped} unreachable=${unreachable} foreign=${foreign} unknown=${unknown}${dryRun ? ' (dry-run)' : ''}`);
