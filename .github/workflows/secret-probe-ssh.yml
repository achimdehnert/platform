name: "Secret-Probe SSH"

# Vorlage fuer `type: ssh_key` (KONZ-dev-hub-005, platform#2813, Rotation Phase 1
# platform#2895 Item 56). Kopieren nach `.github/workflows/secret-probe-ssh.yml`
# im Zielrepo.
#
# WOZU: `tools/rotate.py` belegt die Wirkung eines neu gesetzten SSH-Schluessels,
# indem es diesen Workflow per `workflow_dispatch` startet und im Log nach dem
# Marker `✓ <NAME> gueltig` sucht. Ohne einen solchen Beleg gilt ein Konsument
# als NICHT gesetzt (§5.4). Der Treiber ruft ausschliesslich mit dem Input
# `secret_name` auf (z. B. `DEPLOY_SSH_KEY`) — dieser Workflow leitet Host und
# Benutzer selbst ab, ueber die Namenskonvention `<PRAEFIX>_SSH_KEY` ->
# `<PRAEFIX>_HOST` / `<PRAEFIX>_USER` (siehe unten). Neue Werte fuer diese drei
# nicht verhandelbaren Eigenschaften:
#
#  1. **Kein Schreibzugriff, kein Deploy.** Der Probe-Befehl ist `ssh ... true`
#     — er meldet nur an, verwirft aber KEIN Kommando auf dem Host. Kein
#     `rsync`, kein `docker`, kein `sudo`.
#  2. **Keine hartkodierten Hosts/User.** Host und Benutzer kommen ausschliesslich
#     aus vorhandenen Secrets (`*_HOST`/`*_USER`, siehe `infra/secrets-inventory.yaml`),
#     nie als Literal im Workflow.
#  3. **Der Marker steht NUR bei Exit 0 des `ssh`-Aufrufs.** Kein `|| true`,
#     kein `continue-on-error`. Die Schluesseldatei wird in jedem Fall geloescht
#     (per `trap`), auch bei einem fehlgeschlagenen Aufruf.
#
# NAMENSKONVENTION: `secret_name` muss auf `_SSH_KEY` enden; Praefix davor
# (z. B. `DEPLOY`, `HETZNER`, `HETZNER_DEV`, `STAGING`) bestimmt, welche
# `<PRAEFIX>_HOST`/`<PRAEFIX>_USER`-Secrets gelesen werden. Ein neues Praefix
# braucht nur ein weiteres Env-Paar unten — kein Codeaenderung im Skript.
#
# NEGATIVPROBE BEIM ANLEGEN (einmalig, vom Owner):
#   Vor dem ersten echten Lauf den Workflow einmal mit dem ALTEN/leeren Wert
#   starten. Er MUSS rot werden. Ein Beleg-Workflow, der noch nie rot war,
#   ist kein Beleg — er ist eine Behauptung.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Name des zu pruefenden SSH-Key-Secrets (z. B. DEPLOY_SSH_KEY)"
        required: true
        type: string

permissions: {}

jobs:
  probe:
    name: "SSH-Key pruefen"
    runs-on: ubuntu-latest
    steps:
      - name: Verbindungsaufbau mit dem Schluessel
        env:
          NAME: ${{ inputs.secret_name }}
          SSH_KEY: ${{ secrets[inputs.secret_name] }}
          # Bekannte Host/User-Paare (KONZ-dev-hub-005 Namenskonvention).
          # Ein Paar, das es im Zielrepo nicht gibt, bleibt schlicht leer.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_DEV_HOST: ${{ secrets.HETZNER_DEV_HOST }}
          HETZNER_DEV_USER: ${{ secrets.HETZNER_DEV_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "Secret '$NAME' ist in diesem Repo nicht gesetzt." >&2
            exit 1
          fi
          case "$NAME" in
            *_SSH_KEY) PREFIX="${NAME%_SSH_KEY}" ;;
            *)
              echo "'$NAME' endet nicht auf _SSH_KEY — Namenskonvention verletzt." >&2
              exit 1
              ;;
          esac
          HOST_VAR="${PREFIX}_HOST"
          USER_VAR="${PREFIX}_USER"
          HOST="${!HOST_VAR:-}"
          SSH_USER="${!USER_VAR:-}"
          if [ -z "$HOST" ] || [ -z "$SSH_USER" ]; then
            echo "Host/User fuer '$NAME' nicht ermittelbar (erwartet Secrets ${HOST_VAR} und ${USER_VAR})." >&2
            exit 1
          fi

          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Minimaler Aufruf: baut nur die Verbindung auf und fuehrt `true`
          # aus. Kein Schreibzugriff, kein Deploy-Kommando.
          ssh -i "$KEYFILE" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              "${SSH_USER}@${HOST}" true

          # Der Marker. Erst hier, nach dem gelungenen Aufruf.
          echo "✓ $NAME gueltig"
