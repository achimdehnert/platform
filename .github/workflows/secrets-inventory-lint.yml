name: "Secrets-Inventory-Lint"

# PR-Gate fuer den SSoT der Secret-Rotation (KONZ-dev-hub-005 REC-1, platform#2813).
#
# Zwei Dinge, die nur zusammen etwas wert sind:
#   1. Schema  — `consumers[]` in Objektform mit vollqualifiziertem `ref`.
#      Ohne Gate faellt das Inventar in die Freitext-Form zurueck, aus der ein
#      Werkzeug nicht ableiten kann, welches Repo gemeint ist (MT-2).
#   2. gitleaks auf `infra/rotation-log.jsonl` — das Log ist die einzige Datei
#      im Repo, die ein Rotationswerkzeug SCHREIBT. Der Log-Filter im Werkzeug
#      ist die erste Verteidigung, dieser Scan die zweite (§5.4, Kill-Gate
#      "kein Wert in Log/Git/Chat").
#
# Der Job laeuft nur, wenn eine der drei Dateien wirklich beruehrt ist — ein
# Gate, das bei jedem PR laeuft, wird zum Rauschen und dann uebersprungen.

on:
  pull_request:
    paths:
      - "infra/secrets-inventory.yaml"
      - "infra/schemas/**"
      - "infra/rotation-log.jsonl"
      - "tools/secrets_inventory_check.py"
      - ".github/workflows/secrets-inventory-lint.yml"
  push:
    branches: [main]
    paths:
      - "infra/secrets-inventory.yaml"
      - "infra/schemas/**"
      - "infra/rotation-log.jsonl"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inventar-schema:
    name: "Inventar gegen Schema + Zahlen"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python3 -m pip install --quiet "PyYAML>=6" "jsonschema>=4.21"

      # Die Zahlen stehen bewusst IM Log des gruenen Laufs, nicht nur im roten:
      # das Kill-Gate von KONZ-dev-hub-005 zaehlt "Eintraege mit
      # vollqualifizierten Konsumenten und proof" — wer das nachsehen will,
      # soll es nicht lokal nachbauen muessen.
      - name: Schema-Check + Zaehlung
        run: python3 tools/secrets_inventory_check.py

  rotationslog-secretscan:
    name: "Wertfrei? rotation-log.jsonl"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Erste Verteidigung, dieselben Muster wie der Log-Filter im Werkzeug —
      # `ol_api_` (Outline) ist in den gitleaks-Standardregeln NICHT enthalten,
      # der Scan unten wuerde genau den Fall also durchlassen, der die Rotation
      # ausgeloest hat (platform#2353).
      - name: Log-Filter des Werkzeugs
        run: python3 tools/rotate.py log-pruefen

      # Zweite Verteidigung: gitleaks, aber nur auf die eine Datei, die ein
      # Werkzeug schreibt. ci-security.yml scannt ohnehin das ganze Repo — hier
      # geht es um einen benannten, im Kill-Gate zitierbaren Beleg fuer GENAU
      # diese Datei, der auch dann noch gruen/rot ist, wenn der Repo-Scan
      # irgendwann Allowlists bekommt.
      - name: gitleaks (nur rotation-log.jsonl)
        run: |
          set -euo pipefail
          mkdir -p /tmp/rotlog
          cp infra/rotation-log.jsonl /tmp/rotlog/
          docker run --rm -v /tmp/rotlog:/scan \
            zricethezav/gitleaks:v8.28.0 \
            dir /scan --no-banner --redact --exit-code 1
