# Staging/DNS/Registry-Konsistenzchecks (KONZ-platform-015 REC-1 — wire-or-delete).
#
# Verdrahtet die 8 scripts/checks/staging_*.sh, die seit ihrer Entstehung (ADR-210
# R1-R8) in keinem CI-Trigger hingen (dritter Zustand, Kill-Gate-Bedingung b).
# Manueller Erstlauf 2026-07-17 zeigt: alle 8 sind funktionsfähig und liefern
# reale Befunde (R2/R6/R7/R8) — keines wird gelöscht (M28-1: Obsoleszenz vor
# Löschung beweisen, nicht vermuten).
#
# Bewusst NICHT auf push/pull_request: mehrere Checks brauchen SSH zu
# dev-desktop/staging-platform/prod (Live-Zustand) und würden sonst PRs an
# unrelated Drift blocken (Alarm-Müdigkeits-Vermeidung, wie registry-consistency.yml).
# Scheduled + workflow_dispatch = sichtbar, nicht blockierend, bis die aktuell
# offenen Funde (#1227 R2/R8, #1228 R6/R7) abgearbeitet sind.
#
# ⚠️ run-conclusion ≠ Tool-Health (CC-Memory): ein roter Check ist ein FUND
# (reale Drift), kein Workflow-Defekt.
#
# ─── UMBAU 2026-08-02: ein Job statt acht, Regression wird sichtbar ───────────
# Der obige Aufbau bleibt in seiner Absicht unverändert (sichtbar, nicht
# blockierend). Geändert hat sich, was er NICHT leistete:
#
# Am Lauf 30688059707 (2026-08-01) fielen **7 von 8 Jobs**. Bei sieben dauerhaft
# roten Jobs ist ein achter, NEUER Fehlschlag nicht mehr unterscheidbar — eine
# Regression geht im Rauschen unter. Genau das ist jetzt abgedeckt:
#
#   - EIN Job ruft `scripts/checks/run_all.sh --baseline`. Das Skript beherrschte
#     die Aggregation längst, hatte aber selbst keinen Aufrufer — die Architektur
#     war invertiert.
#   - `scripts/checks/staging-baseline.txt` friert die 7 bekannten Fehlschläge ein.
#     Bekanntes bleibt geduldet; ein Check, der DORT NICHT steht und fällt, macht
#     den Lauf hart rot.
#   - Nebeneffekt, nicht Zweck: 8 Checkouts → 1, 8 Runner-Slots → 1, ~105 → ~60
#     Zeilen YAML.
#
# Per-Check-Ergebnisse gehen nicht verloren — sie stehen in der Job-Summary.
# Die Baseline ist eine SCHULD, kein Zielzustand: `run_all.sh` meldet bei jedem
# Lauf, welche Einträge wieder grün sind und gekürzt werden können.
name: Staging-Registry-Checks (KONZ-015 REC-1)

on:
  schedule:
    - cron: '43 5 * * *'        # täglich 05:43 UTC (versetzt zu registry-live-reconcile)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/checks/staging_*.sh'
      - 'scripts/checks/run_all.sh'
      - 'scripts/checks/staging-baseline.txt'
      - '.github/workflows/staging-registry-checks.yml'

permissions:
  contents: read

jobs:
  staging-checks:
    name: "ADR-210 R1–R8 (Baseline-gegated)"
    runs-on: [self-hosted, prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: pyyaml bereitstellen (R4/R7)
        run: python3 -m pip install --quiet --user pyyaml 2>/dev/null || true

      - name: Checks fahren — Regression ist hartes Rot, Bekanntes geduldet
        run: |
          set +e
          bash scripts/checks/run_all.sh \
            --baseline scripts/checks/staging-baseline.txt 2>&1 | tee /tmp/staging.log
          rc="${PIPESTATUS[0]}"
          {
            echo "## ADR-210 Staging-Checks (R1–R8)"
            echo
            echo '```'
            sed -n '/^===================================/,$p' /tmp/staging.log
            echo '```'
            echo
            echo "Bekannte Fehlschläge sind in \`scripts/checks/staging-baseline.txt\` eingefroren"
            echo "und getrackt: #1227 (R2/R8), #1228 (R6/R7), #1627 (R3/R4/R5)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
