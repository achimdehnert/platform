name: Sync ADRs to DevHub

on:
  push:
    branches:
      - main
    paths:
      - "docs/adr/**.md"
      - "docs/templates/**.md"
  workflow_dispatch:

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync:
    name: Trigger ADR sync on DevHub
    runs-on: self-hosted

    steps:
      - name: Trigger import_adrs in running DevHub container
        run: |
          docker exec devhub_web python manage.py import_adrs \
            --repo achimdehnert/platform \
            --path docs/adr \
            --tenant-slug devhub

      # Der Fallback signiert GENAU den Payload, den er sendet, und darf scheitern
      # duerfen — die Vorgaengerfassung signierte '{}', schickte aber den vollen
      # Payload (HMAC ueber andere Bytes -> 401 Invalid signature) und schluckte
      # jeden Fehler ueber `curl -s` + `|| echo`, sodass der Step nie rot wurde.
      - name: Webhook fallback (if container exec fails)
        if: failure()
        env:
          # Nicht in die Kommandozeile inlinen: der self-hosted Runner ist geteilt,
          # Argumente sind dort in der Prozessliste sichtbar.
          DEVHUB_WEBHOOK_SECRET: ${{ secrets.DEVHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          payload='{"repository":{"full_name":"achimdehnert/platform"},"commits":[{"added":["docs/adr/placeholder.md"],"modified":[],"removed":[]}]}'
          sig=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$DEVHUB_WEBHOOK_SECRET" \
            | awk '{print $NF}')
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$payload" \
            https://devhub.iil.pet/adrs/webhook/github/
          echo "Webhook fallback triggered"

  hardcode-scan:
    name: Hardcode Scanner (platform repo)
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hardcode scanner
        run: |
          python3 scripts/hardcode_scanner.py \
            --repo platform \
            --base-dir /home/deploy/projects \
            --severity high \
            --no-color \
            --format text || true
