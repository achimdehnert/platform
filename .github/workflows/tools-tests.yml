name: Tools Unit-Tests

# Generischer Gate für ALLE tools/tests/ — schließt die strukturelle F-A-Wurzel:
# bisher musste jeder Tool-Test manuell in einen spezifischen Workflow verdrahtet werden
# (cc-skill-dist-doctor.yml kannte nur test_generate/test_doctor), sodass neue Tool-Tests
# CI-verwaist blieben (z.B. test_registry_coverage_drift). Hier läuft `pytest tools/tests/`
# als EIN blockierender Gate über alles — kein neues Tool-Test fällt mehr durchs Raster.
# Session-Retro F-A / KONZ-001 R7 (beweisbar-echte Gates).
#
# scripts/** ist mit-getriggert: tools/tests/ enthält auch Tests für scripts/-Module
# (z.B. test_drift_check.py → scripts/drift_check.py). Ohne den scripts/**-Trigger
# liefe der Gate bei einer drift_check.py-Änderung NICHT — genau die CI-verwaiste
# Lücke aus Session-Retro 2026-06-12 F1 (repo-root tests/ läuft in keinem Workflow).
#
# Ehrlichkeits-Hinweis (Issue #819 Häppchen 3, repo-optimize 2026-07-02): der
# scripts/**-Trigger bedeutet NICHT, dass alle scripts/*.py getestet sind — nur
# scripts/drift_check.py (test_drift_check.py) und scripts/render_staging.py
# (test_render_staging.py, s.u.) haben echte Tests; die übrigen ~24 scripts/*.py
# sind weiterhin ungetestet (Gate läuft grün, ohne sie zu prüfen). Kein
# Vollständigkeits-Claim — nur was unten tatsächlich läuft.
#
# Zusätzlich zu tools/tests/ laufen hier drei zuvor CI-tote Testorte mit (waren
# nie in einen Workflow verdrahtet, obwohl sie grün + portabel sind):
#   - tests/test_render_staging.py      → scripts/render_staging.py (ADR-212)
#   - tests/doc_profile_check/           → doc_profile_check.sh Regel-Engine (ADR-218)
#   - tools/claude-hooks/tests/          → tools/claude-hooks/log_llm_call.py
# tests/megatest/ bleibt bewusst außen vor (eigener, separat verdrahteter Gate).
#
# shared_contracts/** ist seit platform#820 (Entscheid A) ebenfalls mit-getriggert:
# tools/tests/test_shared_contracts.py deckt die Pydantic-Contracts dort ab; ohne
# diesen Trigger würde der Gate bei einer Contract-Änderung NICHT laufen — dieselbe
# Lücke wie oben, nur für shared_contracts/ statt scripts/.
#
# X-9 (repo-optimize 2026-07-03, Spec D / #903): zusätzlich zu den Tests läuft hier
# `ruff check tools/ scripts/` als eigener Step — vorher gab es KEINE CI, die tools/
# scripts/ überhaupt lintete (52 Workflows geprüft; _ci-python.yml wird von platform
# selbst nie aufgerufen; pre-commit hat keinen ruff-Hook). Pre-existing Lint-Schuld
# in vier Dateien ist bewusst per pyproject.toml [tool.ruff.lint.per-file-ignores]
# ausgenommen (mit Begründung dort) statt drive-by umgeschrieben.

on:
  push:
    paths:
      - "tools/**"
      - "scripts/**"
      - "shared_contracts/**"
      - "agents/**"
      # #901 Spec B: check_workflow_index.py gatet den Workflow-Index gegen die
      # .windsurf/workflows/-Quelle — bei Skill-Änderungen muss der Gate laufen.
      - ".windsurf/workflows/**"
      # #1287: seit der Lane-Konsolidierung scannt derselbe Gate auch skills/.
      # Ohne diesen Trigger liefe er bei einer reinen skills/-Änderung NICHT —
      # der Gate-Name bliebe grün, die Deckung wäre still weg (Konvention F-A).
      - "skills/**"
      # 2026-08-03: test_check_deploy_adr_supersession + test_adr_citation_lint u.a.
      # lesen den ADR-Baum. Ohne diesen Trigger lief der Gate bei einem reinen
      # ADR-Merge NICHT — ADR-292 machte main am 02.08. latent rot und blieb
      # unsichtbar, bis ein fremder PR zufaellig tools/** anfasste (#1702).
      - "docs/adr/**"
      # 2026-08-03, gemessen von test_ci_trigger_covers_test_inputs.py: diese
      # Pfade werden von tools/tests/ real gelesen und lagen ausserhalb des
      # Filters — der Gate lief bei ihrer Aenderung nicht.
      - ".github/workflows/**"   # test_audit_platform
      - ".windsurf/rules/**"     # test_gen_project_facts_guards
      - "infra/**"               # test_check_registry_view_readers
      - "registry/**"            # test_check_registry_view_readers
      - "governance/**"          # test_backup_meter (Soll-Liste expected-apps.json)
      # 2026-08-17: test_shared_ci_tag_drift haelt die Guard-Zuordnung im
      # Drift-Check gegen `.github/actions/workflow-guards/action.yml`. Benennt
      # dort jemand ein Skript um, laeuft die Wache ohne diesen Pfad NICHT —
      # und der Vergleich normalisierte still am falschen Ort (#2049).
      - ".github/actions/**"     # test_shared_ci_tag_drift
      # 2026-09-02 (#2654): test_pr_merge_sa.py belegt, dass docs/governance/ und
      # die Charta-Datei review-pflichtig sind. Ohne diese Pfade liefe der Gate
      # bei einer Aenderung genau dort NICHT — also an den Dateien, deren Schutz
      # er prueft. Gemessen von test_ci_trigger_covers_test_inputs.py.
      - "docs/governance/**"     # test_pr_merge_sa
      - "docs/konzepte/KONZ-platform-025-lotsen-charta.md"  # test_pr_merge_sa
  # #1414: KEIN `paths`-Filter auf pull_request — bewusst.
  #
  # Ein *required* Check mit paths-Filter läuft auf PRs, die keinen der Pfade
  # berühren, gar nicht; GitHub hält ihn dort dauerhaft auf `pending` und
  # blockiert damit ausgerechnet die PRs, die er nicht prüft. Der Job läuft
  # deshalb IMMER (meldet also immer seinen Check-Namen) und entscheidet als
  # ersten Schritt selbst, ob die teuren Steps nötig sind ("Zwilling-Muster").
  #
  # Die Pfad-Liste bleibt SSoT in `on.push.paths` oben — `ci_relevant_paths.py`
  # liest genau diesen Block. Eine zweite, komplementäre `paths-ignore`-Liste
  # wäre die naheliegende Alternative gewesen und genau die Drift-Falle: zwei
  # Listen, die exakte Komplemente bleiben müssten.
  pull_request:

# CI-5 (#1202): cancel superseded runs on rapid pushes to the same
# ref/PR — avoids self-overlap when several commits land in quick
# succession on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default (least privilege, #818 permissions sweep) —
# no job in this workflow needs to write via GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  tools-tests:
    name: pytest tools/tests/ + CI-tote Testorte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # einige Tests bauen Wegwerf-Git-Repos / lesen Refs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # #1414 Zwilling-Muster: der Job laeuft immer, entscheidet aber selbst,
      # ob die teuren Steps noetig sind. Dieser Step ist der einzige, der auf
      # jedem PR laeuft (~15 s) — alles Weitere haengt an seinem Output.
      - name: Relevanz bestimmen (Zwilling, #1414)
        id: relevanz
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "push-Event — bereits durch on.push.paths gefiltert, alle Steps laufen."
            exit 0
          fi
          pip install pyyaml --quiet --break-system-packages
          git fetch -q origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          python3 tools/ci_relevant_paths.py \
            --workflow .github/workflows/tools-tests.yml \
            --changed-file changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Install test deps
        if: steps.relevanz.outputs.relevant == 'true'
        # pydantic: shared_contracts-Tests (platform#820); Liste = Teilmenge von requirements-dev.txt
        run: pip install pytest pyyaml pydantic --quiet --break-system-packages

      - name: Run all tools tests
        if: steps.relevanz.outputs.relevant == 'true'
        # SSoT = Makefile `test`-Target (retro f4a546-incr #1: lokal liefen 388,
        # CI 486 Tests, weil beide Seiten eigene pytest-Listen pflegten — der
        # Makefile-Kommentar "identisch zu tools-tests.yml" war falsch). Jetzt
        # ruft CI exakt das Target, das auch Review-Gate 5b lokal verlangt.
        # Testorte-Rationale (agents/tests, vormals CI-dunkel) ist ins
        # Makefile-Target gewandert.
        run: make test

      # Dateien im PR-Diff ohne semantische Änderung — SUGGEST / non-gating
      # (repo-health-rule-discipline). Anlass 2026-07-21: ein `ruff format tools/`
      # plus `git add -A tools/` schleuste 95 fremde Dateien mit 4.912 Zeilen reiner
      # Reformatierung in einen PR, der 4 Dateien ändern sollte; aufgefallen erst am
      # Rebase-Konflikt. Baseline über alle 40 damals offenen PRs der Org: 0 Findings,
      # Positivkontrolle am Anlass-Commit: 93 von 95 erkannt.
      # Angekündigte Formatter-Sweeps sind legitim — der Check fragt, er verbietet nicht.
      # Grenze: greift nur, wenn dieser Workflow triggert (paths-Filter oben), also
      # nicht für Sweeps, die ausschließlich orchestrator_mcp/ oder packages/ treffen.
      - name: Rein formale Änderungen im Diff (SUGGEST, non-gating)
        if: github.event_name == 'pull_request' && steps.relevanz.outputs.relevant == 'true'
        run: |
          set +e
          git fetch -q origin "${{ github.base_ref }}"
          python3 tools/check_noop_changes.py \
            --range "origin/${{ github.base_ref }}...HEAD" --format github
          exit 0

      # Neue Module ohne Test-Spur — advisory (untested-tool-module-green-gate,
      # platform#1650 Owner-Go 2026-08-12). Nur im PR HINZUGEFUEGTE .py unter
      # tools/ + scripts/ (Bestandsschutz: die ~24 Altfaelle aus dem
      # Ehrlichkeits-Hinweis oben bleiben unberuehrt — 0-FP-Baseline). Exit 1
      # (Befund) laesst den Job gruen: advisory bis Kalibrierfenster
      # (gate-registry frozen_note). Exit >=2 (Werkzeugfehler) macht ROT — ein
      # Melder, der beim Ausfall schweigt, ist schlimmer als keiner.
      - name: Neue Module ohne Test-Spur (advisory, non-gating)
        if: github.event_name == 'pull_request' && steps.relevanz.outputs.relevant == 'true'
        run: |
          set +e
          git fetch -q origin "${{ github.base_ref }}"
          python3 tools/check_new_module_tests.py \
            --range "origin/${{ github.base_ref }}...HEAD"
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "::error::check_new_module_tests.py brach mit Exit $rc ab (Werkzeugfehler, kein Verdikt)"
            exit 1
          fi
          exit 0

      - name: Workflow-Index Vollständigkeit (K-44, #901 Spec B)
        if: steps.relevanz.outputs.relevant == 'true'
        # Jeder Skill in .windsurf/workflows/ muss in workflow-index.md stehen
        # (oder distribute:false / Allowlist). Struktureller Gate, keine LLM.
        run: python3 tools/check_workflow_index.py

      - name: Install ruff
        if: steps.relevanz.outputs.relevant == 'true'
        # Pin (2026-07-24): unpinned `pip install ruff` zog eine neuere Ruff-Version als der
        # lokale/pyproject-Stand -> RUF059/RUF100 feuerten repo-weit ueber Alt-Dateien und
        # faerbten JEDEN tools/-PR rot (belegt: main lokal @0.15.4 = 0 Verstoesse; #1420 mit
        # ruff-sauberen Eigen-Dateien scheiterte identisch). _ci-python.yml predigt Pinning
        # bereits -- hier nachgezogen. B) (Ruff-Bump + repo-weiter Fix) folgt separat.
        run: pip install "ruff==0.15.4" --quiet --break-system-packages

      - name: Lint (ruff check tools/ scripts/)
        if: steps.relevanz.outputs.relevant == 'true'
        # X-9: eigener Step NACH dem pytest-Step (Test-Failures sollen zuerst sichtbar
        # sein); per-file-ignores mit Begründung stehen in pyproject.toml.
        run: ruff check tools/ scripts/

      # Sichtbarkeit: ohne diesen Step sieht ein uebersprungener Lauf aus wie ein
      # Lauf, der nichts getan hat — der Grund muss im Log stehen, sonst wirkt der
      # gruene Check wie eine Aussage ueber Code, die er nicht ist.
      - name: Nicht relevant — teure Steps übersprungen
        if: steps.relevanz.outputs.relevant != 'true'
        run: |
          echo "Kein geänderter Pfad trifft on.push.paths dieses Workflows."
          echo "Der Check meldet grün, hat den Code aber NICHT geprüft —"
          echo "genau dafür ist das Zwilling-Muster da (#1414)."

  # Eigener JOB, nicht ein Step im Job oben — mit Absicht (platform#2690 K4).
  # Ein Step hier drin hätte den Check `tools-tests` rot gefärbt, und der steht
  # im Ruleset. Damit wäre die Frage „advisory oder required?" durch die
  # Verdrahtung vorentschieden gewesen statt vom Owner am Ruleset. Als eigener
  # Job meldet er einen eigenen Check-Namen: heute nicht required, also advisory;
  # scharf wird er durch einen Ruleset-Eintrag, nicht durch einen Datei-Edit.
  #
  # KEIN `paths`-Filter (den gibt es auf Job-Ebene ohnehin nicht) und keine
  # Relevanz-Weiche: `--neu` vergleicht die Registry gegen die Basis und meldet
  # bei unveränderter Datei „kein neuer oder geaenderter Gate-Eintrag" (Exit 0).
  # Der Filter steckt im Werkzeug, nicht in einer zweiten Pfadliste, die mit
  # `on.push.paths` driften könnte.
  gate-verankerung:
    name: Gate-Verankerung (Drill · Positivkontrolle · Messpunkt)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # `git show <basis>:<pfad>` braucht die Historie

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Exit 1 = Befund (ein neu verankertes Gate ohne Drill/Positivkontrolle/
      # Messpunkt), Exit 2 = Werkzeugfehler (Basis nicht lesbar). Beides macht
      # den Check rot: ein Melder, der beim eigenen Ausfall grün meldet, ist
      # schlimmer als keiner (`fetch-failure-is-not-a-green-state`).
      - name: Neue Gate-Einträge auf Drill, Positivkontrolle, Messpunkt prüfen
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          python3 tools/gate_verankerung_check.py \
            --neu --basis "origin/${{ github.base_ref }}"
