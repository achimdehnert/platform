repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Secret Detection (gitleaks)
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: main-tree-protect
        name: Main-Tree-Guard (ADR-233 — kein Commit im heiligen Haupt-Tree)
        language: system
        entry: tools/main-tree-guard.sh precommit-check
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: adr-number-guard
        name: ADR Number Guard (no duplicate numbers)
        language: python
        entry: python3 scripts/adr_next_number.py --check
        pass_filenames: false
        always_run: false
        files: ^docs/adr/ADR-.*\.md$
        stages: [pre-commit]

      - id: adr-schema-validate
        name: ADR Schema Validation (iil-adrfw)
        language: system
        entry: iil-adrfw validate docs/adr/
        pass_filenames: false
        always_run: false
        files: ^docs/adr/ADR-.*\.md$
        stages: [pre-commit]

      # Realfall 2026-07-31: ein Commit, der über den Marker SCHRIEB, trug ihn
      # wörtlich in der Message — GitHub startete keinen Lauf, die Required
      # Checks meldeten nie, platform#1503 blieb 37 h 56 min blockiert, ohne rot
      # zu werden. Absichtliche Nutzung bleibt möglich (Trailer "Skip-CI: absichtlich").
      - id: no-accidental-skip-ci
        name: "[skip ci] in der Commit-Message nur mit Opt-in-Trailer"
        language: system
        entry: python3 tools/hooks/check_skip_ci_marker.py
        pass_filenames: true
        always_run: true
        stages: [commit-msg]
