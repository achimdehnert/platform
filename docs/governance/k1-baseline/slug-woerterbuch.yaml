# baseline-2026-07-19--2026-08-01.md, hier zusaetzlich maschinenlesbar, damit
# der Ausgang gerechnet und nicht von Hand behauptet wird. Werte NICHT
# nachtraeglich aendern — sie sind vor der Messung registriert worden.
schwellen:
