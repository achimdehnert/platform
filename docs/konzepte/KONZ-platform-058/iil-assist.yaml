# iil-assist — Zustand des Programms (platform#3011, Kriterium 6)
# Maschinenlesbar, damit ein fremdes Modell ohne Chat-Verlauf den naechsten Schritt
# ableiten kann. Pruefen: python3 tools/iil_assist_katalog.py validate
# Briefing:  python3 tools/iil_assist_katalog.py briefing
# Naechster: python3 tools/iil_assist_katalog.py naechster-schritt
schema: iil-assist/1
auftrag: https://github.com/achimdehnert/platform/issues/3011
konzept: docs/konzepte/KONZ-platform-058-iil-assist-ein-dienst-zwei-zugaenge.md
phase: bau              # konzept -> auswahl -> bau -> staging -> bilanz (Owner-Go 2026-09-10: 'go, bau MVP 1')
stand: 2026-09-10

name:
  produkt: iil-assist-hub
  repo: chat-hub                       # iilgmbh/chat-hub — keine Umbenennung
  kern: iil-assist-core                # PyPI 0.2.0, Fachkern (Mandant, Fristen)
  alias_route: assist.iil.pet
  alias_status: nicht-angelegt         # DNS = Prod-Aenderung, Owner-Zug
  regel: >
    iil-assist-hub ist der Produktname des Dienst-Zugangs im Chat. Das Repo bleibt
    chat-hub, der Fachkern bleibt iil-assist-core. Ein Hub-Dienst gehoert dem Hub,
    nicht der Familie; die Familie stellt Vertrag, Gateway und Chat-Zugang.

architektur:
  kern: >
    Ein Dienst ist eine reine Funktion im Service-Layer des Hubs mit einem
    deklarierten Vertrag (Name, Eingabe, Ausgabe, Datenklasse, Gate). Die App ruft
    die Funktion direkt. Der Chat ruft sie ueber ein Gateway, das den Vertrag liest
    und den Aufruf auf dem Host des Hubs ausfuehrt. Der Vertrag wird einmal
    geschrieben und zweimal gelesen.
  schichten:
    - id: vertrag
      wo: Hub-Repo, Paket iil-dienst (neu, klein)
      was: "@dienst-Dekorator, dienste_export (JSON), dienst_aufruf <name> --json"
    - id: zugang_app
      wo: Hub-Repo, views (ADR-009)
      was: View ruft dieselbe Funktion; data-dienst-Marker fuer den Zugangstest
    - id: gateway
      wo: mcp-hub, orchestrator_mcp
      was: "zwei MCP-Werkzeuge: dienst_katalog, dienst_aufruf; Routing ueber ports.yaml (prod_host, container_name); Protokoll nach ADR-037"
    - id: zugang_chat
      wo: chat-hub, chat_lotse.py
      was: "Stufe A (Session) heute: Kapitaen ruft das Gateway; Stufe B (Live-Bot) nur mit Owner-Grant (chat-hub#48)"
  entscheide:
    - id: D1
      text: Gateway statt Direktaufruf je Hub — eine Auth-Grenze, kein Tool-Wachstum (ADR-101 Budget +2)
      status: entschieden
      evidenz: C5, C9
    - id: D2
      text: Aufruf auf dem Host des Hubs per Management-Command, nicht per neuer HTTP-Schnittstelle je Hub — Cloudflare Access sperrt externe API-Aufrufe
      status: entschieden
      evidenz: C10
    - id: D3
      text: Vertrag als kleines eigenes Paket iil-dienst, weil iil-django-commons eingefroren ist und iil-assist-core Fachkern bleibt
      status: entschieden
      evidenz: C11, ADR-044
    - id: D4
      text: MVP-Abnahme des Chat-Zugangs in Stufe A (Session); der Live-Bot ist ein Gate, kein Kriterium
      status: entschieden
      evidenz: C3
    - id: D5
      text: Das chat-agent-Paket (ADR-034/036) wird nicht wiederbelebt; Toolkits werden als Dienste deklariert
      status: entschieden
      evidenz: C2
  konflikte:
    - adr: ADR-036
      was: implementation_status implemented, Paket liegt im Archiv
      folge: Status auf superseded setzen, sobald der erste MVP steht
    - adr: ADR-101
      was: Tool-Budget 100
      folge: Gateway traegt genau zwei Werkzeuge; Dienste sind Daten, nicht Tools
    - adr: ADR-044
      was: kein fuenftes Paket ohne zweiten Abnehmer
      folge: iil-dienst hat beim MVP fuenf Abnehmer; Vertragsformat ist kein Fachpaket
    - adr: ADR-009
      was: kein ORM in Views
      folge: bestaetigt — der Vertrag sitzt genau im Service-Layer
    - adr: ADR-037
      was: Chat-Protokollierung
      folge: gilt fuer jeden Gateway-Aufruf; Datenklasse entscheidet ueber Protokolltiefe
    - adr: KONZ-platform-025
      was: Charta Art. 1/2
      folge: Nachricht ist Anfrage an den Katalog, nie Befehl an die Session; Aussenwirkung bleibt Entwurf

dienste:
  - id: plattform-status
    name: Plattform-Status
    repo: dev-hub
    reifegrad: vorhanden
    basis: [apps/mail_agent/management/commands/mail_lesenaht.py, "Health-Dashboard (deployment_mcp)"]
    datenklasse: intern
    chat_eignung: ja
    gate: keins
    aufwand: S
    prio: 1
    mvp: true
    status: gebaut
    begruendung: reiner Lesedienst ohne Datenrisiko; prueft Gateway und beide Zugaenge zuerst
    artefakte:
      vertrag: https://github.com/achimdehnert/platform/pull/3018
      pypi: https://github.com/achimdehnert/platform/issues/3019
      dienst: https://github.com/achimdehnert/dev-hub/pull/346
      gateway: https://github.com/achimdehnert/mcp-hub/pull/263
    zugaenge:
      app: GET /health/status.json (health:status), data-dienst am Grid
      chat: dienst_aufruf(repo=dev-hub, name=plattform-status) im Orchestrator, Antwort per chat_lotse send
    kill_gate:
      frist: 2026-10-24
      kriterium: Test je Zugang gruen auf Staging, sonst Dienst zurueck auf vorgeschlagen
    kennzahlen:
      test_app: 1
      test_chat: 1
      antwortzeit_s: null
      nutzungen_30d: null
  - id: dokument-suche
    name: Dokument-Suche (Paperless)
    repo: doc-hub
    reifegrad: teilweise
    basis: [mcp-hub/paperless_mcp, "docs.iil.pet manage.py shell"]
    datenklasse: personenbezogen
    chat_eignung: raum-gebunden
    gate: raum-bindung
    aufwand: S
    prio: 1
    mvp: true
    status: vorgeschlagen
    begruendung: hoher Tageswert; beweist die Raum-Bindung fuer personenbezogene Daten
  - id: fristen-auskunft
    name: Fristen-Auskunft (Ampel, naechste Fristen)
    repo: frist-hub
    reifegrad: teilweise
    basis: [iil-assist-core assist_core/models.py, apps/fristen/services]
    datenklasse: mandant
    chat_eignung: raum-gebunden
    gate: raum-bindung
    aufwand: M
    prio: 1
    mvp: true
    status: vorgeschlagen
    begruendung: Fachkern der Familie; frist-hub ist blockiert, Abnahme auf Staging
  - id: thema-nachfragen
    name: Thema nachfragen (Morgen-Zeitung)
    repo: news-hub
    reifegrad: vorhanden
    basis: [apps/digest/services, apps/digest/management/commands/digest_taeglich.py]
    datenklasse: intern
    chat_eignung: ja
    gate: keins
    aufwand: S
    prio: 2
    mvp: true
    status: vorgeschlagen
    begruendung: die Zeitung liegt schon im Chat; Rueckfrage ist der natuerliche zweite Zugang
  - id: bild-erzeugen
    name: Bild erzeugen
    repo: illustration-hub
    reifegrad: vorhanden
