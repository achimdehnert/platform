top3:
  - plattform-status
  - dokument-suche
  - fristen-auskunft

offen:
  - id: O1
    frage: Auswahl der fuenf MVPs bestaetigen oder kippen (Kommentar im Issue 3011); Owner-Go fuer MVP 1 liegt vor
    wer: owner
  - id: O2
    frage: Owner-Grant fuer den Live-Bot (chat-hub#48 Stufe B) — Zeitpunkt
    wer: owner
  - id: O3
    frage: 15 von 39 Diensten in ports.yaml ohne prod_host — Routing-Tabelle des Gateways unvollstaendig (Issue 3021)
    wer: ich
  - id: O4
    frage: Zustellweg der Morgen-Zeitung in den Chat ist im Repo nicht belegt (Hypothese Host-Unit)
    wer: ich

proben:             # K6: frisches Modell bekommt nur das Briefing
  - datum: 2026-09-10
    modell: claude-sonnet (Subagent, nur Read auf briefing.md)
    top3_korrekt: true
    mvps_korrekt: true
    naechster_schritt_korrekt: true
    name_korrekt: true
    bemerkung: "Fund: O1 endete mit 'Kommentar in' — das '#3011' war in YAML ein Kommentar geworden; behoben (Issue 3011 ausgeschrieben)"

bahnen:
  verbesserung:
    takt: taeglich
    kommando: python3 tools/iil_assist_katalog.py bahn verbesserung --inventar <json>
    frage: Was ist je Dienst besser geworden (Tests je Zugang, Antwortzeit, Nutzung)?
    laeufe: []
  wartung:
    takt: taeglich
    kommando: python3 tools/iil_assist_katalog.py bahn wartung
    frage: Welcher Dienst kippt als naechstes (Betriebsstatus, Alter des letzten Commits, Lebenszyklus)?
    laeufe: []
  diabolus:
    takt: woechentlich
    kommando: python3 tools/iil_assist_katalog.py bahn diabolus
    frage: Was widerspricht der eigenen Architektur? Briefing nach ~/shared, Antwort wird eingetragen
    laeufe: []
  ootb:
    takt: woechentlich
    kommando: python3 tools/iil_assist_katalog.py bahn ootb
    frage: Welcher Dienst fehlt, den keiner nannte? Kandidaten landen als vorgeschlagen im Katalog
    laeufe: []
  anschluss: https://github.com/achimdehnert/platform/issues/2855
  verdrahtung: https://github.com/achimdehnert/platform/issues/3020
