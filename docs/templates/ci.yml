# IIL Platform — ci.yml (Golden Path)
# Kopiere nach .github/workflows/ci.yml im Ziel-Repo
# Ersetze REPO_NAME + HEALTH_URL + django_settings_module
#
# Jeder `with:`-/`secrets:`-Schluessel unten ist gegen den `workflow_call`-Vertrag
# des gepinnten Reusables geprueft (tools/tests/test_template_reusable_inputs.py,
# #3406). Wer einen Pin hebt, traegt den Vertrag des neuen Tags in
# tools/tests/fixtures/reusable_interfaces/shared_ci.yaml nach.
#
# secrets-scan (gitleaks) ist ein BLOCKIERENDER Gate. Bei False Positives
# oder Pre-existing History-Leaks: docs/templates/.gitleaks.toml als
# Vorlage nutzen (.gitleaksignore für Einzel-Fingerprints bevorzugt).

name: CI — REPO_NAME

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Caller-side GITHUB_TOKEN scopes. A called reusable workflow can only
# NARROW these, never grant — so the caller MUST declare every scope its
# reusable workflows need, here, explicitly. Relying on the repo default
# token is the trap that caused the #198 startup_failure: a job-level
# `permissions:` in a called workflow requesting an absent scope rejects
# the whole run at startup (no jobs, no annotation) for every consumer.
#   contents: read   → checkout (all reusable jobs)
#   packages: write  → _build-docker.yml ghcr.io push
# (secrets-scan uses the gitleaks CLI on local history — needs no scope.)
permissions:
  contents: read
  packages: write

jobs:
  ci:
    # SSoT ist iilgmbh/shared-ci (#1423 — platforms Kopie war consumer-los und wurde
    # retired). Auf einen Tag pinnen, nicht @main: Fleet-Konvention, und der
    # shared-ci-Tag-Drift-Check in scripts/drift_check.py meldet veraltete Pins.
    # Cross-Org-Hinweis: liegt das Consumer-Repo NICHT in iilgmbh, liefert
    # `secrets: inherit` keine Caller-Secrets (platform#1158). Wer private
    # git+https-Deps zieht, muss PROJECT_PAT explizit mappen:
    #   secrets:
    #     PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
    uses: iilgmbh/shared-ci/.github/workflows/_ci-python.yml@v1.0.14
    with:
      python_version: "3.12"
      django_settings_module: "config.settings.test"   # ← anpassen
      run_contract_tests: true
      coverage_threshold: 80
    secrets: inherit

  build:
    needs: ci
    if: github.ref == 'refs/heads/main'
    # Image-Name = Repo-Name (Default), Tag = Commit-SHA; beides liefert das
    # Reusable selbst — `repo_name`/`image_tag` kennt es nicht als Input.
    uses: achimdehnert/platform/.github/workflows/_build-docker.yml@main
    with:
      dockerfile: Dockerfile                           # ← anpassen
    secrets: inherit

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    # Vorbild: apo-hub ci.yml (Job `deploy`, gruen). Der Port steht nicht hier,
    # sondern in docker-compose.prod.yml auf dem Server.
    uses: iilgmbh/shared-ci/.github/workflows/_deploy-hetzner.yml@v1.1.18
    with:
      app_name: REPO_NAME                              # ← anpassen
      deploy_path: /opt/REPO_NAME                      # ← anpassen
      health_url: HEALTH_URL                           # ← anpassen (z.B. https://<domain>/livez/)
      image_tag: ${{ needs.build.outputs.image_tag }}  # commit-gepinnt
    # Explizit statt `secrets: inherit`: liegt das Consumer-Repo nicht in iilgmbh,
    # reicht `inherit` die required-Secrets nicht durch die Org-Grenze
    # ("Secret HETZNER_HOST is required, but not provided", apo-hub).
    secrets:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
