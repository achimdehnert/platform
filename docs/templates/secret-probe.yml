name: "Secret-Probe"

# Vorlage (KONZ-dev-hub-005 REC-4, platform#2813). Kopieren nach
# `.github/workflows/secret-probe.yml` im Zielrepo — erstes Ziel: iilgmbh/risk-hub.
#
# WOZU: `tools/rotate.py` belegt die Wirkung eines neu gesetzten Secrets, indem
# es diesen Workflow per `workflow_dispatch` startet und im Log nach dem Marker
# `✓ <NAME> gueltig` sucht. Ohne einen solchen Beleg gilt ein Konsument als
# NICHT gesetzt (§5.4).
#
# DREI EIGENSCHAFTEN, DIE NICHT VERHANDELBAR SIND:
#
#  1. **Kein Rueckfall auf GITHUB_TOKEN.** Genau das macht den vorhandenen
#     Beleg-Workflow in meiki-hub wertlos:
#         GH_TOKEN: ${{ secrets.X || secrets.GITHUB_TOKEN }}
#     Er wird auch dann gruen, wenn X fehlt oder abgelaufen ist — der Realfall,
#     der die Rotation ueberhaupt ausgeloest hat (AD-4).
#  2. **Deployt nichts.** Ein Beleg, der einen Deploy ausloest, wird beim
#     naechsten Mal nicht mehr gefahren (MT-7). Dieser Job liest genau einen
#     API-Endpunkt und schreibt eine Zeile.
#  3. **Der Marker steht NUR bei Erfolg.** Kein `|| true`, kein `continue-on-error`,
#     kein Echo vor dem Aufruf.
#
# NEGATIVPROBE BEIM ANLEGEN (einmalig, vom Owner):
#   Vor dem ersten echten Lauf den Workflow einmal mit dem ALTEN/leeren Wert
#   starten. Er MUSS rot werden. Ein Beleg-Workflow, der noch nie rot war,
#   ist kein Beleg — er ist eine Behauptung.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Name des zu pruefenden Repo-Secrets (z. B. GENESOR_PROJECT_TOKEN)"
        required: true
        type: string

permissions: {}

jobs:
  probe:
    name: "Secret pruefen"
    runs-on: ubuntu-latest
    steps:
      - name: Aufruf mit dem Secret
        env:
          # Kein `||`-Rueckfall. Ist das Secret nicht gesetzt, ist die Variable
          # leer und der Schritt bricht ab — das ist der gewollte Ausgang.
          GH_TOKEN: ${{ secrets[inputs.secret_name] }}
          NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Secret '$NAME' ist in diesem Repo nicht gesetzt." >&2
            exit 1
          fi
          # Minimaler Aufruf: liest die eigenen Repo-Metadaten. Braucht nur
          # Metadata-Leserecht, veraendert nichts, und schlaegt mit 401 fehl,
          # sobald der Wert ungueltig ist.
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' > /dev/null
          # Der Marker. Erst hier, nach dem gelungenen Aufruf.
          echo "✓ $NAME gueltig"
