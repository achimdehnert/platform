# governance/ci-deckung-verzicht.yaml — bewusster Verzicht fuer tools/ci_deckung.py
#
# Ein Makefile-Ziel, das lokal ein Pruefwerkzeug ausfuehrt, aber NIE im CI laeuft,
# ist normalerweise ein Befund (Slug `ci-gate-narrower-than-local-test`). Hier
# stehen die Ausnahmen, die legitim sind — GPU, echte Hardware, Prod-Zugriff —
# statt als Ausnahmeliste im Code zu leben.
#
# Schema je Eintrag, alle drei Felder Pflicht:
#   repo    Verzeichnisname unter ~/github/ (Basisname des --repo-Pfads)
#   ziel    Makefile-Ziel exakt wie im Report/JSON von ci_deckung.py
#   grund   PFLICHT. Ein Eintrag ohne Grund ist ungueltig — ci_deckung.py meldet
#           ihn als Fehler und wendet ihn NICHT an (kein stiller Verzicht).
#
# ci_deckung.py liest diese Datei OHNE PyYAML (stdlib-only Pflicht) — Format
# bewusst flach halten: eine Ebene Liste, drei Skalarfelder je Eintrag, JE FELD
# EINE ZEILE (kein Blockskalar `>`/`|` — der Handparser liest nur `key: value`).

- repo: chat-hub
  ziel: chat-verify
  grund: "Prod-Zugriff — braucht laufenden Homeserver+SFU, chat-hub CLAUDE.md: nur gegen den echten Server pruefbar, steht auf dem Dev-Host statt im Runner. Verifiziert per Hand-Lauf."

- repo: chat-hub
  ziel: chat-verify-init
  grund: "Prod-Zugriff — legt per docker exec einen echten Matrix-Nutzer an einem laufenden Homeserver an, dieselbe Begruendung wie chat-verify."

# platform: vier Ziele (platform#3472, Session-Start 2026-09-24 #3471).
# Das Werkzeug matcht Kommandotext; ein Make-Ziel, dessen Pruefung in CI unter
# anderem Namen laeuft, braucht den Verzicht MIT dem Ort, an dem sie laeuft.

- repo: platform
  ziel: boards-check
  grund: "Braucht das lokale Mail-Ledger ~/.claude/mail-vorgaenge.json (bewusst nicht im Repo, Mandantendaten). Der erste CI-Lauf (PR #3480, 2026-09-24) brach mit 'Ledger fehlt — erst /mailcheck laufen lassen' ab. K1-Beleg #2592 gilt damit lokal auf der Dev-Maschine, wo der Mail-Agent laeuft."

- repo: platform
  ziel: check-push
  grund: "Lokaler Spiegel der Push-Gates. Drei der vier laufen in CI direkt: check_registry_view_readers.py (registry-consistency.yml, tools-tests.yml), publish_gate_invariant.sh (validate-workflows.yml, pypi-fleet-health.yml), check_publish_gate.py (pypi-gate-meter.yml). Das vierte, tools/checks/mandantendaten_gate.py diff, vergleicht gegen Quellen, die bewusst NICHT im Repo liegen (~/.claude/mail-vorgaenge.json, Paperless) — laut eigenem Docstring ein lokaler Riegel, den CI nicht fuehren kann."

- repo: platform
  ziel: workflow-lint
  grund: "Convenience-Preflight laut Makefile (KEIN Hard-Gate). yamllint und actionlint laufen in CI direkt in validate-workflows.yml mit denselben Configs; das Make-Ziel spiegelt sie nur lokal."

- repo: platform
  ziel: lint-registry
  grund: "STUNDUNG, kein Dauerzustand: validate_repos.py meldet 8 Inkonsistenzen zwischen ports.yaml und der Repo-Registry (wedding-hub/recruiting-hub/onboarding-hub archiviert aber in ports.yaml; chat-hub, lotse-raum, chathub-rtc-livekit-7881/7882 ohne Registry-Eintrag; mcp-hub port_prod 8000 vs. 3000). Als CI-Gate sofort rot; die Klaerung braucht Owner-Entscheide (mcp-hub-Port ist seit Juli baselined, C4:8000). Der tenancy-Teil laeuft in registry-lint.yml ueber make lint-tenancy. Anker mit Akzeptanzkriterium: platform#3477."
