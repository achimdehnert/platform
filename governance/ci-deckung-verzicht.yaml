# governance/ci-deckung-verzicht.yaml — bewusster Verzicht fuer tools/ci_deckung.py
#
# Ein Makefile-Ziel, das lokal ein Pruefwerkzeug ausfuehrt, aber NIE im CI laeuft,
# ist normalerweise ein Befund (Slug `ci-gate-narrower-than-local-test`). Hier
# stehen die Ausnahmen, die legitim sind — GPU, echte Hardware, Prod-Zugriff —
# statt als Ausnahmeliste im Code zu leben.
#
# Schema je Eintrag, alle drei Felder Pflicht:
#   repo    Verzeichnisname unter ~/github/ (Basisname des --repo-Pfads)
#   ziel    Makefile-Ziel exakt wie im Report/JSON von ci_deckung.py
#   grund   PFLICHT. Ein Eintrag ohne Grund ist ungueltig — ci_deckung.py meldet
#           ihn als Fehler und wendet ihn NICHT an (kein stiller Verzicht).
#
# ci_deckung.py liest diese Datei OHNE PyYAML (stdlib-only Pflicht) — Format
# bewusst flach halten: eine Ebene Liste, drei Skalarfelder je Eintrag, JE FELD
# EINE ZEILE (kein Blockskalar `>`/`|` — der Handparser liest nur `key: value`).

- repo: chat-hub
  ziel: chat-verify
  grund: "Prod-Zugriff — braucht laufenden Homeserver+SFU, chat-hub CLAUDE.md: nur gegen den echten Server pruefbar, steht auf dem Dev-Host statt im Runner. Verifiziert per Hand-Lauf."

- repo: chat-hub
  ziel: chat-verify-init
  grund: "Prod-Zugriff — legt per docker exec einen echten Matrix-Nutzer an einem laufenden Homeserver an, dieselbe Begruendung wie chat-verify."

# platform: vier Ziele (platform#3472, Session-Start 2026-09-24 #3471).
# Das Werkzeug matcht Kommandotext; ein Make-Ziel, dessen Pruefung in CI unter
# anderem Namen laeuft, braucht den Verzicht MIT dem Ort, an dem sie laeuft.

- repo: platform
  ziel: boards-check
  grund: "Braucht das lokale Mail-Ledger ~/.claude/mail-vorgaenge.json (bewusst nicht im Repo, Mandantendaten). Der erste CI-Lauf (PR #3480, 2026-09-24) brach mit 'Ledger fehlt — erst /mailcheck laufen lassen' ab. K1-Beleg #2592 gilt damit lokal auf der Dev-Maschine, wo der Mail-Agent laeuft."

- repo: platform
  ziel: check-push
  grund: "Lokaler Spiegel der Push-Gates. Drei der vier laufen in CI direkt: check_registry_view_readers.py (registry-consistency.yml, tools-tests.yml), publish_gate_invariant.sh (validate-workflows.yml, pypi-fleet-health.yml), check_publish_gate.py (pypi-gate-meter.yml). Das vierte, tools/checks/mandantendaten_gate.py diff, vergleicht gegen Quellen, die bewusst NICHT im Repo liegen (~/.claude/mail-vorgaenge.json, Paperless) — laut eigenem Docstring ein lokaler Riegel, den CI nicht fuehren kann."

- repo: platform
  ziel: workflow-lint
  grund: "Convenience-Preflight laut Makefile (KEIN Hard-Gate). yamllint und actionlint laufen in CI direkt in validate-workflows.yml mit denselben Configs; das Make-Ziel spiegelt sie nur lokal."

- repo: platform
  ziel: lint-tenancy
  grund: "Teilmenge von lint-registry: validate_tenancy.py laeuft in registry-lint.yml ueber make lint-registry (seit #3505, 2026-09-24). Ein zweiter Aufruf per make lint-tenancy wuerde dieselbe Pruefung doppelt fahren; Session-Start 0.7.26 meldete das Ziel nach dem Umbau als einzigen Rest (platform#3472)."

# platform#3477: der lint-registry-Verzicht ist behoben (0 Inkonsistenzen,
# .github/workflows/registry-lint.yml laeuft jetzt `make lint-registry` statt
# `make lint-tenancy`) und deshalb entfernt — kein Eintrag mehr fuer `ziel:
# lint-registry` hier.

# meiki-hub: ein Ziel (Session-Start 2026-09-27, Delta-Klasse NEU in 0.7.26).
# Alle drei Kommandos des Make-Ziels laufen in CI unter anderem Namen.

- repo: meiki-hub
  ziel: lint
  grund: "Lokaler Spiegel dreier CI-Schritte, die unter anderem Namen laufen: markdownlint als markdownlint-cli2-action in lint.yml (advisory, continue-on-error wie das `|| true` im Make-Ziel), Platzhalter-Scan (einzutragen/TODO/FIXME/TBD/XXX) als eigener Schritt in quality.yml, scripts/glossar-check.py als Schritt in quality.yml (continue-on-error). Das Werkzeug matcht Kommandotext und sieht die Action und die Inline-Schritte nicht."

# writing-hub: acht Ziele (Owner-Wort 2026-10-08 "R1 verzicht alle", Session-Start
# 0.7.26 meldete 14 Kommandos). Die CI ruft nie `make`, sondern pytest/ruff direkt
# (shared-ci _ci-python.yml) bzw. `make klickdummy`; die Make-Ziele sind lokale
# Huellen um denselben Lauf oder lesen Prod. Die 7 gemeldeten Kommandos unter
# `test-session` sind Fragmente einer Shell-Schleife — Melder-Befund platform#3845.

- repo: writing-hub
  ziel: test-pg
  grund: "Lokale Huelle: startet einen eigenen postgres:16-alpine-Container und faehrt darin pytest (alles ausser tests/ux). In CI laeuft pytest direkt ueber shared-ci _ci-python.yml@v1.1.20 (ci.yml Job `ci`) plus gezielte pytest-Schritte im Lecture-Outline-Job; das Werkzeug sieht den Aufruf ohne `make` nicht."

- repo: writing-hub
  ziel: test-v
  grund: "Verbose-Variante von test-pg (gleicher pytest-Lauf mit -v); Deckung wie test-pg ueber shared-ci _ci-python.yml."

- repo: writing-hub
  ziel: lint
  grund: "`ruff check .` laeuft in CI ueber shared-ci _ci-python.yml@v1.1.20 (ci.yml Job `ci`), nicht ueber make."

- repo: writing-hub
  ziel: test-ux
  grund: "Playwright-Tests tests/ux brauchen ein installiertes Chromium; CI faehrt davon den Parity-Test im Klickdummy-Job (`make klickdummy`, ci.yml Zeile 120) und sonst tests/e2e direkt. Rest der UX-Suite bewusst lokal (Owner 2026-10-08)."

- repo: writing-hub
  ziel: klickdummy-i1
  grund: "Teilmenge von `make klickdummy`, das CI im Klickdummy-Job faehrt (ci.yml Zeile 120, Pfadfilter klickdummy/, templates/lectures/, tests/ux/test_lecture_outline_wizard_parity.py). Ein eigener Aufruf wuerde I1 doppelt fahren."

- repo: writing-hub
  ziel: test-smoke
  grund: "Prod-Zugriff: tests/smoke liest den Bestand der laufenden Instanz (writing.iil.pet, Prefix /projekte/) — nur vom Dev-Host mit Zugang pruefbar, nicht im Runner."

- repo: writing-hub
  ziel: gui-pruefung-live
  grund: "Prod-Zugriff: faehrt tests/smoke/test_bestand_ist_lesbar.py gegen die Live-Instanz, dieselbe Begruendung wie test-smoke."

- repo: writing-hub
  ziel: test-session
  grund: "Kein Pruefziel, sondern das Hilfsziel von test-pg/test-ux fuer den Container-Lebenszyklus (docker run, pg_isready-Schleife, trap). Die 7 gemeldeten Kommandos (`break`, `sleep 1`, `for i in …`) sind Bruchstuecke der Schleife — Melder-Befund platform#3845; Verzicht bis der Melder logische Zeilen ganz liest."
