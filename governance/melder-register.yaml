# governance/melder-register.yaml — #2690 K3 ("Vorausschauende Wartung")
#
# Ein Eintrag je Runner-Phasen-ID aus tools/session_start_checks.sh
# (`grep -oE 'record "[0-9][^"]*"' tools/session_start_checks.sh | sort -u`).
# Jeder Eintrag traegt vier Dinge:
#   leser              wer den Befund liest und entscheidet. Abgeleitet aus den
#                       WARN-Erklaerungen in .windsurf/workflows/session-start.md
#                       (Abschnitt "0.R Runner ausfuehren", Zeilen 89-179) sowie
#                       Querverweisen in session-ende.md. Steht dort nichts,
#                       bleibt es ehrlich "UNBENANNT" statt erfunden — genau
#                       diese Zahl ist die Ist-Messung "Melder ohne Leser"
#                       (Audit #2606-Muster).
#   wiedervorlage_tage  Default 14 (siehe FRIST_VERANKERT_TAGE in befund_journal.py).
#   praezision_min      Default 0.6 (PRAEZISION_SCHWELLE in befund_journal.py) —
#                       unter dieser Trefferquote ueber >= mindest_laeufe
#                       beurteilte Laeufe stuft sich der Melder selbst auf
#                       HINWEIS herab (tools/melder_register_check.py --herabstufung).
#   mindest_laeufe      Default 5 — bewusst ueber MIN_URTEILE=3 in befund_journal.py
#                       (dort gilt ein Melder schon ab 3 Urteilen als bewertbar;
#                       die Selbst-Herabstufung verlangt mehr Evidenz, bevor sie
#                       eine Phase leiser macht).
#   runbook             Anker im Runner-Dokument, Form "0.R#<phase-id>".
#   geschaerft_am       OPTIONAL, Form "YYYY-MM-DD". Eine Nullstellung MIT Datum,
#                       keine Loeschung: Urteile VOR diesem Datum zaehlen nicht
#                       mehr in die Trefferquote (tools/befund_journal.py
#                       --praezision). Dieselbe Mechanik wie `revised` bei
#                       tools/gate_wirkung.py (Zeile ~256), nur fuer Melder statt
#                       Gates — ein geschaerfter Melder soll sich ueber neue
#                       Urteile erholen koennen, nicht ewig an alten Fehlalarmen
#                       haengen bleiben. Weniger als MIN_URTEILE=3 Urteile SEIT
#                       der Nullstellung heisst "NICHT bewertbar", nicht WARN.
#
# Karteileichen (Eintrag ohne passende Runner-Phase) und fehlende Eintraege
# (Runner-Phase ohne Register-Zeile) meldet tools/melder_register_check.py --kurz.

melder:
  - phase: "0.0 env+banner"
    # record() kennt hier nur PASS (grep -n 'record "0.0 env+banner"' session_start_checks.sh) — kein WARN-Pfad, also kein Owner-Entscheid moeglich.
    leser: "Sitzungsagent — Runner-Abbruch/Weiterlauf, kein Owner-Entscheid"
    wiedervorlage_tage: 14
    praezision_min: 0.6
    mindest_laeufe: 5
    runbook: "0.R#0.0"

  - phase: "0.1 server-probe"
    # Zeile 122 session_start_checks.sh: WARN nur bei fehlgeschlagener TCP-Probe — Diagnose/Retry ist Agent-Handlung, kein Owner-Entscheid.
