# governance/merge-sa-owner-wort-repos.yaml — Repo-Positivliste (Liste L) fuer
# Merges MIT gesetztem OWNER_WORT durch tools/pr_merge_sa.py.
#
# Quelle: platform#3804 Kriterium K7. Owner-Wort 2026-10-08 "D go"; Ausschluss
# meiki-lra/* und ttz-lif/* nach Owner-Wort 2026-10-06 (kein autonomes Deploy).
#
# Semantik: Ist die Umgebungsvariable OWNER_WORT gesetzt (die Permission-Regel
# erlaubt den Aufruf dann ohne Owner-Klick), merged pr_merge_sa.py nur Repos
