# Fehlt die Datei, ist sie unlesbar oder leer: Abweisung mit OWNER_WORT (fail closed).
#
# Schema: Schluessel `repos`, Liste von "owner/repo" (Gross-/Kleinschreibung egal).
# Aenderungen an dieser Datei gehen nur ueber einen Owner-approvten PR.
repos:
  - iilgmbh/risk-hub
  - achimdehnert/writing-hub
  # Owner-Wort 2026-10-13 "LL go" (KONZ-070 SA, platform#3903): Owner-Wort-Pfad
  # fuer Governance-Pfade (#3938) braucht platform in dieser Liste, sonst inert.
  - achimdehnert/platform
  # Owner-Wort 2026-10-14 "robo-lab soll auf Liste der Repos steht, die dafür
  # freigegeben sind" (robo-lab#277: ci.yml als Governance-Pfad, Autor = Owner,
  # kein Selbst-Approve möglich, Review-Bot nur in platform).
  - achimdehnert/robo-lab
