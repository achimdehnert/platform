# systemd-oomd fuer die Login-Sitzungen des Dev-/Session-Hosts (platform#3616).
# Ziel: /etc/systemd/system/user.slice.d/10-oomd.conf — eingespielt von
# oomd-einspielen.sh, nicht von Hand.
#
# Steht user.slice 20 s (DefaultMemoryPressureDurationSec des Pakets) ueber 60 %
# Speicherdruck, beendet oomd die Blatt-cgroup darunter mit der meisten
# Reclaim-Aktivitaet, typischerweise eine ganze session-*.scope. Das trifft auch
# eine Agenten-Sitzung, die einen schweren Lauf selbst gestartet hat, das ist der
# bewusste Preis. system.slice (Runner, Docker) wird nicht ueberwacht und
# bleibt verschont. Anlass: OOM 2026-09-26, 35 Kernel-Kills, zuerst der Runner.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
