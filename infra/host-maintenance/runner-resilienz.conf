# systemd-Drop-in fuer JEDEN self-hosted Actions-Runner (actions.runner.*.service)
# Ziel: /etc/systemd/system/actions.runner.<org>-<repo>.<name>.service.d/10-resilienz.conf
# Einspielen: infra/host-maintenance/runner-resilienz-einspielen.sh (idempotent)
#
# Realfall 2026-09-26 08:06 UTC, dev-desktop: globaler OOM; der Kernel killte einen
# gpg-agent (44 kB) aus dem Job-Baum des Runners mcp-hub-staging-ci. systemd-Default
# OOMPolicy=stop beendete daraufhin die GANZE Unit, `svc.sh install` setzt kein
# Restart= — der Runner blieb 3 Tage tot, und der tägliche runner-health.yml blieb grün, die mcp-hub-CI stand (platform#3234, mcp-hub#301).

[Unit]
# Kein Startlimit: ein Runner, der nach 5 Fehlstarts aufgibt, ist derselbe stille Ausfall.
StartLimitIntervalSec=0

[Service]
# Ein OOM-Kill in einem Job-Prozess ist ein Job-Fehler, kein Runner-Ende.
OOMPolicy=continue
# Endet der Runner trotzdem (OOM des Listeners, Crash, Update-Fehler): nach 30 s wieder hoch.
# NICHT `always`: bei geloeschter Registrierung (GitHub raeumt >14 Tage offline ab) beendet
# sich der Listener sauber mit "no retry needed" — `always` machte daraus eine Endlosschleife
# (gemessen 2026-09-29, travel-beat-staging-ci). Solche Runner meldet runner-health.yml.
Restart=on-failure
RestartSec=30
