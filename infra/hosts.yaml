      ⚠ KORREKTUR 2026-08-04: Der Satz "die prod-Kopie wurde gestoppt (Doppellauf
      22.07.–02.08. beendet)" stand hier zu Unrecht. `docker stats` auf beiden
      Hosts zeigt illustration_web/_worker/_db/_redis WEITERHIN auf prod UND auf
      prod-b (268 bzw. 305 MiB). Der Doppellauf besteht fort — mit dem Risiko
