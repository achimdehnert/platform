  netcup:
    ip: 152.53.136.219
    arch: amd64                        # uname -m 2026-08-30: x86_64
    ssh: root@152.53.136.219
    hostname: v2202604344838448611     # DNS: v2202604344838448611.goodsrv.de
    provider: netcup (Nürnberg, DE)    # ERSTER Nicht-Hetzner-Host im Bestand
    os: Debian GNU/Linux 13 (trixie), Kernel 6.12.74
    server_type: 12 vCPU / 31 GiB RAM / 1007 GB Disk
    role: >
      ROLLE per ADR-292 (2026-08-02) right-sized: NUR R1 Off-Provider-Backup/DR-Ziel
      (rest-server läuft, append-only). Die weiteren ADR-289-Rollen R2 Monitoring,
      R3 CI-/Build-Runner, R4 DR-Standby sind VERTAGT — je neuer Owner-Beschluss.
      Ausdrücklich KEINE App-Hubs.
      ⛔ NEGATIV-REGEL (ADR-289 §4.6): hier läuft KEIN App-Hub-Stack. Wandernde Hubs
      gehen nach `prod-b` oder `staging-dedicated` (7 % bzw. 23 % RAM-Belegung) —
      der Bestand hat ein Verteilungs-, kein Kapazitätsproblem. Prüfbar per
      `docker ps` gegen ports.yaml über COMPOSE_PROJECT_NAME (ADR-248).
      Zustand nach Grundinstallation (2026-07-30, `netcup-bootstrap.sh`, ADR-289
      Phase 1): Swap 8 GB aktiv (vorher KEINER), Docker 29.6.2 + Compose 5.3.1
      (vorher nicht installiert), fio 3.39, sysctl nach ADR-098 §2
      (overcommit_memory=1, somaxconn=65535, swappiness=10). Noch 0 Container.
      Vor dem Eingriff: 113 Tage Uptime bei Load 0,00 und 1 GiB Monatstraffic —
      dasselbe Muster wie `lastwar-bot` vor dem prod-b-Rebuild: bezahlt, ungenutzt.
      ⚠ FIREWALL — zwei Ebenen, die wirksame liegt im Panel: netcup-Panel zeigt
      "Aktiv (0)" (eingeschaltet, aber KEINE Regel) und ist nur dort pflegbar, nicht
      per SSH. Eine Host-Firewall (ufw/nftables) wurde bewusst NICHT aktiviert —
      aus einer SSH-Sitzung heraus riskiert das die Selbst-Aussperrung, heilbar nur
      über die netcup-Konsole. Derzeit lauscht ausschließlich SSH auf 22 (80/443 zu),
      die Angriffsfläche ist minimal; Regeln werden mit Rolle R2 nötig.
      💡 WERT FÜR DIE PLATTFORM: einziger Host außerhalb der Hetzner-Fehlerdomäne
      und größte Disk im Bestand (1 TB = dreifach jeder andere). Damit der einzige
      sinnvolle Ort für (a) Off-Provider-Backup nach ADR-241 — dessen beschlossenes
      Ziel "Hetzner Storage Box BX11" liegt beim SELBEN Anbieter — und (b) einen
      Monitoring-Host außerhalb der überwachten Domäne (`prod` hat keines; siehe
      odoo-Eintrag oben). Standort Nürnberg/DE, anders als prod-b (Helsinki).
      ⚠ AVV MIT NETCUP FEHLT — Voraussetzung, bevor Backups mit Personenbezug
      (risk-hub MinIO = Kundendokumente) hier landen.
      ❗ KORREKTUR ZUR PANEL-ANGABE "Startlaufwerk HDD": widerlegt durch Messung
      2026-07-30. dd ergab 633 MB/s sequenziell schreibend (oflag=direct),
      653 MB/s lesend, fsync-Latenz 1,44 ms (1000x4k oflag=dsync). Eine
      7200-RPM-Platte schafft 150-200 MB/s. Referenz staging-dedicated (NVMe)
      im selben Test: 879 MB/s / 1,7 GB/s / 1,24 ms — netcup liegt bei 72 %
      schreibend, 88 % fsync, 38 % lesend. `lsblk ROTA=1` ist virtio-Default und
      trägt keine Aussage.
      ✅ NACHGEMESSEN 2026-07-30 (fio 3.39, direct=1 bs=4k iodepth=32, ADR-289 §4.1.1):
      randwrite 43,3k IOPS / 169 MiB/s, Latenz Ø 730 us, p99 5,5 ms; randread
      94,0k IOPS. Eine rotierende Platte macht 100-200 IOPS — Abstand Faktor 200-400.
      Speicherklasse damit endgültig geklärt: SSD/NVMe-gestützt. Die p99-Streuung
      (5,5 ms gegen Ø 730 us) ist die erwartete Varianz geteilten Speichers.
      NICHT belegt: Build-Wall-Clock. Die IOPS deckt die Speicher-Vorbedingung, nicht
      die Build-Eignung — dafür laeuft ADR-289 Phase 5b (gleicher Docker-Build auf
      netcup vs. staging). Ebenfalls offen: Verhalten über Wochen (noisy neighbour).
    hosts_runners: []
    auflage:
      datenklassen_verboten: [personenbezogen]
      app_hubs: false
      runner: false
      grund: "ADR-289 R1 + §4.6: nur Off-Provider-Backup; R3 Runner vertagt; personenbezogene Daten erst nach AVV (offen, platform#2486)"
    verified: 2026-07-30               # SSH-Probe + dd + fio; Grundinstallation gelaufen

# ─────────────────────────────────────────────────────────────────────────────
# GitHub-Actions Self-Hosted Runner
# ─────────────────────────────────────────────────────────────────────────────
# Label-Konvention: Deploy/host-gebundene Jobs → `prod-server` (unique Label, NICHT
# plain self-hosted, das matcht seit ADR-257 mehrere Runner). CI/Build → `ci-nonprod`
# (staging-ci-Runner). Die Labels `hetzner` und `dev` sind TOT (verwaister, offline
# dev-hetzner-2) — NICHT mehr verwenden.
runners:
  prod-server:
    host: prod                         # 88.198.191.108
    status: online                     # Stand 2026-06-17
    labels: [self-hosted, Linux, X64, prod, prod-server]
    scope: per-repo
    install: /opt/actions-runner-<repo>
    service: actions.runner.achimdehnert-<repo>.prod-server.service
    note: >
      Ein dedizierter Runner pro Repo (risk-hub, billing-hub, trading-hub,
      platform, … alle 23 Repos). Verarbeitet alles mit `runs-on: self-hosted`.
      Ein Runner pro Repo → Jobs eines PRs laufen sequenziell.
      ADR-257: für CI/Build deprecated (Migration läuft; Deploy bleibt hier, ADR-156).
    verified: 2026-06-17

  staging-ci:
    host: staging                      # 88.99.38.75
    status: online                     # 2026-06-28 registriert + verifiziert (gh api)
    labels: [self-hosted, Linux, X64, ci-nonprod]
    scope: per-repo
    install: /opt/actions-runner-<repo>
    service: actions.runner.achimdehnert-<repo>.<repo>-staging-ci.service
    runner_user: github-ci             # NICHT root (REC-5); in docker-group für buildx
    note: >
      Non-Prod-CI-Runner (ADR-257). Trägt CI/Build-Jobs, die per shared-ci-Input
      `runs_on: ci-nonprod` hierher gelenkt werden; host-gebundene Deploys bleiben
      via `deploy_runs_on: prod-server` auf dem Prod-Host. Pilot-Repo: travel-beat
      (`travel-beat-staging-ci`). Weitere Hubs gestaffelt via ADR-222-Familie.
    verified: 2026-06-28

  gpu-box:
    host: gpu-box                      # Host-Block oben; wg0 10.99.0.2, nur von prod erreichbar
    status: online                     # 2026-08-28 09:00 CEST registriert + online (gh api runners);
                                       # RTX 4090 24 GB, 8 vCPU/12 GB fuer WSL, api.github.com 200),
                                       # Bootstrap lief als root via `wsl -u root` ueber den prod-Hop
    labels: [self-hosted, Linux, X64, ci-gpu]
    scope: per-repo
    install: /opt/actions-runner-<repo>   # innerhalb der WSL2-Distro
    service: actions.runner.achimdehnert-<repo>.DESKTOP-G1MN89S.service   # Runner-Name = Hostname
    runner_user: github-ci             # REC-5, in docker-Gruppe (Postgres-Service-Container)
    bootstrap: infra/scripts/bootstrap_ci_runner_wsl.sh
    consumers: [writing-hub]           # KONZ-021-Opt-out, Grund: 70 % der hosted Minuten (platform#2392)
    note: >
      Owner-Desktop, nicht Teil der Hetzner-Flotte: laeuft nur, wenn die Box an ist.
      Windows-Seite muss die WSL offen halten (.wslconfig vmIdleTimeout=-1 + Aufgabenplanung
      "wsl -d Ubuntu -u root -- sleep infinity"). Deploy-Jobs bleiben auf prod-server;
      hier laufen nur `_ci-python`-Block und der writing-hub-Eigenjob `integration-tests`.
    verified: 2026-08-28               # Box-Fakten; Runner-Status offen
  dev-hetzner-2:
    host: UNKNOWN                       # auf keinem erreichbaren Host installiert
    status: deleted                     # 2026-06-17 dereg. (id=23 auf risk-hub gelöscht)
    labels: [self-hosted, Linux, X64, hetzner, dev]
    note: >
      War eine VERWAISTE Registrierung: in GitHub als Runner geführt, aber auf
      KEINEM erreichbaren Host (nicht prod, nicht staging/dev-desktop; nicht in
      ssh-config/known_hosts/infra-configs). >13h offline am 2026-06-17 → blockierte
      ALLE risk-hub-Merges (die toten Labels `hetzner`/`dev` zeigten nur auf ihn).
      Am 2026-06-17 dereg. (`gh api -X DELETE …/actions/runners/23` auf risk-hub;
      auf keinem anderen Repo registriert). Eintrag bleibt als Lehre/Historie.
    verified: 2026-06-17

# Workflows mit toten Labels — alle bereinigt (2026-06-17). Neue Workflows: runs-on: self-hosted.
dead_label_refs:
  - repo: risk-hub
    file: .github/workflows/complete-check.yml
    was: "[self-hosted, hetzner]"
    fixed_in: "PR #209 (→ self-hosted)"
  - repo: risk-hub
    file: .github/workflows/runner-diag.yml
    was: "[self-hosted, dev]"
    fixed_in: "PR #210 (Workflow entfernt — diente nur dev-hetzner-2)"
