# platform/infra/hosts.yaml
# ═══════════════════════════════════════════════════════════════════════════════
# Single Source of Truth für PHYSISCHE HOSTS + CI-RUNNER-TOPOLOGIE
#
# Warum diese Datei existiert:
#   Wiederkehrendes Problem (User-Kritik 2026-06-17): der Agent hat keine
#   Transparenz über die TATSÄCHLICHE Infrastruktur — welche Server existieren,
#   wo sie liegen, welche GitHub-Actions-Runner mit welchen Labels laufen. Das war
#   2026-06-15 die Outage-Wurzel (137-hub COMPOSE-Kollision auf Multi-Hub-Host) und
#   2026-06-17 der Merge-Blocker (toter `hetzner`-Runner-Pin in complete-check.yml).
#
# WICHTIG: Diese Datei MUSS den realen Server-Zustand abbilden.
#   Hosts prüfen:   python infra/scripts/server_probe.py --host <ip>
#   Runner prüfen:  gh api repos/<owner>/<repo>/actions/runners
#   Ports:          siehe infra/ports.yaml (eigene SoT)
#   Auflagen:       je Host als Block `auflage:` (maschinenlesbar, KONZ-054 E5) —
#                   Felder: datenklassen_verboten, prod_container, app_hubs, runner,
#                   oeffentlicher_ingress, nur_dienste, grund (Pflicht). Fehlt ein Feld,
#                   gilt "erlaubt". Prueft: infra/scripts/hosts_audit.py --check auflage
#   betrieb:        erwartet_an (Vorgabe, weglassen) | auf_zuruf — ein Knoten, der
#                   planmaessig nur auf Zuruf laeuft. flottenbild.py meldet ihn dann
#                   als 'schlaeft' statt 'unerreichbar'; ein erwartet_an-Knoten, der
#                   nicht antwortet, bleibt ein Befund (platform#2545).
#   Neuer Knoten:   docs/runbooks/neuer-knoten.md — Reihenfolge ist Absicht.
#   verified: false ist nur mit `verified_bis: <Datum>` gueltig (sonst Dauerausnahme).
#
# Ground-Truth-Stand: 2026-08-30 (Vollmessung KONZ-054, `verified` je Host).
#   MESSZAHLEN STEHEN HIER NICHT MEHR. Sie alterten schneller als jemand sie pflegte
#   (Swap prod stand vier Wochen lang mit 44 % hier, real 99 %). Live: Prometheus auf
#   dem odoo-Host (fleet-node/fleet-cadvisor), speicher_melder.py, server_probe.py.
#   Hier bleiben: Rolle, Auflage, Zugang, Historie (datierte Fakten, keine Werte).
# ═══════════════════════════════════════════════════════════════════════════════

