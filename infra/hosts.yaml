    verified: false                    # explizit unverifiziert — nichts gemessen, siehe KONZ-053 §8
    verified_bis: 2026-09-30           # Frist der Ausnahme (KONZ-054 E5) — danach messen oder mit Grund verlaengern

  staging-dedicated:
    ip: 178.104.184.168
    arch: amd64                        # uname -m 2026-08-30: x86_64
    ssh: root@178.104.184.168
    cloud_name: staging-platform       # id 127038422
