# platform/infra/hosts.yaml
# ═══════════════════════════════════════════════════════════════════════════════
# Single Source of Truth für PHYSISCHE HOSTS + CI-RUNNER-TOPOLOGIE
#
# Warum diese Datei existiert:
#   Wiederkehrendes Problem (User-Kritik 2026-06-17): der Agent hat keine
#   Transparenz über die TATSÄCHLICHE Infrastruktur — welche Server existieren,
#   wo sie liegen, welche GitHub-Actions-Runner mit welchen Labels laufen. Das war
#   2026-06-15 die Outage-Wurzel (137-hub COMPOSE-Kollision auf Multi-Hub-Host) und
#   2026-06-17 der Merge-Blocker (toter `hetzner`-Runner-Pin in complete-check.yml).
#
# WICHTIG: Diese Datei MUSS den realen Server-Zustand abbilden.
#   Hosts prüfen:   python infra/scripts/server_probe.py --host <ip>
#   Runner prüfen:  gh api repos/<owner>/<repo>/actions/runners
#   Ports:          siehe infra/ports.yaml (eigene SoT)
#   Auflagen:       je Host als Block `auflage:` (maschinenlesbar, KONZ-054 E5) —
#                   Felder: datenklassen_verboten, prod_container, app_hubs, runner,
#                   oeffentlicher_ingress, nur_dienste, grund (Pflicht). Fehlt ein Feld,
#                   gilt "erlaubt". Prueft: infra/scripts/hosts_audit.py --check auflage
#   Neuer Knoten:   docs/runbooks/neuer-knoten.md — Reihenfolge ist Absicht.
#   verified: false ist nur mit `verified_bis: <Datum>` gueltig (sonst Dauerausnahme).
#
# Ground-Truth-Stand: 2026-07-30 (verifiziert per SSH-Probe; siehe `verified` je Host).
#   Neu 2026-07-30: `netcup` (152.53.136.219) — erster Nicht-Hetzner-Host, noch ohne Rolle.
#   Korrigiert 2026-07-30: die Speicherlage hat den Host GEWECHSELT — `prod` ist entspannt,
#   `staging` (88.99.38.75) sitzt jetzt im Swap-Anschlag. Details in beiden Einträgen.
# ═══════════════════════════════════════════════════════════════════════════════

hosts:
  prod:
    ip: 88.198.191.108
    arch: amd64                        # uname -m 2026-08-30: x86_64
    ssh: root@88.198.191.108
    ssh_alias: hetzner-prod            # ~/.ssh/config
    hostname: ubuntu-8gb-nbg1-1        # ⚠ LEGACY-NAME, LÜGT: die Box wurde vergrößert.
    # Real (API + on-host, 2026-07-22): Hetzner Cloud `cpx52` = 12 vCPU / 24 GB / 480 GB,
    # AMD EPYC-Genoa, Rechenzentrum nbg1-dc3, Cloud-Name `iilgmbh-prod` (id 114710083).
    # Dazu Volume `iilgbmh-docker` (350 GB, id 105908261) gemountet als /var/lib/docker.
    cloud_name: iilgmbh-prod
    server_type: cpx52                 # 12 vCPU / 24 GB / 480 GB
    datacenter: nbg1-dc3
    os: Ubuntu 24.04.3 LTS
    provider: Hetzner (nbg1)
    role: >
      Produktions-Multi-Hub-Host. Trägt ALLE Prod-Container aller Hubs
      (risk-hub→schutztat.de, billing-hub, trading-hub, …) als getrennte
      docker-compose-Projekte auf EINER Engine. Multi-Hub-Host → COMPOSE_PROJECT_NAME
      pro Hub pinnen (ADR-248), sonst Cross-Projekt-Orphan-Removal.
      ✅ SPEICHERNOTLAGE ENTSPANNT (gemessen 2026-07-30): 46 laufende Container (von 48),
      RAM 10,7 von 23,5 GB (46 %), Swap 1,8 von 4,0 GB (44 %), Load 1,7 bei 12 Kernen,
      Uptime 24 Tage. Der Vorstand dieses Eintrags (2026-07-22) lautete "113 Container,
      Swap dauerhaft 100 %, 9 OOM-Kills" — Freeze #1314 + Auslagerung nach `prod-b`
      haben gewirkt. #1303 bleibt für die Leak-Analyse relevant, ist aber kein
      akuter Kapazitäts-Notstand mehr.
      Disk: `/` 93 von 150 GB (65 %), Docker liegt korrekt auf dem 350-GB-Volume
      (`findmnt`: /dev/sdb → /mnt/HC_Volume_105908261, ext4) mit 105 von 344 GB (32 %).
      `/opt/paperless-consume` ist nur ein Bind in ein Docker-Volume darauf, kein
      eigenes Gerät. NICHT VERIFIZIERT: was die 93 GB auf `/` belegt (Docker ist es
      nicht; `du` lief 2x in den Timeout) — 51 GB frei, kein Notstand.
      ⚠ Toter NFS-Mount: `/mnt/fritz-nas-scans` → "Host is down" (df/ls scheitern).
    hosts_runners: [prod-server]
    verified: 2026-07-30               # SSH-Probe on-host (RAM/Disk/Container/Mounts)

  prod-b:
    ip: 89.167.43.30
    arch: amd64                        # uname -m 2026-08-30: x86_64
    ssh: root@89.167.43.30
    cloud_name: iilgmbh-prod-b         # id 123575372, vormals `lastwar-bot`
    server_type: cpx42                 # 8 vCPU / 16 GB / 301 GB
    datacenter: hel1-dc2               # Finnland — siehe Standort-Auflage unten
    os: Ubuntu 24.04.4 LTS
