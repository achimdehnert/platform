    service: actions.runner.achimdehnert-<repo>.DESKTOP-G1MN89S.service   # Runner-Name = Hostname
    runner_user: github-ci             # REC-5, in docker-Gruppe (Postgres-Service-Container)
    bootstrap: infra/scripts/bootstrap_ci_runner_wsl.sh
    consumers: [writing-hub]           # KONZ-021-Opt-out, Grund: 70 % der hosted Minuten (platform#2392)
    note: >
      Owner-Desktop, nicht Teil der Hetzner-Flotte: laeuft nur, wenn die Box an ist.
      Windows-Seite muss die WSL offen halten (.wslconfig vmIdleTimeout=-1 + Aufgabenplanung
      "wsl -d Ubuntu -u root -- sleep infinity"). Deploy-Jobs bleiben auf prod-server;
      hier laufen nur `_ci-python`-Block und der writing-hub-Eigenjob `integration-tests`.
    verified: 2026-08-28               # Box-Fakten; Runner-Status offen
  netcup-ci:
    host: netcup                       # 152.53.136.219
    status: online                     # 2026-09-01 registriert (id 25), Dienst enabled+active.
                                       # Reihenfolge eingehalten: Deklaration (platform#2568)
                                       # vor der Registrierung. Am selben Tag war es einmal
                                       # umgekehrt und wurde zurueckgebaut (platform#2543).
    labels: [self-hosted, Linux, X64, ci-nonprod, netcup]
    scope: per-repo
    install: /opt/actions-runner-<repo>
    service: actions.runner.achimdehnert-<repo>.<repo>-netcup-ci.service
    runner_user: github-ci             # REC-5, nicht root
    rootless: true                     # ← die Bedingung der Auflage, maschinenlesbar
    docker_host: unix:///run/user/1000/docker.sock
    consumers: [writing-hub]
    note: >
      Traegt `ci-nonprod`, damit CI nicht an der GPU-Box haengt, die laut
      Owner-Entscheid 2026-08-31 nur noch auf Zuruf laeuft.
      ROOTLESS ist keine Empfehlung, sondern die Bedingung: github-ci hat einen
      eigenen Daemon unter /run/user/1000/docker.sock und ist NICHT in der Gruppe
      `docker`. Waere er es, haette jeder CI-Job root-aequivalenten Zugriff auf das
      einzige Off-Provider-Backup (platform#2486 Punkt 1).
      Am 2026-09-01 gemessen, dass rootless die Actions-`services:` traegt: eigenes
      Netz, Service-Container mit Netz-Alias und veroeffentlichtem Port, healthy nach
      15 s, erreichbar vom Host UND container-zu-container ueber den Alias;
      Negativkontrolle auf einem freien Port = connection refused.
      Drei Huerden, die auf jedem Debian-13-Laeufer stehen — alle drei am 2026-09-01
      selbst hineingelaufen:
      (1) `github-ci` braucht `loginctl enable-linger`, sonst stirbt der Nutzer-Daemon.
      (2) `actions/setup-python` findet fuer Debian 13 kein Python 3.12 ("was not found
      for Debian 13") — die Version muss im Tool-Cache unter
      `_work/_tool/Python/<ver>/x64` liegen, mit Marker `x64.complete`.
      (3) `runsvc.sh` liest die `.env` des Laeufers NICHT. `DOCKER_HOST` gehoert in ein
      systemd-Drop-in (`…service.d/rootless.conf`), sonst faellt der Laeufer auf
      /var/run/docker.sock zurueck und scheitert mit `permission denied`. Geprueft wird
      das an `/proc/<pid>/environ` des `Runner.Listener`, nicht am Dateiinhalt.
    verified: 2026-09-01               # writing-hub-Lauf 33485965050 vollstaendig gruen,
                                       # ALLE selbstgehosteten Jobs auf writing-hub-netcup-ci
                                       # (je Job am Log-Kopf "Runner name:" nachgesehen)

