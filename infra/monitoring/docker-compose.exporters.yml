# Exporter-Stack für prod + prod-b — Anmeldung am VORHANDENEN odoo-Prometheus
# (ADR-292: kein neuer Monitoring-Stack; 0-€-Schritt aus hosts.yaml/odoo-Eintrag).
# Rollout: siehe README.md — ERST Hetzner-Cloud-Firewall (9100/9338 nur für die
# odoo-Host-IP freigeben), DANN hier: docker compose -p mon -f <datei> up -d.
# Bewusst KISS: Ports lauschen offen, der Schutz ist die Cloud-Firewall-Allowlist.
services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mon_node_exporter
    restart: unless-stopped
    network_mode: host          # exportiert Host-Metriken auf :9100
    pid: host
    command:
      - "--path.rootfs=/host"
      # /mnt ausgeschlossen: toter NFS-Mount auf prod (/mnt/fritz-nas-scans) ließ
      # den Filesystem-Collector 10,5 s hängen -> Scrape-Timeout (gemessen 2026-08-02).
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/storage/.+|mnt)($|/)"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mon_cadvisor
    restart: unless-stopped
    ports:
      - "9338:8080"             # Container-Metriken
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    devices:
      - "/dev/kmsg"
