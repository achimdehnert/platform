# platform/infra/ports.yaml
# ═══════════════════════════════════════════════════════════════════════════════
# Single Source of Truth für alle Service-Ports (ADR-106, ADR-157, ADR-164)
#
# WICHTIG: Diese Datei MUSS den realen Server-Zustand abbilden!
#   Validierung: python infra/scripts/port_audit.py
#   Nur offline:  python infra/scripts/port_audit.py --offline
#   Nächster Port: python infra/scripts/port_audit.py --next-free
#
# ═══════════════════════════════════════════════════════════════════════════════
#
# PORT-STRATEGIE (ADR-164)
#
#   Prinzip: dev = staging = prod Port (gleicher Port, verschiedene Server)
#   Staging + Prod laufen auf getrennten Servern → identische Ports möglich.
#   Dev (lokal) bekommt denselben Port wo möglich; eigenen wo Compose kollidiert.
#
#   Ranges:
#     3000-3199   Infrastructure UIs (Grafana, Outline, Uptime-Kuma)
#     4000-4099   IB Gateway / Finance-Infra
#     5432-5499   PostgreSQL (interne DB-Ports, nur compose-intern)
#     6379-6399   Redis (interne Ports, nur compose-intern)
#     8000-8019   Reserviert: BF Agent (8000 dev only), Infra-APIs
#     8020-8069   Standalone Tools (pptx-hub 8020, odoo 8069)
#     8080-8109   App-Hubs Block A (Hauptprodukte)
#     8110-8199   App-Hubs Block B (Erweiterung)
#     9000-9099   Auth + Object Storage (Authentik 9000, MinIO 9001/9010)
#
#
#   LEBENSZYKLUS (betriebsstatus, seit 2026-08-23 — platform#2215)
#
#     betriebsstatus: aktiv         Vorgabe, muss nicht geschrieben werden
#     betriebsstatus: stillgelegt   absichtlich aus
#     betriebsstatus: blockiert     soll laufen, wartet auf eine Entscheidung
#
#   Alles ausser `aktiv` verlangt ein `betriebsstatus_grund`. `tools/erreichbarkeit_melder.py`
#   fragt die `domain_prod` jedes AKTIVEN Dienstes einmal an; ein nicht-aktiver Dienst
#   erzeugt keinen Befund, ein nicht-aktiver OHNE Grund dagegen schon — eine stumme
#   Ausnahme ist so wenig wert wie gar keine Pruefung.
#
#   Regeln:
#     1. Jeder Hub hat genau EINEN Web-Port pro Umgebung (kein Bereich!)
#     2. Staging-Port = Prod-Port (immer, ADR-157 §4)
#     3. Dev-Port = Prod-Port (default), weicht nur ab wenn Docker-Compose
#        eine andere Zuordnung erzwingt (z.B. historisch 8000:8000)
#     4. Neue Hubs: nächsten freien Port via port_audit.py --next-free
#     5. Interne Ports (DB, Redis, Celery) werden NICHT hier verwaltet —
#        nur host-gemappte Web-Ports
#     6. Compose-Files MÜSSEN diesen Port verwenden (drift = deploy-blocker)
#
# REGEL: Staging-Domains unter iil.pet sind per DEFAULT single-level!
#   OK: staging-writing.iil.pet   (1 Level = CF Universal SSL deckt ab)
#   NICHT ohne Weiteres: staging.writing.iil.pet   (2 Level = Universal SSL deckt NICHT ab)
#   Eigene Domains (LE Wildcard) duerfen staging.X.Y bleiben.
#
#   AUSNAHME (praezisiert 2026-07-22): Mehrstufig IST zulaessig, wenn fuer den
#   Wildcard ein AKTIVES Cloudflare Certificate Pack existiert — dann faellt der
#   einzige Grund der Regel (Universal SSL deckt nur ein Level) weg.
#   Live-Beispiel: *.staging.risk-hub.iil.pet — Certificate Pack type=total_tls
#   status=active, DNS-Wildcard auf den Staging-Tunnel (iilgmbh/risk-hub#443).
#   Belegt ist damit die TLS-Terminierung am Edge fuer beliebige Slugs — der
#   Aufruf von staging-demo.staging.risk-hub.iil.pet liefert 302 auf
#   iil-team.cloudflareaccess.com, also eine gueltige TLS-Verbindung.
#   NICHT belegt ist damit die Erreichbarkeit der App: vor den Staging-Hosts
#   steht Cloudflare Access. Ein 302 auf cloudflareaccess.com heisst "Edge ok,
#   Login noetig" — nicht "Anwendung antwortet". Wer App-Verhalten pruefen will,
#   braucht eine Access-authentifizierte Session oder ein Service Token.
#
#   Pruefen, BEVOR man die Regel fuer verletzt haelt (beides noetig):
#     curl -s -H "Authorization: Bearer $(tr -d '\n' < ~/.secrets/cloudflare_write_token)" \
#       "https://api.cloudflare.com/client/v4/zones/<zone>/ssl/certificate_packs" | grep -o '<host>'
#     curl -o /dev/null -w '%{http_code}\n' https://<slug>.<mehrstufiger-host>/
#   Achtung Messfehler: den WILDCARD testen, nicht den nackten Basis-Host. Der
#   Basis-Host hat oft bewusst keinen DNS-Record (er dient nur der Slug-Aufloesung)
#   und liefert NXDOMAIN — daraus folgt NICHT, dass der Zweig fehlt.
#
# Nächster freier Port: 8113  (berechnet: port_audit.py --next-free)
# Vergabe: aufsteigend, VOR Deploy port_audit.py laufen lassen!
# ═══════════════════════════════════════════════════════════════════════════════

# --- Server-Definitionen (ADR-157 §4.2) ---
# servers: ist eine PROJEKTION von infra/hosts.yaml, keine zweite Wahrheit.
# Jede Umgebung zeigt per `host:` auf einen Knoten dort; ip/ssh muessen mit dem
# Knoten uebereinstimmen — tools/tests/test_ports_servers_projection.py bricht,
# wenn sie auseinanderlaufen (KONZ-054 §12 S1, 2026-08-30). Vorher deckte dieser
# Block 3 von 8 Knoten, und `staging` meinte hier eine ANDERE Maschine als in
# hosts.yaml (dort hiess der Dev-Desktop `staging`) — jetzt heisst er dev-desktop.
servers:
  prod:
    host: prod                         # -> hosts.yaml
    ip: 88.198.191.108
    name: Hetzner Dedicated (Production)
    ssh: root@88.198.191.108
  dev:
    host: dev-desktop                  # -> hosts.yaml (frueher dort `staging`)
    ip: 88.99.38.75
    name: Dev Desktop (Development)
    ssh: root@88.99.38.75
  staging:
    host: staging-dedicated            # -> hosts.yaml (Lane G, ADR-292)
    ip: 178.104.184.168
    name: Hetzner Staging (Dedicated)
    ssh: root@178.104.184.168

# --- Infrastructure Services (nicht App-Hubs) ---
infra:

  kd-static:
    port: null                       # rein statisch (Nginx root /var/www/kd)
    server: prod
    domain_prod: kd.iil.pet
    note: "Klickdummy-Host (NUR Mock-Daten-KDs!) — CF-Tunnel-DNS + Nginx-vhost kd.iil.pet.conf, eingerichtet 2026-07-02; Publish: dev-desktop ~/kd-serve/kd-publish.sh"

  authentik:
    port: 9000
    server: prod
    domain_prod: id.iil.pet
    note: "SSO/Identity Provider — 9443 for HTTPS"

  outline:
    port: 3100
    server: prod
    domain_prod: knowledge.iil.pet
    note: "Wiki/Knowledge Base — maps 3100→3000 internal"

  grafana:
    prod_host: odoo            # Monitoring-Stack liegt auf dem odoo-Host, nicht auf prod (bis 2026-08-30 hier falsch deklariert)
    port: 3000
    server: prod
    domain_prod: grafana.iil.pet

  uptime-kuma:
    port: 3001
    server: staging
    domain_staging: uptime.iil.pet

  minio:
    port: 9010
    server: prod
    note: "Object Storage for risk-hub — API 9010, Console 9001"

  llm-mcp:
    port: 8001
    server: prod
    note: "LLM Gateway — internal only"

# ═══════════════════════════════════════════════════════════════════════════════
# App-Hub Ports — sortiert nach Port
#
# Felder:
#   prod:            Host-Port auf Production-Server (127.0.0.1:PORT→8000)
#   staging:         Host-Port auf Staging-Server (= prod)
#   dev:             Host-Port auf Dev Desktop / localhost
#   container_name:  Docker container name (für health checks)
#   domain_prod:     Primary production domain
#   domain_staging:  Staging domain
#   domain_aliases:  Additional production domains (redirects)
#   repo:            GitHub repo (achimdehnert/*)
#   prod_host:       Ziel-Host des Prod-Deployments laut infra/hosts.yaml
#                    (Default: prod — nur Abweichungen eintragen; SSoT per ADR-292,
#                    Deploy-Workflows lesen dieses Feld, Handverteilung = Regelverstoß)
#   compose_drift:   Statische Freitext-Anmerkung (unverifiziert). infra_overview.py
#                    MISST Compose-Drift seit #1685 selbst gegen die lokalen Klone
#                    (~/github/<repo>/docker-compose[.prod].yml) und führt diese
#                    Anmerkungen nur noch als "unverifizierte Annotation" mit —
#                    sie beeinflussen den Exit-Code nicht mehr.
# ═══════════════════════════════════════════════════════════════════════════════
services:

  frist-hub:
    prod: 8111
    staging: 8111
    dev: 8111
    container_name: frist_hub_web
    domain_prod: frist-hub.iil.pet
