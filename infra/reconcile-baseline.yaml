# Baseline für tools/reconcile_registry_live.py (KONZ-platform-015 Nachtrag 2026-07-10).
#
# Bekannte, TRIAGIERTE Abweichungen Registry↔Live. Jeder Eintrag braucht
# owner + expires_at (E2-Waiver-Muster, ADR-264-D1-Vorbild: ohne Ablaufdatum
# → Tool-Fehler; abgelaufen → Tool-Fehler, fail-closed).
#
# Ein Eintrag hier ist KEINE Lösung — er ist eine datierte Stundung.
# Bei Ablauf: Drift beheben oder bewusst (mit neuem Grund) verlängern.
#
# ⚠️ ALLE FÜNF EINTRÄGE LAUFEN AM SELBEN TAG AB (2026-11-08).
# Das ist am 2026-08-08 schon einmal passiert: alle fünf Waiver fielen
# gleichzeitig, `registry-live-reconcile` brach beim ERSTEN ab (fail-closed)
# und war zwei Tage rot, ohne dass die anderen vier je gemeldet wurden
# (#1857). Wer den nächsten Ablauf bearbeitet, sollte die Daten staffeln,
# statt sie wieder gleichzuschalten — ein gemeinsamer Stichtag macht aus
# fünf einzelnen Entscheidungen einen einzigen Klippen-Termin.

