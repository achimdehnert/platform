# ============================================================================
# Platform Secrets Inventory (ADR-045, Issue #18 FIX-F)
# ============================================================================
#
# This file documents ALL secrets used across the IIL Platform ecosystem.
# It does NOT contain secret values — only metadata about where secrets
# are defined and consumed.
#
# Scope: GitHub Actions secrets (repo-level), server-side env files,
#         SOPS-encrypted files.
#
# Last audited: 2026-04-03
# Resolver: infra/lib/secrets.py (Single Source of Truth für Auflösung)
# ============================================================================

# ---------------------------------------------------------------------------
# 1. Shared Secrets (used by multiple repos)
# ---------------------------------------------------------------------------
shared:
  DEPLOY_SSH_KEY:
    description: "Private SSH key for deploy@prod-server (88.198.191.108)"
    type: ssh_key
    rotation: quarterly
    consumers:
      - platform
      - travel-beat
      - risk-hub
      - mcp-hub
      - bfagent

  DEPLOY_HOST:
    description: "Production server IP/hostname"
    type: hostname
    value_hint: "88.198.191.108"
    consumers:
      - platform
      - travel-beat
      - risk-hub
      - mcp-hub
      - bfagent

  DEPLOY_USER:
    description: "SSH user for production deployments"
    type: username
    value_hint: "deploy"
    consumers:
      - platform
      - travel-beat
      - risk-hub
      - mcp-hub
      - bfagent

  PROJECT_PAT:
    description: "GitHub PAT for cross-repo operations (dispatch, PR, packages)"
    type: github_token
    rotation: yearly
    consumers:
      - platform
      - travel-beat
      - risk-hub
      - weltenhub
      - pptx-hub
      - mcp-hub
      - bfagent

  HETZNER_HOST:
    description: "Hetzner production server"
    type: hostname
    value_hint: "88.198.191.108"
    consumers:
      - platform
      - travel-beat
      - pptx-hub

  HETZNER_SSH_KEY:
    description: "SSH key for Hetzner server access"
    type: ssh_key
    rotation: quarterly
    consumers:
      - platform
      - travel-beat
      - pptx-hub

  HETZNER_USER:
    description: "SSH user for Hetzner"
    type: username
    value_hint: "deploy"
    consumers:
      - platform
      - travel-beat
      - pptx-hub

  HETZNER_DEV_HOST:
    description: "Hetzner dev-server for staging"
    type: hostname
    consumers:
      - travel-beat
      - risk-hub
      - weltenhub

  HETZNER_DEV_SSH_KEY:
    description: "SSH key for dev-server access"
    type: ssh_key
    rotation: quarterly
    consumers:
      - travel-beat
      - risk-hub
      - weltenhub

  HETZNER_DEV_USER:
    description: "SSH user for dev-server"
    type: username
    value_hint: "deploy"
    consumers:
      - travel-beat
      - risk-hub
      - weltenhub

  DISCORD_WEBHOOK:
    description: "Discord webhook for deployment notifications"
    type: webhook_url
    consumers:
      - platform
      - mcp-hub

  SOPS_AGE_KEY:
    description: "age private key for SOPS decryption in CI"
    type: encryption_key
    rotation: yearly
    consumers:
      - platform
      - bfagent

# ---------------------------------------------------------------------------
# 2. Platform-only Secrets
# ---------------------------------------------------------------------------
