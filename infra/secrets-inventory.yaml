# ---------------------------------------------------------------------------
# 6. Server-side Secrets (on 88.198.191.108)
# ---------------------------------------------------------------------------
server_side:
  location: "/opt/<repo>/.env.prod"
  note: "Each app has its own .env.prod on the production server"
  managed_by: "Manual (ssh_manage file_write) — NO automated rotation yet"
  apps:
    - bfagent
    - travel-beat
    - risk-hub
    - weltenhub
    - pptx-hub
    - mcp-hub
    - billing-hub
    - coach-hub
    - dev-hub

# ---------------------------------------------------------------------------
# 7. Local Developer Secrets (NOT in CI)
# ---------------------------------------------------------------------------
# WICHTIG: Die kanonischen Mappings sind in infra/lib/secrets.py::REGISTRY
# definiert. Diese Sektion dokumentiert nur die Dateien.
local:
  # 2026-07-29 korrigiert: hier stand "/home/dehnert/.secrets/" — ein Pfad, den
  # es nicht gibt. Der Resolver selbst nutzt Path.home() und war nie betroffen;
  # nur die Doku zeigte ins Leere.
  location: "/home/devuser/.secrets/"
  resolver: "infra/lib/secrets.py"
  files:
    cloudflare_api_token:
      env: CLOUDFLARE_API_TOKEN
      mcp_env: DEPLOYMENT_MCP_CLOUDFLARE_API_TOKEN
      usage: "Cloudflare DNS/Zone API (alle infra-scripts)"
      note: "Identisch mit cloudflare_write_token (konsolidiert 2026-04-03)"

    cloudflare_access_token:
      env: CLOUDFLARE_ACCESS_TOKEN
      mcp_env: DEPLOYMENT_MCP_CLOUDFLARE_ACCESS_TOKEN
      usage: "Cloudflare Zero Trust Access"

    hetzner_cloud_token:
      env: HETZNER_CLOUD_TOKEN
      mcp_env: DEPLOYMENT_MCP_HETZNER_CLOUD_TOKEN
      usage: "Hetzner Cloud API"

    github_token:
      env: GITHUB_TOKEN
      mcp_env: GITHUB_PERSONAL_ACCESS_TOKEN
      usage: "GitHub API"

    ionos_api_key:
      env: IONOS_API_KEY
      mcp_env: DEPLOYMENT_MCP_IONOS_API_KEY
      usage: "IONOS DNS API"

    openai_api_key:
      env: OPENAI_API_KEY
      usage: "OpenAI API"

    anthropic_api_key:
      env: ANTHROPIC_API_KEY
      usage: "Anthropic API"

    groq_api_key:
      env: GROQ_API_KEY
      usage: "Groq API"

    together_api_key:
      env: TOGETHER_API_KEY
      usage: "Together AI API"

    pypi_iildehnert_token:
      env: PYPI_TOKEN
      usage: "PyPI package upload"

    dvelop_api_key:
      env: DVELOP_API_KEY
      usage: "d.velop DMS API"

    orchestrator_mcp_db_password:
      env: n/a
      usage: "pgvector Memory DB (in MCP config)"

    # --- 2026-07-29 nachgetragen -------------------------------------------
    # Diese fünf lagen ausschliesslich im verschachtelten ~/.secrets/.secrets/
    # und waren in Inventar wie REGISTRY unbekannt. Ein nicht inventarisiertes
    # Secret ist unsichtbar, bis jemand es braucht — bei `fritz-nas` war es
    # bereits so weit (Konsument sucht oben, Datei lag unten).
    fritz-nas:
      env: n/a
      usage: "FritzBox-NAS Zugangsdaten (SMB-Mount)"
      consumers:
        - tax-hub  # scripts/sync-scans-to-paperless.py:26 liest ~/.secrets/fritz-nas

    forwardemail_api_token:
      env: FORWARDEMAIL_API_TOKEN
      usage: "ForwardEmail API (Mail-Routing)"
      consumers:
        - iil-relaunch  # README

    hetzner_dev_ci_key:
      env: n/a
      type: ssh_key
      usage: "SSH-Key fuer Dev-CI auf Hetzner"

    cf_access_client_id:
      env: CF_ACCESS_CLIENT_ID
      usage: "Cloudflare Access Service Token (ID)"
      note: >-
        Oben liegen zusaetzlich cf_svc_client_id/cf_svc_client_secret.
        Ob das dieselben Zugangsdaten unter neuem Namen sind, ist NICHT
        geprueft — vor einer Konsolidierung vergleichen.

    cf_access_client_secret:
      env: CF_ACCESS_CLIENT_SECRET
      usage: "Cloudflare Access Service Token (Secret)"
      note: "siehe cf_access_client_id"

  deprecated_files:
    cloudflare_write_token: "Konsolidiert → cloudflare_api_token (2026-04-03)"
    load_secrets.py: "Ersetzt durch infra/lib/secrets.py"
    env_loader.py: "Ersetzt durch infra/lib/secrets.py"
    deploy_env_loader.sh: "Ersetzt durch infra/lib/secrets.py (2026-07-29 nachgetragen)"

  # Die Abloesung oben wurde am 2026-04-03 entschieden und nie ausgefuehrt: die
  # drei ersetzten Loader liegen weiterhin in einem verschachtelten
  # ~/.secrets/.secrets/. Dort stehen zusaetzlich VERALTETE Kopien von fuenf
  # rotierten Secrets (cloudflare_api_token, cloudflare_write_token,
  # github_token, orchestrator_mcp_db_password, together_api_key) — in allen
  # fuenf Faellen ist die obere Datei die neuere. Wer unten liest, bekommt
  # abgelaufene Zugangsdaten.
  cleanup_pending:
    path: "~/.secrets/.secrets/"
    entdeckt: "2026-07-29"
    schritte:
      - "6 Unikate nach oben ziehen (fritz-nas, forwardemail_api_token, hetzner_dev_ci_key, cf_access_client_id, cf_access_client_secret, pypi_iildehnert_token)"
      - "5 veraltete Kopien verwerfen"
      - "3 abgeloeste Loader verwerfen"
      - "Verzeichnis entfernen"

# ---------------------------------------------------------------------------
# 8. SOPS Configuration (Phase 2)
# ---------------------------------------------------------------------------
sops:
  status: "planned"
  encryption: "age"
  key_location: "/etc/secrets/staging.key (on dev-server, chmod 600)"
  ci_secret: "SOPS_AGE_KEY"
  pattern: ".env.*.enc → decrypted to .env.* in CI/CD"
  repos_with_sops:
    - platform
    - bfagent
  repos_planned: []

# ---------------------------------------------------------------------------
# 8. Wiederanlauf-Schluessel (KONZ-platform-054 §12, 2026-08-30)
# ---------------------------------------------------------------------------
# Gemessen: der restic-Schluessel und das Tunnel-Credential lagen NUR auf dem
# Host, den sie wiederherstellen sollen. Verlust von prod = Verlust des Zugangs
# zum Backup von prod. Diese Sektion fuehrt die Zeiger; das Escrow selbst ist
# ein Owner-Schritt (Security-Config) und wird hier mit Datum eingetragen.
wiederanlauf:
  # Escrow-Stand 2026-09-02 (platform#2504, Owner-Freigabe "28 go"): beide Schluessel
  # liegen jetzt zusaetzlich auf der Dev-Maschine, Rechte 0600, byte-gleich zur Quelle
  # (sha256 verglichen). EINSCHRAENKUNG, bewusst benannt: dev-desktop ist ein
  # Hetzner-Host (fsn1) wie prod (nbg1) — anderes Rechenzentrum, aber DERSELBE
  # Anbieter. Das Offsite-Repo liegt genau deshalb auf netcup. Ein Verlust der
  # Hetzner-Fehlerdomaene traefe damit weiterhin beide Kopien des Schluessels; eine
  # zweite Kopie ausserhalb ist entschieden: PASSWORTSPEICHER des Owners
  # (Entscheid 2026-09-02). Der Eintrag ist Owner-Arbeit — ein Agent hat keinen
  # Zugang zu diesem Speicher und darf ihn nicht haben. Bis `zweitkopie_date`
  # gesetzt ist, gilt die Luecke als offen.
  #
  # WICHTIG beim Uebertragen: die Dateien lokal oeffnen, NICHT in einer
  # Agenten-Sitzung ausgeben — ein `cat` dort schreibt den Wert ins Transkript.
  #
  # KORREKTUR 2026-09-02 (derselbe Tag, kurz nach dem ersten Escrow): der erste
  # Lauf sicherte nur die Env-Datei — und die enthaelt das Passwort GAR NICHT,
  # sondern `RESTIC_PASSWORD_FILE=/etc/restic-repo.pass`, also einen Verweis.
  # Ein Wiederanlauf allein damit waere gescheitert, und zwar erst im Ernstfall.
  # Der Zeiger wurde bis zum Ende verfolgt; jetzt sind alle DREI Dateien der Kette
  # gesichert (Env, Passwortdatei, CA-Zertifikat des rest-servers).
  #
  # NICHT GEPRUEFT und deshalb hier benannt: dass sich das Archiv MIT DEN KOPIEN
  # allein oeffnen laesst. Belegt ist nur, dass jede Kopie byte-gleich zu einer
  # nachweislich taeglich benutzten Quelle ist und dass die Verweiskette
  # vollstaendig ist. Der echte Beweis braucht restic auf einer Maschine, die
  # nicht prod ist — dort ist es nicht installiert.
  RESTIC_PASSWORD:
    description: "Schluessel des Offsite-Repos (rest-server auf netcup, ADR-289 R1)"
    location: "prod:/etc/restic-repo.pass — die Datei, auf die prod:/etc/offsite-backup.env per RESTIC_PASSWORD_FILE zeigt. Die Env-Datei selbst enthaelt den Wert NICHT."
    consumers: ["/usr/local/bin/prod-offsite-daily.sh", "backup-meter.yml (Runner prod)"]
    kette: "Wiederanlauf braucht alle drei: die Env-Datei (Repo-Adresse), die Passwortdatei und das CA-Zertifikat des rest-servers. Eine allein nuetzt nichts."
    escrow: "dev-desktop, alle drei mit 0600 und sha256 == Quelle: ~/.secrets/offsite-backup.env, ~/.secrets/restic-repo.pass, ~/.secrets/restic-netcup-ca.pem"
    escrow_date: 2026-09-02
    escrow_luecke: "gleiche Anbieter-Fehlerdomaene wie prod (beides Hetzner)"
    zweitkopie_medium: "Passwortspeicher des Owners (Entscheid 2026-09-02, platform#2504)"
    zweitkopie_date: null            # offen — Nachweis und Frist im Issue #2504
  CLOUDFLARED_TUNNEL_CREDENTIAL:
    description: "Tunnel-Credential des prod-Tunnels f758021c-… (alle Ingress-Routen von prod)"
    location: "prod:/root/.cloudflared/f758021c-a475-4ab7-9c02-1c14599a38e2.json"
    consumers: ["cloudflared auf prod"]
    escrow: "dev-desktop:~/.secrets/cloudflared_prod_tunnel_f758021c.json (0600, sha256 == Quelle). Der restic-Tag `config` bleibt ein Backup, kein Escrow — er haengt am selben Schluessel."
    escrow_date: 2026-09-02
    escrow_luecke: "gleiche Anbieter-Fehlerdomaene wie prod (beides Hetzner)"
    zweitkopie_medium: "Passwortspeicher des Owners (Entscheid 2026-09-02, platform#2504)"
    zweitkopie_date: null            # offen — Nachweis und Frist im Issue #2504
  CLOUDFLARED_TUNNEL_CREDENTIAL_GPU:
    description: "Tunnel-Credential des gpu-Tunnels 4343a915-… (nur gpu.iil.pet, GPU-Box hinter Access)"
    location: "prod:/root/.cloudflared/gpu.json"
    consumers: ["cloudflared-gpu.service auf prod"]
    escrow: "dev-desktop:~/.cloudflared/gpu.json (0600) — dort angelegt und von dort nach prod kopiert, also von Anfang an doppelt vorhanden."
    escrow_date: 2026-09-02
    escrow_luecke: "gleiche Anbieter-Fehlerdomaene; ein Verlust ist hier billig — der Tunnel laesst sich neu anlegen, das Geheimnis ist nicht wiederherstellbar aber auch nicht wertvoll"
