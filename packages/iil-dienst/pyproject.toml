[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iil-dienst"
version = "0.1.0"
description = "Ein Dienst, zwei Zugaenge: Vertrag am Service-Layer, Export und Aufruf als Management-Command (KONZ-platform-058)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8"]

[tool.setuptools]
packages = ["iil_dienst", "iil_dienst.management", "iil_dienst.management.commands"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
