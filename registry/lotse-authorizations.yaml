# Authorization-Registry des Lotsen (KONZ-025 Art. 2.6)
#
# Entsteht mit der ersten Vollmacht (Erteilung: Kapitäns-Session 2026-08-06).
# Regeln: Keine Vollmacht ohne Registry-Eintrag; abgelaufene werden nicht still
# verlängert; Widerruf jederzeit formlos (Art. 2.3); „Lotse stopp" suspendiert
# betroffene Einträge sofort (Art. 14.1).
#
# ⚠️ platform ist PUBLIC: Diese Datei enthält KEINE Personen- oder Mandanten-
# namen. Allowlists stehen als Zeiger auf lokale Dateien der Kapitäns-Maschine.
#
# Reifegrade (Art. 2.7): A analysieren/empfehlen · B Entwurf/Dry-Run · C Shadow
# · D Ausführung nach Einzelfreigabe · E reversibel + Sofortmeldung · F begrenzte
# Autonomie in engen Caps. Beförderung nur eine Stufe, nie unter Übersprung von D.

meta:
  established: "2026-08-06"
  granted_by: "Kapitän, interaktive Session (Kommandokanal Art. 13.2)"
  ratified_by: "Merge des einführenden PR durch den Kapitän"
  zaehlgroesse: >
    Für Art.-10-Eskalationskriterium 1 und den Sechs-Artefakt-Trigger
    (KONZ-025 „Struktur & Zielbild") zählen nur Einträge mit status: active.
    Stand 2026-08-06 (inkl. LV-009): 5 active, 3 proposed, 1 dokumentierter
    Nicht-Vollmacht-Marker (LV-004). Die 5er-Grenze ist damit ERREICHT —
    jede weitere Aktivierung überschreitet sie und löst zuerst den
    Sechs-Artefakt-Ausbau aus, bevor aktiviert werden darf.

    Stand 2026-09-03 nach dem Modellwechsel MAJOR (bewertet claude-fable-5,
    gelaufen claude-opus-5): der Kapitän hat alle fünf Einträge ERNEUT ERTEILT
    statt sie durch die 14-Tage-Requalifikation zu schicken (Wortlaut: „ich
    möchte nicht nehmen sondern erneut geben / belassen"). Sie tragen jetzt
    assessed_with: claude-opus-5 und reassessed_at: 2026-09-03. Die Stichproben
    werden NACHGEZOGEN, nicht vorgeschaltet.
    Damit sind weiterhin 5 Einträge active — die 5er-Grenze ist wieder ERREICHT.
    Konsequenz für LV-010 (Design, proposed): eine Aktivierung wäre die sechste
    und löst zuerst den Sechs-Artefakt-Ausbau aus (Art. 10 Kriterium 1).

