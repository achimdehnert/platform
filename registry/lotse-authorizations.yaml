      # praes.iil.ai ist ein VEROEFFENTLICHTER Endpunkt (Cloudflare Tunnel), also genau die
      # Aussenwirkung, die der erste Punkt ausschliesst. Der Kapitaen hat die URL im Auftrag
      # genannt; ob damit auch das Publizieren gemeint war, ist NICHT entschieden — und eine
      # selbstbetreffende Vollmacht darf ich nicht zu meinen Gunsten auslegen (Art. 3).
      # Zusaetzlich: praes-iil-ai steht in platform infra/ports.yaml auf
      # betriebsstatus: blockiert (laeuft gegen auflage.prod_container=false, platform#2507).
      # Ein Publikationsrecht auf einen Dienst, den die Registry selbst als regelwidrig
      # betrieben fuehrt, waere doppelt fragwuerdig.
      "Deploy/Veroeffentlichung nach praes.iil.ai oder auf einen anderen erreichbaren Endpunkt (bleibt D, eigene Freigabe je Vorgang)", "erfundene persönliche Erfahrungen oder Unterschrift des Kapitäns (Art. 7)", "Zitate/Quellen ohne Beleg (Evidenz-Policy — Unbelegtes als Hypothese markieren)"]
    mode: E
