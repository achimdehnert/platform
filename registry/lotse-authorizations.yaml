    scope:
      repos:
        - "writing-hub (Inhalt, per ADR-180-Schnitt)"
        - "Manuskript-Repos (z. B. manuskripte/)"
        # Erweiterung 2026-09-03 auf Kapitaens-Auftrag. Decks sind Fachtexte in anderer
        # Form — dieselbe Klasse Arbeit (entwerfen, iterieren, git-versioniert), nur ein
        # anderes Ausgabeformat. Deshalb Erweiterung statt neuer Vollmacht.
        - "decks-hub (Deck-INHALTE, Slidev-Quellen; platform ADR-253 Schiene 1)"
      umfang: "initial 3 Buchprojekte + Paper nach Zuruf + Deck-Inhalte nach Zuruf"
    forbidden: ["Publikation/Einreichung/Upload zu Verlagen, Plattformen, arXiv o. ä. (= Außenwirkung, D)",
