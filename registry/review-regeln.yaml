# review-regeln.yaml — einzige Quelle aller Review-Regeln (KONZ-platform-070 Z1, #3903 WP1).
#
# Alles andere wird hieraus generiert oder zur Laufzeit geladen; kein Regel-Literal
# darf ausserhalb dieser Datei stehen (Kriterium K1). Werkzeug: tools/review_regeln.py
#   --check          Drift der generierten Dateien gegen diesen Stand (Exit 1 bei Drift)
#   --render         .windsurf/rules/reviewer.md neu schreiben
#   --tabu [--profil X]  Tabu-Pfade des Bot-Reviews ausgeben
#
# Schema je Regel (Pflicht): id, klasse, geltung, detektor, begruendung, konsumenten,
# seit, praezision, status. Optional: titel, ausgabe (Kategorie/Referenz/Meldung/Konfidenz
# fuer den Context-Reviewer).
#
# Detektor-Typen:
#   pfad    muster = Globs (fnmatch, `*` ueberspannt auch `/`) gegen den Dateipfad
#   regex   muster = Liste von Regex-Alternativen (IGNORECASE), ziel = inhalt | inhalt+pfad | hinzugefuegt
#   umfang  max_zeilen = Schwelle fuer die Summe geaenderter Zeilen des PR
#   llm     frage = Pruefauftrag an einen LLM-Reviewer (nicht mechanisch pruefbar)
#
# Profile (geltung.profile): default = jedes Repo; deployed = Repo mit Prod-Deploy
# (shared-ci _bot-review.yml, platform#3244); library = PyPI-Paket ohne Deploy.
#
# praezision bleibt null, bis das Befund-Ledger (Z3, WP3/WP6) sie misst.

version: 1
beschreibung: >-
  Review-Regeln der Plattform als Daten. Quellen vor der Migration (2026-10-13):
  TABU-Tupel in tools/bot_review_kandidaten.py, TABU_MUSTER/TABU_PRAEFIX_GLOB in
  shared-ci tools/bot_review_kandidaten.py, ADR_KEYWORDS/PRINCIPLE_KEYWORDS/PROJECT_PATHS
  und Insight-Regexe in agents/context_reviewer.py, Prinzipien und verbotene Muster in
  .windsurf/rules/reviewer.md.

generiert:
  - pfad: .windsurf/rules/reviewer.md
    art: gerendert
    befehl: python3 tools/review_regeln.py --render
  - pfad: tools/bot_review_kandidaten.py
    art: geladen
    symbol: TABU
  - pfad: agents/context_reviewer.py
    art: geladen
    symbol: ADR_KEYWORDS, PRINCIPLE_KEYWORDS, PROJECT_PATHS, INSIGHT_REGELN

# Nicht-Regel-Prosa, die reviewer.md neben den Regeln braucht.
reviewer_md:
  frontmatter:
    trigger: manual
  titel: Reviewer — IIL Platform Code Review
  rolle: >-
    Du bist IT-Architekt, Senior Software Developer, professioneller Datenbankentwickler
    und Security-Experte für das IIL Platform-Ökosystem (achimdehnert/*).
  tech_stack: >-
    Python 3.12 · Django 5.x · PostgreSQL 16 + pgvector · Redis · Celery · Docker ·
    GitHub Actions · Hetzner Cloud · HTMX · Gunicorn · pytest · ruff · bandit · pydantic v2
  format: |
    [BLOCK]    — Datei:Zeile · Problem · ADR-Referenz · Fix-Snippet
    [SUGGEST]  — Empfehlung mit Begründung
    [QUESTION] — Klärungsbedarf
    [NITS]     — Kleinigkeit

    Gesamturteil:
    ✅ APPROVED | ⚠️ APPROVED WITH COMMENTS | ❌ CHANGES REQUESTED

regeln:

  # ───────────────────────── Bot-Tabu: Pfade, bei denen der Bot nicht urteilt ──────────
  # Herkunft: TABU in tools/bot_review_kandidaten.py (Owner-Go 2026-08-25, #2676)

  - id: RR-001
    titel: Policies bleiben Mensch
    klasse: BLOCK
    geltung:
      pfade: ["policies/*"]
      profile: [default, deployed, library]
    detektor:
      typ: pfad
      muster: ["policies/*"]
    begruendung:
      quelle: .github/workflows/bot-review.yml
      text: Regeln fuer alle Sitzungen; der Bot approvt keine Aenderung an den Regeln, nach denen er selbst arbeitet.
    konsumenten: [bot-tabu]
    seit: 2026-08-25
    praezision: null
    status: aktiv

  - id: RR-002
    titel: ADRs bleiben Mensch
    klasse: BLOCK
    geltung:
      pfade: ["docs/adr/*"]
      profile: [default, deployed, library]
    detektor:
      typ: pfad
      muster: ["docs/adr/*"]
    begruendung:
      quelle: policies/adr-threshold.md
      text: Architektur-Entscheidungen brauchen ein menschliches Urteil.
    konsumenten: [bot-tabu]
    seit: 2026-08-25
    praezision: null
    status: aktiv

  - id: RR-003
    titel: CODEOWNERS bleibt Mensch
    klasse: BLOCK
    geltung:
      pfade: [".github/CODEOWNERS"]
      profile: [default, deployed, library]
    detektor:
      typ: pfad
      muster: [".github/CODEOWNERS"]
    begruendung:
      quelle: .github/workflows/bot-review.yml
      text: Wer reviewen darf, legt kein Bot fest.
    konsumenten: [bot-tabu]
    seit: 2026-08-25
    praezision: null
    status: aktiv

  - id: RR-004
    titel: Bot gibt seine eigene Regel nicht frei
    klasse: BLOCK
    geltung:
      pfade:
        - .github/workflows/bot-review.yml
        - .github/workflows/_bot-review.yml
        - tools/bot_review_kandidaten.py
        - tools/review_regeln.py
        - registry/review-regeln.yaml
      profile: [default, deployed, library]
    detektor:
      typ: pfad
      muster:
        - .github/workflows/bot-review.yml
        - .github/workflows/_bot-review.yml
        - tools/bot_review_kandidaten.py
        - tools/review_regeln.py
        - registry/review-regeln.yaml
    begruendung:
      quelle: .github/workflows/bot-review.yml
      text: >-
        Workflow, Auswahlmodul, Regel-Lader und diese Regeldatei definieren das Urteil des
        Bots; er darf sie nicht selbst approven (Lotsen-Charta Art. 3). shared-ci-Caller
        `_bot-review.yml` seit platform#3268; Lader und Regeldatei seit WP1 (#3903).
    konsumenten: [bot-tabu]
    seit: 2026-08-25
    praezision: null
    status: aktiv

  # Herkunft: shared-ci tools/bot_review_kandidaten.py TABU_PRAEFIX_GLOB / TABU_MUSTER (platform#3244)

  - id: RR-005
    titel: Prod-Deploy-Definition bleibt Mensch
    klasse: BLOCK
    geltung:
      pfade: [".github/workflows/deploy*"]
      profile: [deployed]
    detektor:
      typ: pfad
      muster: [".github/workflows/deploy*"]
    begruendung:
      quelle: ~/.claude/policies/autonomy-gates.md
      text: Gate Prod — die Deploy-Definition entscheidet, was auf den Host geht.
    konsumenten: [bot-tabu]
    seit: 2026-09-14
    praezision: null
    status: aktiv

  - id: RR-006
    titel: Datenmigrationen bleiben Mensch
    klasse: BLOCK
    geltung:
      pfade: ["*/migrations/*", "migrations/*"]
      profile: [deployed]
    detektor:
      typ: pfad
      muster: ["*/migrations/*", "migrations/*"]
    begruendung:
      quelle: https://github.com/achimdehnert/platform/issues/3244
      text: Migration = Pruefrage auch bei gruenen Checks (Irreversibles, Gate 1).
    konsumenten: [bot-tabu]
    seit: 2026-09-14
    praezision: null
    status: aktiv

  # ───────────────────────── Architektur-Prinzipien (reviewer.md, 10 Punkte) ──────────────

  - id: RR-010
    titel: Service-Layer
    klasse: WARN
    geltung:
      pfade: ["*views.py"]
      profile: [default, deployed]
    detektor:
      typ: llm
      frage: Enthaelt die View Businesslogik, die in services.py gehoert? Kette views.py → services.py → models.py einhalten.
    begruendung:
      quelle: docs/adr/ADR-041
      text: "**Service-Layer**: `views.py` → `services.py` → `models.py` — keine Businesslogik in Views"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-011
    titel: Kein hardcoded SQL
    klasse: WARN
    geltung:
      pfade: ["*.py"]
      profile: [default, deployed]
    detektor:
      typ: regex
      ziel: hinzugefuegt
      muster: ['\.raw\(', 'cursor\.execute\(', 'RawSQL\(']
    begruendung:
      quelle: docs/adr/ADR-022
      text: "**Kein hardcoded SQL** — ausschließlich Django ORM"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-012
    titel: BigAutoField als Primaerschluessel
    klasse: WARN
    geltung:
      pfade: ["*models.py", "*settings*.py"]
      profile: [default, deployed]
    detektor:
      typ: llm
      frage: Nutzt jedes Modell BigAutoField (DEFAULT_AUTO_FIELD) und kein eigenes UUID-Primary-Key?
    begruendung:
      quelle: .windsurf/rules/reviewer.md
      text: "**BigAutoField** — niemals `UUIDField(primary_key=True)`"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-013
    titel: Config via decouple
    klasse: WARN
    geltung:
      pfade: ["*views.py"]
      profile: [default, deployed]
    detektor:
      typ: regex
      ziel: hinzugefuegt
      muster: ['os\.environ']
    begruendung:
      quelle: docs/adr/ADR-045
      text: "**Config via `decouple.config()`** — niemals `os.environ` direkt in Views"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-014
    titel: Dockerfile-Konventionen
    klasse: WARN
    geltung:
      pfade: ["*Dockerfile*"]
      profile: [deployed]
    detektor:
      typ: llm
      frage: Multi-Stage, Basis python:3.12-slim, Non-Root app:1000, OCI-Labels, HEALTHCHECK per python urllib (kein curl)?
    begruendung:
      quelle: .windsurf/rules/reviewer.md
      text: "**Dockerfile**: Multi-Stage, `python:3.12-slim`, Non-Root `app:1000`, OCI-Labels, HEALTHCHECK via `python urllib` (kein curl)"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-015
