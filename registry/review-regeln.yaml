    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  - id: RR-019
    titel: Secrets nur via decouple
    klasse: WARN
    geltung:
      pfade: ["*.py"]
      profile: [default, deployed, library]
    detektor:
      typ: llm
      frage: Wird jedes Secret ueber decouple.config() gelesen; steht nirgends ein Wert im Klartext?
    begruendung:
      quelle: docs/adr/ADR-045
      text: "**Secrets**: ausschließlich `decouple.config()` — niemals Klartext im Code"
    konsumenten: [reviewer-md, advocatus]
    seit: 2026-03-11
    praezision: null
    status: aktiv

  # ───────────────────────── Verbotene Muster (reviewer.md, BLOCK ohne Ausnahme) ──────────

  - id: RR-020
    titel: UUIDField als Primary Key
    klasse: BLOCK
    geltung:
      pfade: ["*models.py"]
      profile: [default, deployed]
    detektor:
      typ: regex
      ziel: hinzugefuegt
