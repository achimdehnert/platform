    klasse: WARN
    geltung:
      pfade: ["*docker-compose*.yml", "*compose*.yaml"]
      profile: [deployed]
    detektor:
      typ: llm
      frage: env_file statt environment:${VAR} fuer App-Config, separater migrate-Service, Memory-Limits gesetzt?
    begruendung:
      quelle: .windsurf/rules/reviewer.md
      text: "**docker-compose.prod.yml**: `env_file` statt `environment:${VAR}` für App-Config, separater `migrate`-Service, Memory-Limits"
