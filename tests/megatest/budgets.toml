# Hardcoding-Guard Violation Budgets (VERMEIDBAR)
# Ratchet-Pattern: Jeder Repo hat ein Maximum.
# Tests schlagen fehl wenn Violations > Budget (Regression).
# Budget auf 0 setzen = "clean" — jede neue Violation bricht CI.
# Budget reduzieren wenn Violations gefixt werden.
#
# Ziel: alle Repos auf 0 bringen.
# Generiert: 2026-04-21 · Neu-Basierung 2026-08-02 (Megatest-Lauf 30619024656):
#   - 11 Registry-Repos ohne Budget aufgenommen, Werte = Erstmessung gegen
#     origin/main mit praezisierter V-CFG-02-Regel (nur .get ohne Default).
#   - bfagent 72→33, mcp-hub 79→34 neu gemessen (alte Werte stammten aus
#     lokalen Laeufen vom 27.04. mit der breiten Regel).
#   - Alle V-SEC-Funde hinter Budgets >0 wurden einzeln gesichtet:
#     ausnahmslos Test-Attrappen ("test-secret-key-…", "s3cr3t-ingress-token")
#     bzw. V-SEC-03-Fehlgriffe auf REASON_*-Audit-Konstanten (mcp-hub).
# Tool: platform/scripts/check_hardcoded_urls.py --all --category VERMEIDBAR
#
# 2026-08-09 (platform#1682, Bahn A — regelklassen-scharfer Skip fuer geparkten
# Code): mcp-hub 33→21 (12 Funde in `_archive/`), illustration-fw 4→0 (alle vier
# in `docs/spikes/`). Beide Repos massen lokal exakt ihr altes Budget (33 bzw. 4),
# der Klon reproduziert die CI-Basis also — die Senkung ist der gemessene Delta
# des Regel-Umbaus, keine Schaetzung. Alle uebrigen Zeilen BEWUSST unangetastet:
# ihre lokalen Klone sind teils aelter als origin/main, und ein zu tief gesetztes
# Budget faerbt CI rot statt Schulden abzubauen.

