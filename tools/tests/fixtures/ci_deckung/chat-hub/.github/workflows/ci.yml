# CI fuer chat-hub (#1 — Platform-Onboarding).
#
# Was hier NICHT laeuft und warum: kein Synapse, kein LiveKit, kein Tunnel.
# Die Kette, auf die es in diesem Repo ankommt, ist nur gegen den echten
# Server pruefbar (`make chat-verify`) — und der steht auf dem Dev-Host, nicht
# im Runner. Diese CI prueft das, was ohne ihn pruefbar ist: dass die Skripte
# syntaktisch tragen und dass patch_homeserver.py idempotent bleibt.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-und-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell-Skripte
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck deploy/*.sh

      - name: Python
        run: |
          python -m pip install --quiet ruff pyyaml pytest
          ruff check deploy/ tests/

      - name: Python-Formatierung
        run: |
          python -m pip install --quiet ruff
          ruff format --check deploy/ tests/

      - name: Compose- und Unit-Dateien sind gueltiges YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          fehler = 0
          for f in glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f, encoding="utf-8")))
              except Exception as e:
                  print(f"{f}: {e}")
                  fehler += 1
          sys.exit(fehler)
          PY

      - name: Tests
        run: pytest tests/ -q
